<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إتقان لمتابعة الحلقات</title>
    <!-- Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .modal-overlay { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        input[type="checkbox"] { accent-color: #2563eb; width: 1.2rem; height: 1.2rem; cursor: pointer; }
        /* Custom scrollbar for tables */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .animate-fade { animation: fadeIn 0.25s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- SVGs Icons ---
        const Icons = {
            User: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Inbox: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 01-2 2H6a2 2 0 01-2-2m16 0l-8 5-8-5" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>,
            Check: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>,
            Copy: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>,
            Whatsapp: () => <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.94 3.659 1.437 5.63 1.438h.004c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>,
            Excel: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
        };

        // --- Utils ---
        const formatSaudiPhone = (input) => {
            let num = String(input).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, '');
            if (num.startsWith('05')) num = '966' + num.substring(1);
            else if (num.startsWith('5')) num = '966' + num;
            else if (num.length === 9) num = '966' + num;
            return num;
        };

        const initialTemplate = "عزيزي ولي أمر الطالب/ة {student_name}، نفيدكم علماً بغياب الطالب اليوم {date}. نرجو التواصل معنا. علماً أن عدد غياباته الإجمالي: {absence_count}";

        // --- App Logic ---
        const App = () => {
            const [role, setRole] = useState(null);
            const [view, setView] = useState('inbox');
            const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('itqan_v3_students') || '[]'));
            const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('itqan_v3_logs') || '[]'));
            const [template, setTemplate] = useState(() => localStorage.getItem('itqan_v3_template') || initialTemplate);
            
            const [toast, setToast] = useState(null);
            const [pin, setPin] = useState('');
            const [activeMonitorGroup, setActiveMonitorGroup] = useState(null);
            const [attendanceBatch, setAttendanceBatch] = useState({});
            
            // Modals State
            const [editingStudent, setEditingStudent] = useState(null);
            const [showAddModal, setShowAddModal] = useState(false);
            const [newStudent, setNewStudent] = useState({ name: '', phone: '', group: '', active: true });
            
            const [selectedSids, setSelectedSids] = useState([]);
            const [filterGroup, setFilterGroup] = useState('ALL');

            useEffect(() => localStorage.setItem('itqan_v3_students', JSON.stringify(students)), [students]);
            useEffect(() => localStorage.setItem('itqan_v3_logs', JSON.stringify(logs)), [logs]);
            useEffect(() => localStorage.setItem('itqan_v3_template', template), [template]);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            const groups = useMemo(() => [...new Set(students.map(s => s.group))].filter(Boolean), [students]);

            const handleLogin = () => {
                if (pin === '1234') setRole('supervisor');
                else if (pin === '0000') setRole('monitor');
                else alert('الرمز غير صحيح');
                setPin('');
            };

            // Student Management
            const handleAddStudent = (e) => {
                e.preventDefault();
                if(!newStudent.name || !newStudent.phone || !newStudent.group) {
                    alert('يرجى ملء كافة الحقول');
                    return;
                }
                const student = {
                    ...newStudent,
                    id: Date.now(),
                    phone: formatSaudiPhone(newStudent.phone),
                    absences: 0
                };
                setStudents(prev => [...prev, student]);
                setNewStudent({ name: '', phone: '', group: '', active: true });
                setShowAddModal(false);
                showToast("تمت إضافة الطالب بنجاح");
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                setStudents(prev => prev.map(s => s.id === editingStudent.id ? editingStudent : s));
                setEditingStudent(null);
                showToast("تم تحديث بيانات الطالب");
            };

            const deleteStudent = (id) => {
                if(confirm('هل أنت متأكد من حذف هذا الطالب نهائياً؟')) {
                    setStudents(prev => prev.filter(s => s.id !== id));
                    showToast("تم حذف الطالب");
                }
            };

            const handleExcelImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws);
                    
                    const normalized = data.map((row, idx) => {
                        const clean = {};
                        Object.keys(row).forEach(k => clean[k.trim()] = row[k]);
                        return {
                            id: Date.now() + idx,
                            name: String(clean['الاسم'] || clean['Name'] || `طالب ${idx}`).trim(),
                            phone: formatSaudiPhone(clean['الرقم'] || clean['Phone'] || ''),
                            group: String(clean['الحلقة'] || clean['Group'] || 'عام').trim(),
                            absences: parseInt(clean['غيابات'] || 0),
                            active: !String(clean['الحالة'] || '').includes('منقطع')
                        };
                    });
                    setStudents(prev => [...prev, ...normalized]);
                    showToast(`تم استيراد ${normalized.length} طالب`);
                };
                reader.readAsBinaryString(file);
                e.target.value = '';
            };

            // Attendance
            const submitAttendance = () => {
                const absentees = students
                    .filter(s => s.group === activeMonitorGroup && attendanceBatch[s.id])
                    .map(s => s.id);

                const logEntry = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString('ar-SA'),
                    group: activeMonitorGroup,
                    absentees,
                    reviewed: false
                };

                setStudents(prev => prev.map(s => absentees.includes(s.id) ? { ...s, absences: s.absences + 1 } : s));
                setLogs(prev => [logEntry, ...prev]);
                showToast("تم إرسال كشف الغياب");
                setActiveMonitorGroup(null);
                setAttendanceBatch({});
            };

            const filteredStudents = useMemo(() => {
                return filterGroup === 'ALL' ? students : students.filter(s => s.group === filterGroup);
            }, [students, filterGroup]);

            // --- Views ---
            if (!role) return (
                <div className="min-h-screen flex items-center justify-center p-6 bg-slate-900">
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl p-10 animate-fade text-center space-y-8">
                        <div>
                            <div className="bg-blue-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                <Icons.User />
                            </div>
                            <h1 className="text-2xl font-extrabold text-slate-800">نظام إتقان</h1>
                            <p className="text-slate-400 text-sm mt-1">بوابة متابعة الحلقات والطلاب</p>
                        </div>
                        <div className="space-y-4">
                            <input 
                                type="password" 
                                placeholder="رمز الدخول (PIN)" 
                                className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-center text-2xl tracking-widest outline-none focus:border-blue-500 transition-all"
                                value={pin}
                                onChange={e => setPin(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                            />
                            <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg transition-transform active:scale-95">
                                تسجيل الدخول
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen">
                    <header className="sticky top-0 z-40 glass border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 text-white p-2 rounded-lg"><Icons.User /></div>
                            <h2 className="font-bold text-slate-800 text-lg hidden md:block">لوحة تحكم إتقان</h2>
                        </div>
                        <button onClick={() => setRole(null)} className="text-sm font-bold text-red-500 hover:bg-red-50 px-4 py-2 rounded-xl transition-colors">
                            تسجيل الخروج
                        </button>
                    </header>

                    <main className="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
                        {role === 'monitor' ? (
                            /* MONITOR ROLE */
                            <div className="animate-fade space-y-6">
                                {!activeMonitorGroup ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {groups.map(g => (
                                            <button key={g} onClick={() => setActiveMonitorGroup(g)} className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:border-blue-500 hover:shadow-md text-right group transition-all">
                                                <div className="flex justify-between items-start">
                                                    <h3 className="text-xl font-bold text-slate-800">{g}</h3>
                                                    <div className="bg-blue-50 text-blue-600 p-2 rounded-xl group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                                        <Icons.Plus />
                                                    </div>
                                                </div>
                                                <p className="text-slate-400 mt-2 text-sm">{students.filter(s => s.group === g && s.active).length} طالب نشط</p>
                                            </button>
                                        ))}
                                        {groups.length === 0 && <div className="col-span-full py-20 text-center text-slate-400">لا توجد حلقات نشطة</div>}
                                    </div>
                                ) : (
                                    <div className="space-y-4 max-w-2xl mx-auto">
                                        <div className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                            <button onClick={() => setActiveMonitorGroup(null)} className="text-slate-400 font-bold hover:text-slate-600 text-sm">إلغاء</button>
                                            <h2 className="font-bold text-lg">{activeMonitorGroup}</h2>
                                            <div className="w-10"></div>
                                        </div>
                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                            {students.filter(s => s.group === activeMonitorGroup && s.active).map(s => (
                                                <div 
                                                    key={s.id} 
                                                    onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: !prev[s.id]}))}
                                                    className={`p-5 flex justify-between items-center cursor-pointer border-b last:border-0 transition-all ${attendanceBatch[s.id] ? 'bg-red-50' : 'hover:bg-slate-50'}`}
                                                >
                                                    <span className={`font-bold ${attendanceBatch[s.id] ? 'text-red-700' : 'text-slate-700'}`}>{s.name}</span>
                                                    <div className={`w-7 h-7 rounded-full border-2 flex items-center justify-center ${attendanceBatch[s.id] ? 'bg-red-500 border-red-500 text-white' : 'border-slate-200'}`}>
                                                        {attendanceBatch[s.id] && <Icons.Check />}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={submitAttendance} className="w-full bg-green-600 text-white py-5 rounded-2xl font-bold shadow-xl flex items-center justify-center gap-3 active:scale-95 transition-all">
                                            <Icons.Check /> اعتماد وإرسال الكشف
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            /* SUPERVISOR ROLE */
                            <div className="animate-fade space-y-6">
                                <div className="flex bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100">
                                    {['inbox', 'students', 'settings'].map(t => (
                                        <button 
                                            key={t}
                                            onClick={() => setView(t)}
                                            className={`flex-1 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all ${view === t ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}
                                        >
                                            {t === 'inbox' ? <Icons.Inbox /> : t === 'students' ? <Icons.User /> : <Icons.Settings />}
                                            {t === 'inbox' ? 'الوارد' : t === 'students' ? 'الطلاب' : 'الإعدادات'}
                                        </button>
                                    ))}
                                </div>

                                {view === 'inbox' && (
                                    <div className="space-y-4">
                                        {logs.map(log => (
                                            <div key={log.id} className={`bg-white rounded-3xl border transition-all ${log.reviewed ? 'opacity-60' : 'border-blue-100 shadow-sm'}`}>
                                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 rounded-t-3xl">
                                                    <div className="flex items-center gap-3">
                                                        <span className="bg-blue-100 text-blue-700 px-4 py-1 rounded-full text-xs font-bold">{log.group}</span>
                                                        <span className="text-[10px] text-slate-400 font-bold">{log.timestamp}</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => setLogs(prev => prev.map(l => l.id === log.id ? {...l, reviewed: !l.reviewed} : l))}
                                                        className={`text-xs px-4 py-2 rounded-xl font-bold ${log.reviewed ? 'bg-slate-200 text-slate-500' : 'bg-green-100 text-green-700'}`}
                                                    >
                                                        {log.reviewed ? 'مكتمل' : 'جديد'}
                                                    </button>
                                                </div>
                                                <div className="p-5 space-y-3">
                                                    {log.absentees.length === 0 ? (
                                                        <div className="text-center text-green-600 text-sm font-bold">✓ لا يوجد غيابات</div>
                                                    ) : log.absentees.map(sid => {
                                                        const s = students.find(st => st.id === sid);
                                                        if (!s) return null;
                                                        const msg = template
                                                            .replace(/{student_name}/g, s.name)
                                                            .replace(/{date}/g, log.timestamp.split(',')[0])
                                                            .replace(/{absence_count}/g, s.absences);
                                                        
                                                        return (
                                                            <div key={sid} className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                                                <div>
                                                                    <div className="font-bold text-slate-800">{s.name}</div>
                                                                    <div className="text-xs text-slate-400 mt-1">الغيابات: {s.absences} | {s.phone}</div>
                                                                </div>
                                                                <div className="flex gap-2">
                                                                    <button 
                                                                        onClick={() => { navigator.clipboard.writeText(msg); showToast("تم نسخ النص"); }}
                                                                        className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-100"
                                                                    >
                                                                        <Icons.Copy /> نسخ
                                                                    </button>
                                                                    <a 
                                                                        href={`https://wa.me/${s.phone}?text=${encodeURIComponent(msg)}`} 
                                                                        target="_blank"
                                                                        className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-green-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm"
                                                                    >
                                                                        <Icons.Whatsapp /> واتساب
                                                                    </a>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                        {logs.length === 0 && <div className="py-20 text-center text-slate-400 font-bold">لا يوجد تقارير غياب حالياً</div>}
                                    </div>
                                )}

                                {view === 'students' && (
                                    <div className="space-y-6">
                                        <div className="flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between">
                                            <div className="flex gap-2">
                                                <button onClick={() => setShowAddModal(true)} className="flex-1 bg-blue-600 text-white px-5 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg">
                                                    <Icons.Plus /> إضافة طالب يدوياً
                                                </button>
                                                <div className="relative flex items-center justify-center bg-slate-100 text-slate-600 px-5 py-3 rounded-2xl font-bold cursor-pointer hover:bg-slate-200">
                                                    <Icons.Excel />
                                                    <span className="mr-2">استيراد Excel</span>
                                                    <input type="file" accept=".xlsx,.xls,.csv" onChange={handleExcelImport} className="absolute inset-0 opacity-0 cursor-pointer" />
                                                </div>
                                            </div>
                                            <select 
                                                value={filterGroup} 
                                                onChange={e => setFilterGroup(e.target.value)}
                                                className="bg-white border border-slate-200 rounded-2xl px-5 py-3 text-sm font-bold shadow-sm outline-none"
                                            >
                                                <option value="ALL">جميع الطلاب ({students.length})</option>
                                                {groups.map(g => <option key={g} value={g}>{g}</option>)}
                                            </select>
                                        </div>

                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-right text-sm">
                                                    <thead className="bg-slate-50 text-slate-500">
                                                        <tr className="border-b border-slate-100">
                                                            <th className="p-4 font-bold">اسم الطالب</th>
                                                            <th className="p-4 font-bold">الحلقة</th>
                                                            <th className="p-4 font-bold">الغيابات</th>
                                                            <th className="p-4 font-bold">الحالة</th>
                                                            <th className="p-4 font-bold text-center">إجراءات</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-50">
                                                        {filteredStudents.map(s => (
                                                            <tr key={s.id} className={`hover:bg-slate-50/50 ${!s.active ? 'opacity-60 bg-slate-50' : ''}`}>
                                                                <td className="p-4">
                                                                    <div className="font-bold text-slate-800">{s.name}</div>
                                                                    <div className="text-[10px] text-slate-400 font-medium">{s.phone}</div>
                                                                </td>
                                                                <td className="p-4 text-slate-500">{s.group}</td>
                                                                <td className="p-4">
                                                                    <div className="flex items-center gap-2">
                                                                        <span className="font-extrabold">{s.absences}</span>
                                                                        <div className={`w-2 h-2 rounded-full ${s.absences >= 6 ? 'bg-red-500' : s.absences >= 3 ? 'bg-yellow-400' : 'bg-green-500'}`} />
                                                                    </div>
                                                                </td>
                                                                <td className="p-4">
                                                                    <span className={`text-[10px] px-2 py-1 rounded-lg font-bold ${s.active ? 'bg-green-50 text-green-600' : 'bg-slate-200 text-slate-500'}`}>
                                                                        {s.active ? 'نشط' : 'منقطع'}
                                                                    </span>
                                                                </td>
                                                                <td className="p-4">
                                                                    <div className="flex justify-center gap-2">
                                                                        <button onClick={() => setEditingStudent({...s})} className="p-2 text-blue-600 hover:bg-blue-50 rounded-xl transition-all"><Icons.Edit /></button>
                                                                        <button onClick={() => deleteStudent(s.id)} className="p-2 text-red-400 hover:bg-red-50 rounded-xl transition-all"><Icons.Trash /></button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {filteredStudents.length === 0 && (
                                                            <tr><td colSpan="5" className="p-10 text-center text-slate-400">لا يوجد طلاب</td></tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {view === 'settings' && (
                                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6">
                                        <h3 className="font-bold text-slate-800 text-lg">إعدادات رسالة الغياب</h3>
                                        <p className="text-sm text-slate-400">تحكم في محتوى رسالة الواتساب التلقائية:</p>
                                        <div className="flex flex-wrap gap-2 text-[10px]">
                                            {['{student_name}', '{date}', '{absence_count}'].map(tag => (
                                                <span key={tag} className="bg-slate-100 text-slate-500 px-2 py-1 rounded-md border border-slate-200 font-mono">{tag}</span>
                                            ))}
                                        </div>
                                        <textarea 
                                            className="w-full p-5 h-48 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 leading-relaxed font-medium text-sm"
                                            value={template}
                                            onChange={e => setTemplate(e.target.value)}
                                        />
                                        <button onClick={() => showToast("تم حفظ التعديلات")} className="bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition-all">
                                            حفظ الإعدادات
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* ADD MODAL */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddStudent} className="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 animate-fade space-y-5">
                                <h3 className="text-xl font-bold text-slate-800 border-b pb-4">إضافة طالب جديد</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 mb-1 block">اسم الطالب</label>
                                        <input required className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} placeholder="الاسم الكامل" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 mb-1 block">رقم الجوال</label>
                                        <input required className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} placeholder="مثال: 050xxxx" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 mb-1 block">الحلقة</label>
                                        <input required className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500" value={newStudent.group} onChange={e => setNewStudent({...newStudent, group: e.target.value})} placeholder="اسم الحلقة أو الفصل" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 mb-1 block">الحالة</label>
                                        <select className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold" value={newStudent.active ? "true" : "false"} onChange={e => setNewStudent({...newStudent, active: e.target.value === 'true'})}>
                                            <option value="true">نشط (مستمر)</option>
                                            <option value="false">منقطع</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="flex gap-3 pt-4">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg">حفظ البيانات</button>
                                    <button type="button" onClick={() => setShowAddModal(false)} className="px-6 bg-slate-100 text-slate-500 font-bold rounded-2xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* EDIT MODAL */}
                    {editingStudent && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleSaveEdit} className="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 animate-fade space-y-5">
                                <h3 className="text-xl font-bold text-slate-800 border-b pb-4">تعديل بيانات الطالب</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 mb-1 block">اسم الطالب</label>
                                        <input required className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 mb-1 block">الجوال</label>
                                            <input required className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500" value={editingStudent.phone} onChange={e => setEditingStudent({...editingStudent, phone: formatSaudiPhone(e.target.value)})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 mb-1 block">الحلقة</label>
                                            <input required className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-blue-500" value={editingStudent.group} onChange={e => setEditingStudent({...editingStudent, group: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 mb-1 block">غيابات تراكمية</label>
                                            <input type="number" min="0" className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold" value={editingStudent.absences} onChange={e => setEditingStudent({...editingStudent, absences: parseInt(e.target.value || 0)})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-500 mb-1 block">الحالة</label>
                                            <select 
                                                className="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl font-bold" 
                                                value={editingStudent.active ? "true" : "false"} 
                                                onChange={e => setEditingStudent({...editingStudent, active: e.target.value === 'true'})}
                                            >
                                                <option value="true">نشط (مستمر)</option>
                                                <option value="false">منقطع</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-3 pt-4">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg">حفظ التغييرات</button>
                                    <button type="button" onClick={() => setEditingStudent(null)} className="px-6 bg-slate-100 text-slate-500 font-bold rounded-2xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* TOAST CONTAINER */}
                    {toast && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-slate-800 text-white px-6 py-4 rounded-2xl shadow-2xl animate-fade">
                            <div className={toast.type === 'success' ? 'text-green-400' : 'text-red-400'}>
                                <Icons.Check />
                            </div>
                            <span className="text-sm font-bold">{toast.msg}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
