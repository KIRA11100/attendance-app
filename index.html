<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إتقan - الإدارة السحابية المتقدمة</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- XLSX -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        .modal-overlay { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); }
        input[type="checkbox"] { accent-color: #2563eb; width: 1.15rem; height: 1.15rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- إعدادات فايربيس (ضع بيانات مشروعك هنا) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // دوال مساعدة
        const formatSaudiPhone = (input) => {
            if (!input) return '966500000000';
            let num = String(input).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, '');
            if (num.startsWith('05')) num = '966' + num.substring(1);
            else if (num.startsWith('5') && num.length === 9) num = '966' + num;
            else if (num.length === 9) num = '966' + num;
            return num || '966500000000';
        };

        const getTodayDateStr = () => new Date().toISOString().split('T')[0];

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl shadow-xl text-white font-bold text-sm transition-all animate-bounce ${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>
                    {message}
                </div>
            );
        };

        const App = () => {
            const [role, setRole] = useState(null);
            const [view, setView] = useState('inbox');
            const [pin, setPin] = useState('');
            const [students, setStudents] = useState([]);
            const [logs, setLogs] = useState([]);
            const [settings, setSettings] = useState({ 
                absence_template: "عزيزي ولي أمر الطالب {student_name}، نفيدكم بغيابه اليوم {date}. إجمالي غياباته: {absence_count}",
                excused_template: "عزيزي ولي أمر الطالب {student_name}، تم تسجيل استئذان الطالب اليوم {date} بعذر مقبول."
            });
            const [toast, setToast] = useState(null);

            // واجهة المسجل
            const [activeMonitorGroup, setActiveMonitorGroup] = useState(null);
            const [attendanceBatch, setAttendanceBatch] = useState({});

            // النوافذ المنبثقة
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [newStudent, setNewStudent] = useState({ name: '', phone: '', group: '', active: true });
            const [importPreview, setImportPreview] = useState(null);

            const [selectedSids, setSelectedSids] = useState([]);
            const [filterGroup, setFilterGroup] = useState('ALL');
            const [search, setSearch] = useState('');
            const fileInputRef = useRef(null);

            const showToast = (msg, type = 'success') => setToast({ msg, type });

            // الاستماع اللحظي للبيانات من السحابة
            useEffect(() => {
                const unsubStudents = db.collection('students').onSnapshot(snap => {
                    setStudents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, err => showToast("تعذر الاتصال بقاعدة البيانات", "error"));

                const unsubLogs = db.collection('attendance_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }, err => console.error(err));

                const unsubSettings = db.collection('settings').doc('app_config').onSnapshot(doc => {
                    if (doc.exists) setSettings(doc.data());
                });

                return () => { unsubStudents(); unsubLogs(); unsubSettings(); };
            }, []);

            const groups = useMemo(() => [...new Set(students.map(s => String(s.group).trim()))].filter(Boolean), [students]);

            const handleLogin = () => {
                if (pin === '1234') setRole('supervisor');
                else if (pin === '0000') setRole('monitor');
                else showToast('رمز الدخول غير صحيح', 'error');
                setPin('');
            };

            const logout = () => {
                setRole(null);
                setPin('');
                setActiveMonitorGroup(null);
                setAttendanceBatch({});
                setEditingStudent(null);
                setShowAddModal(false);
            };

            // بدء جلسة التحضير مع جلب الحالة السابقة إن وجدت لمنع التكرار
            const handleStartGroupAttendance = (groupName) => {
                const today = getTodayDateStr();
                const sessionId = `${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingLog = logs.find(l => l.id === sessionId);

                const initialMap = {};
                const activeGroupStudents = students.filter(s => String(s.group).trim() === groupName && s.active);

                activeGroupStudents.forEach(s => {
                    if (existingLog) {
                        const rec = existingLog.records?.find(r => String(r.studentId) === String(s.id));
                        initialMap[s.id] = rec ? rec.status : 'present';
                    } else {
                        initialMap[s.id] = 'present';
                    }
                });

                setAttendanceBatch(initialMap);
                setActiveMonitorGroup(groupName);
            };

            // اعتماد التحضير السحابي مع حفظ اللقطة التاريخية الثابتة
            const submitAttendance = async () => {
                const groupName = activeMonitorGroup;
                const today = getTodayDateStr();
                const sessionId = `${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingLog = logs.find(l => l.id === sessionId);

                const activeGroupStudents = students.filter(s => String(s.group).trim() === groupName && s.active);

                // بناء اللقطة التاريخية الثابتة (Immutable Snapshot)
                const snapshotRecords = activeGroupStudents.map(s => ({
                    studentId: String(s.id),
                    name: s.name,
                    phone: s.phone,
                    group: s.group,
                    status: attendanceBatch[s.id] || 'present',
                    contactStatus: 'pending'
                }));

                try {
                    const batch = db.batch();

                    // 1. إعادة ضبط الغيابات السابقة إن كان هذا تعديلاً لكشف مسجل اليوم
                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            if (r.status === 'absent') {
                                const ref = db.collection('students').doc(r.studentId);
                                batch.update(ref, { absences: firebase.firestore.FieldValue.increment(-1) });
                            }
                        });
                    }

                    // 2. تطبيق الغيابات الجديدة
                    snapshotRecords.forEach(r => {
                        if (r.status === 'absent') {
                            const ref = db.collection('students').doc(r.studentId);
                            batch.update(ref, { absences: firebase.firestore.FieldValue.increment(1) });
                        }
                    });

                    // 3. حفظ المحضر في السحابة بمعرّف الجلسة الفريد لمنع تكرار الكشوفات
                    const logRef = db.collection('attendance_logs').doc(sessionId);
                    batch.set(logRef, {
                        id: sessionId,
                        group: groupName,
                        date: today,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        records: snapshotRecords,
                        reviewed: false
                    });

                    await batch.commit();
                    showToast(existingLog ? "تم تعديل كشف اليوم بنجاح" : "تم اعتماد كشف التحضير سحابياً");
                    setActiveMonitorGroup(null);
                    setAttendanceBatch({});
                } catch (err) {
                    console.error(err);
                    showToast("حدث خطأ أثناء الاتصال بقاعدة البيانات", "error");
                }
            };

            // تحويل حالة الغائب إلى مستئذن وتعديل رصيد الغياب في السحابة
            const handleConvertAbsence = async (logId, studentId) => {
                try {
                    const logRef = db.collection('attendance_logs').doc(logId);
                    const logDoc = await logRef.get();
                    if (!logDoc.exists) return;

                    const logData = logDoc.data();
                    const updatedRecords = logData.records.map(r => {
                        if (String(r.studentId) === String(studentId)) {
                            return { ...r, status: 'excused' };
                        }
                        return r;
                    });

                    const batch = db.batch();
                    batch.update(logRef, { records: updatedRecords });
                    batch.update(db.collection('students').doc(String(studentId)), {
                        absences: firebase.firestore.FieldValue.increment(-1)
                    });

                    await batch.commit();
                    showToast("تم تحويل الطالب إلى مستئذن وخصم الغياب");
                } catch (err) {
                    showToast("تعذر التحديث", "error");
                }
            };

            // استيراد الإكسل مع شاشة المعاينة
            const handleExcelFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws, { defval: "" });

                        const parsed = data.map((row, idx) => {
                            const clean = {};
                            Object.keys(row).forEach(k => clean[k.trim()] = String(row[k]).trim());

                            const name = clean['الاسم'] || clean['اسم الطالب'] || clean['name'] || '';
                            const phone = formatSaudiPhone(clean['الرقم'] || clean['رقم الجوال'] || clean['phone'] || '');
                            const group = clean['الحلقة'] || clean['الفصل'] || 'عام';
                            const rawStatus = clean['الحالة'] || 'مستمر';
                            const isActive = !(rawStatus.includes('منقطع') || rawStatus.includes('غير'));

                            return {
                                name,
                                phone,
                                group,
                                absences: parseInt(clean['غيابات'] || 0) || 0,
                                active: isActive
                            };
                        }).filter(s => s.name && s.name.length > 1);

                        if (parsed.length === 0) {
                            showToast("لم يتم العثور على بيانات صالحة", "error");
                            return;
                        }

                        setImportPreview(parsed);
                    } catch (err) {
                        showToast("خطأ في قراءة الملف", "error");
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = '';
            };

            const commitExcelImport = async () => {
                if (!importPreview) return;
                try {
                    const batch = db.batch();
                    importPreview.forEach(s => {
                        const newDocRef = db.collection('students').doc();
                        batch.set(newDocRef, s);
                    });
                    await batch.commit();
                    showToast(`تم استيراد ${importPreview.length} طالب سحابياً`);
                    setImportPreview(null);
                } catch (err) {
                    showToast("خطأ أثناء الحفظ في قاعدة البيانات", "error");
                }
            };

            const handleAddManualStudent = async (e) => {
                e.preventDefault();
                if (!newStudent.name.trim()) return;

                try {
                    await db.collection('students').add({
                        name: newStudent.name.trim(),
                        phone: formatSaudiPhone(newStudent.phone),
                        group: newStudent.group.trim() || 'عام',
                        absences: 0,
                        active: newStudent.active
                    });
                    setNewStudent({ name: '', phone: '', group: '', active: true });
                    setShowAddModal(false);
                    showToast("تمت إضافة الطالب بنجاح");
                } catch (err) {
                    showToast("تعذر حفظ الطالب", "error");
                }
            };

            const handleSaveEdit = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('students').doc(editingStudent.id).update({
                        name: editingStudent.name.trim(),
                        phone: formatSaudiPhone(editingStudent.phone),
                        group: editingStudent.group.trim(),
                        absences: parseInt(editingStudent.absences || 0),
                        active: editingStudent.active === true || editingStudent.active === 'true'
                    });
                    setEditingStudent(null);
                    showToast("تم تحديث بيانات الطالب");
                } catch (err) {
                    showToast("فشل التعديل", "error");
                }
            };

            const deleteSingleStudent = async (id) => {
                if (confirm("هل أنت متأكد من حذف هذا الطالب نهائياً من السحابة؟")) {
                    try {
                        await db.collection('students').doc(id).delete();
                        showToast("تم حذف الطالب");
                    } catch (err) {
                        showToast("تعذر الحذف", "error");
                    }
                }
            };

            const deleteSelectedStudents = async () => {
                if (!confirm(`حذف ${selectedSids.length} طالب محددين نهائياً؟`)) return;
                try {
                    const batch = db.batch();
                    selectedSids.forEach(id => {
                        batch.delete(db.collection('students').doc(id));
                    });
                    await batch.commit();
                    setSelectedSids([]);
                    showToast("تم حذف الطلاب المحددين");
                } catch (err) {
                    showToast("تعذر الحذف", "error");
                }
            };

            const getStatusBadge = (count) => {
                const c = Number(count) || 0;
                if (c >= 6) return <span className="bg-red-100 text-red-700 px-2.5 py-0.5 rounded-md text-xs font-bold">خطر (حمراء)</span>;
                if (c >= 3) return <span className="bg-yellow-100 text-yellow-700 px-2.5 py-0.5 rounded-md text-xs font-bold">تحذير (صفراء)</span>;
                return <span className="bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-md text-xs font-bold">طبيعي</span>;
            };

            const filteredStudents = useMemo(() => {
                return students.filter(s => {
                    const matchGroup = filterGroup === 'ALL' || String(s.group).trim() === filterGroup;
                    const matchSearch = s.name.includes(search) || s.phone.includes(search);
                    return matchGroup && matchSearch;
                });
            }, [students, filterGroup, search]);

            if (!role) return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-6 text-center">
                        <div className="w-16 h-16 bg-blue-600 text-white text-3xl font-bold rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">✓</div>
                        <h1 className="text-2xl font-extrabold text-slate-800">منصة إتقان السحابية</h1>
                        <p className="text-slate-400 text-sm">مزامنة سحابية فورية بين المشرف والمسجل</p>
                        <div className="space-y-4">
                            <input 
                                type="password" 
                                placeholder="أدخل رمز الدخول (PIN)" 
                                className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-2xl tracking-widest outline-none focus:border-blue-600 transition-all"
                                value={pin}
                                onChange={e => setPin(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                            />
                            <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-bold text-lg shadow-lg">
                                تسجيل الدخول
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 max-w-5xl mx-auto">
                    <header className="sticky top-0 z-30 glass border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2">
                            <span className="bg-blue-600 text-white px-3 py-1.5 rounded-xl font-bold text-sm">إتقان السحابي</span>
                            <span className="font-bold text-slate-700">{role === 'supervisor' ? 'لوحة تحكم المشرف' : 'بوابة مسجل الغياب'}</span>
                        </div>
                        <button onClick={logout} className="text-xs font-bold text-red-500 hover:bg-red-50 px-3 py-2 rounded-xl">تسجيل الخروج</button>
                    </header>

                    <main className="p-4 md:p-6">
                        {role === 'monitor' ? (
                            <div className="space-y-6">
                                {!activeMonitorGroup ? (
                                    <div className="space-y-4">
                                        <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 flex justify-between items-center">
                                            <div>
                                                <h2 className="font-bold text-blue-900 text-lg">قائمة الحلقات</h2>
                                                <p className="text-xs text-blue-600 mt-1">اضغط على الحلقة لبدء رصد التحضير</p>
                                            </div>
                                            <span className="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">{groups.length} حلقات</span>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {groups.map(g => {
                                                const count = students.filter(s => String(s.group).trim() === g && s.active).length;
                                                const isDoneToday = logs.some(l => l.id === `${g.replace(/\s+/g, '_')}_${getTodayDateStr()}`);
                                                return (
                                                    <div 
                                                        key={g} 
                                                        onClick={() => handleStartGroupAttendance(g)}
                                                        className="bg-white p-5 rounded-3xl border border-slate-100 hover:border-blue-400 hover:shadow-md cursor-pointer flex justify-between items-center transition-all"
                                                    >
                                                        <div>
                                                            <h3 className="font-bold text-slate-800 text-lg">{g}</h3>
                                                            <p className="text-xs text-slate-400 mt-1">{count} طالب نشط</p>
                                                            {isDoneToday && <span className="inline-block mt-2 text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded">تم الرصد اليوم (اضغط للتعديل)</span>}
                                                        </div>
                                                        <span className="text-blue-600 font-bold text-xl">←</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-4 max-w-2xl mx-auto">
                                        <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                            <button onClick={() => setActiveMonitorGroup(null)} className="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-2 rounded-xl">
                                                → رجوع للحلقات
                                            </button>
                                            <h2 className="font-bold text-lg text-slate-800">{activeMonitorGroup}</h2>
                                            <div className="flex gap-2 text-xs font-bold">
                                                <span className="text-red-500">{Object.values(attendanceBatch).filter(v => v === 'absent').length} غائب</span>
                                                <span className="text-amber-600">{Object.values(attendanceBatch).filter(v => v === 'excused').length} مستئذن</span>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden divide-y divide-slate-50">
                                            {students.filter(s => String(s.group).trim() === activeMonitorGroup && s.active).map(s => {
                                                const currentStatus = attendanceBatch[s.id] || 'present';
                                                return (
                                                    <div key={s.id} className={`p-4 flex justify-between items-center transition-colors ${currentStatus === 'absent' ? 'bg-red-50' : currentStatus === 'excused' ? 'bg-amber-50' : ''}`}>
                                                        <div>
                                                            <span className="font-bold text-base text-slate-800">{s.name}</span>
                                                            <span className="text-xs text-slate-400 block">الغيابات السابقة: {s.absences || 0}</span>
                                                        </div>
                                                        <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                            <button onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: 'present'}))} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${currentStatus === 'present' ? 'bg-emerald-600 text-white' : 'text-slate-600'}`}>حاضر</button>
                                                            <button onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: 'excused'}))} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${currentStatus === 'excused' ? 'bg-amber-500 text-white' : 'text-slate-600'}`}>مستئذن</button>
                                                            <button onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: 'absent'}))} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${currentStatus === 'absent' ? 'bg-red-600 text-white' : 'text-slate-600'}`}>غائب</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <button onClick={submitAttendance} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-bold shadow-lg">
                                            اعتماد وإرسال الكشف سحابياً ✓
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="flex bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm">
                                    {['inbox', 'students', 'settings'].map(t => (
                                        <button 
                                            key={t} 
                                            onClick={() => setView(t)} 
                                            className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all ${view === t ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500'}`}
                                        >
                                            {t === 'inbox' ? 'الوارد' : t === 'students' ? 'الطلاب والحلقات' : 'الإعدادات'}
                                        </button>
                                    ))}
                                </div>

                                {view === 'inbox' && (
                                    <div className="space-y-4">
                                        {logs.map(log => {
                                            const absentees = log.records?.filter(r => r.status === 'absent') || [];
                                            const excused = log.records?.filter(r => r.status === 'excused') || [];

                                            return (
                                                <div key={log.id} className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 space-y-4">
                                                    <div className="flex justify-between items-center border-b pb-3">
                                                        <div>
                                                            <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">{log.group}</span>
                                                            <span className="text-xs text-slate-400 mr-2">{log.date}</span>
                                                        </div>
                                                        <span className={`text-xs px-3 py-1 rounded-full font-bold ${log.reviewed ? 'bg-slate-100 text-slate-500' : 'bg-emerald-100 text-emerald-700'}`}>
                                                            {log.reviewed ? 'تمت المراجعة' : 'جديد'}
                                                        </span>
                                                    </div>

                                                    <div className="space-y-2">
                                                        {absentees.map(r => {
                                                            const currentStu = students.find(s => String(s.id) === String(r.studentId));
                                                            const msg = settings.absence_template
                                                                .replace(/{student_name}/g, r.name)
                                                                .replace(/{date}/g, log.date)
                                                                .replace(/{absence_count}/g, currentStu?.absences || 0);

                                                            return (
                                                                <div key={r.studentId} className="flex justify-between items-center bg-red-50 p-3 rounded-2xl border border-red-100">
                                                                    <div>
                                                                        <div className="font-bold text-sm text-slate-800">{r.name} (غائب)</div>
                                                                        <div className="text-xs text-slate-400" dir="ltr">{r.phone}</div>
                                                                    </div>
                                                                    <div className="flex gap-2">
                                                                        <button onClick={() => handleConvertAbsence(log.id, r.studentId)} className="bg-amber-100 text-amber-900 px-3 py-1 rounded-xl text-xs font-bold">تحويل لمستئذن ⏱️</button>
                                                                        <a href={`https://wa.me/${r.phone}?text=${encodeURIComponent(msg)}`} target="_blank" className="bg-emerald-500 text-white px-3 py-1 rounded-xl text-xs font-bold">واتساب 💬</a>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}

                                                        {excused.map(r => {
                                                            const msg = settings.excused_template.replace(/{student_name}/g, r.name).replace(/{date}/g, log.date);
                                                            return (
                                                                <div key={r.studentId} className="flex justify-between items-center bg-amber-50 p-3 rounded-2xl border border-amber-100">
                                                                    <div>
                                                                        <div className="font-bold text-sm text-slate-800">{r.name} (مستئذن بعذر)</div>
                                                                        <div className="text-xs text-slate-400" dir="ltr">{r.phone}</div>
                                                                    </div>
                                                                    <a href={`https://wa.me/${r.phone}?text=${encodeURIComponent(msg)}`} target="_blank" className="bg-emerald-500 text-white px-3 py-1 rounded-xl text-xs font-bold">واتساب 💬</a>
                                                                </div>
                                                            );
                                                        })}

                                                        {absentees.length === 0 && excused.length === 0 && (
                                                            <div className="text-center text-emerald-600 text-sm font-bold py-2">✓ جميع الطلاب حاضرون</div>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {logs.length === 0 && <div className="text-center py-20 text-slate-400 font-bold">لا توجد تقارير واردة حتى الآن</div>}
                                    </div>
                                )}

                                {view === 'students' && (
                                    <div className="space-y-4">
                                        <div className="flex flex-wrap justify-between items-center gap-3 bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                                            <div className="flex gap-2">
                                                <button onClick={() => setShowAddModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">+ إضافة طالب</button>
                                                <label className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">
                                                    📊 استيراد Excel
                                                    <input type="file" ref={fileInputRef} accept=".xlsx,.xls,.csv" onChange={handleExcelFileSelect} className="hidden" />
                                                </label>
                                            </div>
                                            <input 
                                                type="text" placeholder="بحث باسم الطالب أو الجوال..." 
                                                className="bg-slate-50 border rounded-xl px-4 py-2 text-xs outline-none w-full md:w-64"
                                                value={search} onChange={e => setSearch(e.target.value)}
                                            />
                                        </div>

                                        <div className="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm">
                                            <div className="p-4 border-b flex justify-between items-center bg-slate-50/50">
                                                <select value={filterGroup} onChange={e => setFilterGroup(e.target.value)} className="bg-white border rounded-xl px-3 py-1 text-xs font-bold">
                                                    <option value="ALL">جميع الحلقات ({students.length})</option>
                                                    {groups.map(g => <option key={g} value={g}>{g}</option>)}
                                                </select>
                                                {selectedSids.length > 0 && (
                                                    <button onClick={deleteSelectedStudents} className="bg-red-600 text-white px-3 py-1 rounded-xl text-xs font-bold">
                                                        حذف ({selectedSids.length}) محددين
                                                    </button>
                                                )}
                                            </div>

                                            <table className="w-full text-right text-sm">
                                                <thead className="bg-slate-50 text-slate-500 text-xs">
                                                    <tr>
                                                        <th className="p-4 w-10">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={filteredStudents.length > 0 && selectedSids.length === filteredStudents.length}
                                                                onChange={e => setSelectedSids(e.target.checked ? filteredStudents.map(s => s.id) : [])}
                                                            />
                                                        </th>
                                                        <th className="p-4 font-bold">الطالب</th>
                                                        <th className="p-4 font-bold">الحلقة</th>
                                                        <th className="p-4 font-bold">الغيابات</th>
                                                        <th className="p-4 font-bold">الحالة</th>
                                                        <th className="p-4 font-bold text-center">الخيارات</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredStudents.map(s => (
                                                        <tr key={s.id} className="hover:bg-slate-50">
                                                            <td className="p-4">
                                                                <input 
                                                                    type="checkbox" 
                                                                    checked={selectedSids.includes(s.id)}
                                                                    onChange={() => setSelectedSids(prev => prev.includes(s.id) ? prev.filter(i => i !== s.id) : [...prev, s.id])}
                                                                />
                                                            </td>
                                                            <td className="p-4">
                                                                <div className="font-bold text-slate-800">{s.name}</div>
                                                                <div className="text-xs text-slate-400" dir="ltr">{s.phone}</div>
                                                            </td>
                                                            <td className="p-4 text-slate-600 font-medium">{s.group}</td>
                                                            <td className="p-4">{getStatusBadge(s.absences)}</td>
                                                            <td className="p-4">
                                                                <span className={`text-[10px] px-2.5 py-1 rounded-md font-bold ${s.active ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-200 text-slate-600'}`}>
                                                                    {s.active ? 'مستمر' : 'منقطع'}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 text-center">
                                                                <div className="flex justify-center gap-2">
                                                                    <button onClick={() => setEditingStudent({...s})} className="bg-blue-50 text-blue-600 px-3 py-1 rounded-xl font-bold text-xs">تعديل ✏️</button>
                                                                    <button onClick={() => deleteSingleStudent(s.id)} className="bg-red-50 text-red-600 px-3 py-1 rounded-xl font-bold text-xs">حذف 🗑️</button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {view === 'settings' && (
                                    <div className="bg-white p-6 rounded-3xl border border-slate-100 space-y-6 shadow-sm">
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة الغياب (بدون عذر)</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-28 text-sm outline-none" value={settings.absence_template} onChange={e => setSettings({...settings, absence_template: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة الاستئذان (بعذر)</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-28 text-sm outline-none" value={settings.excused_template} onChange={e => setSettings({...settings, excused_template: e.target.value})} />
                                        </div>
                                        <button onClick={() => { db.collection('settings').doc('app_config').set(settings); showToast("تم حفظ الإعدادات سحابياً"); }} className="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-md">
                                            حفظ الإعدادات
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* نافذة إضافة طالب يدوياً */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddManualStudent} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <h3 className="text-lg font-bold border-b pb-2">إضافة طالب سحابياً</h3>
                                <input required placeholder="اسم الطالب الكامل" className="w-full p-3 bg-slate-50 border rounded-xl" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                <input required placeholder="رقم الجوال (05xxxx)" className="w-full p-3 bg-slate-50 border rounded-xl" dir="ltr" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} />
                                <input required placeholder="اسم الحلقة أو الفصل" className="w-full p-3 bg-slate-50 border rounded-xl" value={newStudent.group} onChange={e => setNewStudent({...newStudent, group: e.target.value})} />
                                <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold" value={newStudent.active ? "true" : "false"} onChange={e => setNewStudent({...newStudent, active: e.target.value === 'true'})}>
                                    <option value="true">مستمر (نشط)</option>
                                    <option value="false">منقطع</option>
                                </select>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">حفظ في السحابة</button>
                                    <button type="button" onClick={() => setShowAddModal(false)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* نافذة تعديل بيانات الطالب */}
                    {editingStudent && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleSaveEdit} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <h3 className="text-lg font-bold border-b pb-2">تعديل بيانات الطالب</h3>
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} />
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl" dir="ltr" value={editingStudent.phone} onChange={e => setEditingStudent({...editingStudent, phone: e.target.value})} />
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl" value={editingStudent.group} onChange={e => setEditingStudent({...editingStudent, group: e.target.value})} />
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="number" min="0" className="w-full p-3 bg-slate-50 border rounded-xl" value={editingStudent.absences} onChange={e => setEditingStudent({...editingStudent, absences: e.target.value})} />
                                    <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold" value={editingStudent.active ? "true" : "false"} onChange={e => setEditingStudent({...editingStudent, active: e.target.value === 'true'})}>
                                        <option value="true">مستمر</option>
                                        <option value="false">منقطع</option>
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">تحديث السحابة</button>
                                    <button type="button" onClick={() => setEditingStudent(null)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* نافذة معاينة استيراد الإكسل */}
                    {importPreview && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 max-h-[85vh] flex flex-col">
                                <h3 className="text-lg font-bold border-b pb-2">معاينة استيراد الطلاب ({importPreview.length})</h3>
                                <div className="overflow-y-auto flex-1 divide-y divide-slate-100">
                                    {importPreview.map((p, i) => (
                                        <div key={i} className="py-2 flex justify-between items-center text-xs">
                                            <div>
                                                <div className="font-bold text-slate-800">{p.name}</div>
                                                <div className="text-slate-400" dir="ltr">{p.phone}</div>
                                            </div>
                                            <span className="bg-slate-100 px-2 py-1 rounded font-bold">{p.group}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2 pt-2 border-t">
                                    <button onClick={commitExcelImport} className="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl">تأكيد الاستيراد السحابي</button>
                                    <button onClick={() => setImportPreview(null)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
