<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDbKUezmXISXgC6PL170-soS-d3_lbKf1U",
            authDomain: "itqan-app-3c7a0.firebaseapp.com",
            projectId: "itqan-app-3c7a0",
            storageBucket: "itqan-app-3c7a0.firebasestorage.app",
            messagingSenderId: "896345573209",
            appId: "1:896345573209:web:cd394d95e092a6361f2e48"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- Utility Functions for Device Management ---
        const getDeviceId = () => {
            let id = localStorage.getItem('itqan_deviceId');
            if (!id) {
                id = 'dev_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                localStorage.setItem('itqan_deviceId', id);
            }
            return id;
        };

        const getDeviceOSDetails = () => {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return "Android Device";
            if (/iPad|iPhone|iPod/.test(ua)) return "iOS Device (iPhone/iPad)";
            if (/Windows/i.test(ua)) return "Windows PC";
            if (/Mac/i.test(ua)) return "MacBook/Mac";
            if (/Linux/i.test(ua)) return "Linux System";
            return "متصفح ويب";
        };

        const fetchLocation = async () => {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return `${data.city || 'غير محدد'} - ${data.region || 'السعودية'}`;
            } catch (e) {
                return "القصيم - المملكة العربية السعودية (تقريبي)";
            }
        };

        const formatSaudiPhone = (input) => {
            if (!input) return '966500000000';
            let num = String(input).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, '');
            if (num.startsWith('05')) num = '966' + num.substring(1);
            else if (num.startsWith('5') && num.length === 9) num = '966' + num;
            else if (num.length === 9) num = '966' + num;
            return num || '966500000000';
        };

        const getTodayDateStr = () => new Date().toISOString().split('T')[0];

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl shadow-2xl text-white font-bold text-sm transition-all animate-bounce ${type === 'success' ? 'bg-emerald-600 border border-emerald-500' : 'bg-rose-600 border border-rose-500'}`}>
                    {message}
                </div>
            );
        };

        const getHomeworkAlert = (missedCount) => {
            const count = Number(missedCount) || 0;
            if (count >= 15) return { level: 'exceeded', text: 'تجاوز الحد (15+)', color: 'bg-rose-900 text-white' };
            if (count >= 14) return { level: 'final', text: 'التنبيه النهائي (14)', color: 'bg-rose-600 text-white' };
            if (count >= 10) return { level: 'second', text: 'التنبيه الثاني (10)', color: 'bg-amber-600 text-white' };
            if (count >= 5) return { level: 'first', text: 'التنبيه الأول (5)', color: 'bg-amber-100 text-amber-800' };
            return { level: 'none', text: 'منتظم', color: 'bg-emerald-50 text-emerald-700' };
        };

        const getAbsenceCategory = (absences) => {
            const c = Number(absences) || 0;
            if (c >= 6) return 'danger';
            if (c >= 3) return 'warning';
            return 'normal';
        };

        const EXAM_TYPES = [
            { id: 'formative_1', title: 'الاختبار البنائي الأول', isFinal: false },
            { id: 'formative_2', title: 'الاختبار البنائي الثاني', isFinal: false },
            { id: 'formative_3', title: 'الاختبار البنائي الثالث', isFinal: false },
            { id: 'formative_4', title: 'الاختبار البنائي الرابع', isFinal: false },
            { id: 'final_exam', title: 'الاختبار النهائي', isFinal: true }
        ];

        const STYLES = {
            header: {
                fill: { fgColor: { rgb: "065F46" } },
                font: { name: "Arial", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } }
            },
            normalCell: {
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "E2E8F0" } }, bottom: { style: "thin", color: { rgb: "E2E8F0" } }, left: { style: "thin", color: { rgb: "E2E8F0" } }, right: { style: "thin", color: { rgb: "E2E8F0" } } }
            },
            greenCell: {
                fill: { fgColor: { rgb: "DCFCE7" } },
                font: { color: { rgb: "166534" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            yellowCell: {
                fill: { fgColor: { rgb: "FEF9C3" } },
                font: { color: { rgb: "854D0E" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            orangeCell: {
                fill: { fgColor: { rgb: "FFEDD5" } },
                font: { color: { rgb: "9A3412" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            redCell: {
                fill: { fgColor: { rgb: "FEE2E2" } },
                font: { color: { rgb: "991B1B" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            }
        };

        const App = () => {
            const [role, setRole] = useState(() => localStorage.getItem('itqan_role') || null);
            const [currentTeacher, setCurrentTeacher] = useState(() => {
                const saved = localStorage.getItem('itqan_teacher');
                return saved ? JSON.parse(saved) : null;
            });
            const [teacherTab, setTeacherTab] = useState('attendance');
            
            const [view, setView] = useState('inbox');
            const [inboxSubTab, setInboxSubTab] = useState('attendance');
            const [pin, setPin] = useState('');
            const [showPin, setShowPin] = useState(false);
            const [isBlocked, setIsBlocked] = useState(false);
            
            const [students, setStudents] = useState([]);
            const [teachers, setTeachers] = useState([]);
            const [logs, setLogs] = useState([]);
            const [homeworkLogs, setHomeworkLogs] = useState([]);
            const [pledgeLogs, setPledgeLogs] = useState([]);
            const [teacherLogs, setTeacherLogs] = useState([]);
            const [activeDevices, setActiveDevices] = useState([]);
            
            const [settings, setSettings] = useState({ 
                absence_template: "عزيزي ولي أمر الطالب {student_name}، نفيدكم بغيابه اليوم {date}. إجمالي غياباته: {absence_count}",
                excused_template: "عزيزي ولي أمر الطالب {student_name}، تم تسجيل استئذان الطالب اليوم {date} بعذر مقبول.",
                homework_template: "عزيزي ولي أمر الطالب {student_name}، نود إشعاركم بعدم تسليمه لواجب اليوم {date}. إجمالي مرات عدم التسليم: {missed_count} واجبات ({alert_status}). نأمل متابعته حرصاً على مستواه.",
                listener_template: "السلام عليكم ورحمة الله وبركاته، المكرم ولي أمر الطالب {student_name}، نفيدكم بأنه نظراً لتجاوز الطالب الحد الأعلى المسموح به في اللائحة ({reason})، تقرر تحويل صفة قيده إلى (مستمع) مما يترتب عليه استمرار الحضور دون استحقاق الجوائز والتكريم والشهادات ومتابعة الضعف. يُمنح فرصة واحدة للعودة لصفة منتظم عند التزامه أسبوعين متتاليين دون مخالفة.",
                formative_exam_template: "السلام عليكم ورحمة الله وبركاته، نفيدكم بنتيجة الطالب {student_name} في ({exam_name}): تقدير الطالب هو [{grade}]. ملاحظة المعلم: {notes}. نسأل الله له دوام التوفيق والتميز.",
                final_exam_template: "السلام عليكم ورحمة الله وبركاته، نبارك لكم نتائج نهاية الفصل. نفيدكم بأن الطالب {student_name} في (الاختبار النهائي) قد حصل على نتيجة: [{grade}]. ملاحظة المعلم: {notes}. سائلين المولى له التوفيق."
            });
            const [toast, setToast] = useState(null);

            const [activeMonitorGroup, setActiveMonitorGroup] = useState(null);
            const [monitorMode, setMonitorMode] = useState('attendance');
            const [attendanceBatch, setAttendanceBatch] = useState({});
            const [homeworkBatch, setHomeworkBatch] = useState({});
            const [isMonitoringTeachers, setIsMonitoringTeachers] = useState(false);

            const [showAddModal, setShowAddModal] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [newStudent, setNewStudent] = useState({ name: '', phone: '', group: '', active: true, pledges: 0, missedHomework: 0 });
            const [importPreview, setImportPreview] = useState(null);
            const [selectedSids, setSelectedSids] = useState([]);
            const [filterGroup, setFilterGroup] = useState('ALL');
            const [filterAbsence, setFilterAbsence] = useState('ALL');
            const [filterHomework, setFilterHomework] = useState('ALL');
            const [filterStatus, setFilterStatus] = useState('ALL');
            const [search, setSearch] = useState('');
            const fileInputRef = useRef(null);

            const [selectedExamType, setSelectedExamType] = useState('formative_1');
            const [examFilterGroup, setExamFilterGroup] = useState('ALL');

            const [showPledgeModal, setShowPledgeModal] = useState(null);
            const [pledgeReason, setPledgeReason] = useState('');

            const [showAddTeacherModal, setShowAddTeacherModal] = useState(false);
            const [newTeacher, setNewTeacher] = useState({ name: '', phone: '', subject: '', pin: '' });
            const [teacherAttendanceBatch, setTeacherAttendanceBatch] = useState({});

            const showToast = (message, type = 'success') => setToast({ message, type });

            // --- Real-time Device Monitoring & Security Hook ---
            useEffect(() => {
                const deviceId = getDeviceId();
                const unsubDevice = db.collection('active_devices').doc(deviceId).onSnapshot(doc => {
                    if (doc.exists) {
                        const devData = doc.data();
                        if (devData.status === 'blocked') {
                            setIsBlocked(true);
                            logoutSilently();
                        } else if (devData.status === 'kicked') {
                            logoutSilently();
                            showToast("تم إنهاء جلستك من قِبل المشرف", "error");
                        }
                    }
                });
                return () => unsubDevice();
            }, []);

            useEffect(() => {
                const unsubStudents = db.collection('students').onSnapshot(snap => {
                    setStudents(snap.docs.map(doc => ({ 
                        id: doc.id, 
                        pledges: 0, 
                        missedHomework: 0, 
                        absences: 0, 
                        exams: {}, 
                        examNotes: {}, 
                        ...doc.data() 
                    })));
                });

                const unsubTeachers = db.collection('teachers').onSnapshot(snap => {
                    setTeachers(snap.docs.map(doc => ({ id: doc.id, presentCount: 0, absentCount: 0, excusedCount: 0, pin: '', ...doc.data() })));
                });

                const unsubLogs = db.collection('attendance_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubHwLogs = db.collection('homework_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setHomeworkLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubTeacherLogs = db.collection('teacher_attendance_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setTeacherLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubPledges = db.collection('pledges_logs').orderBy('timestamp', 'desc').onSnapshot(snap => {
                    setPledgeLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubDevices = db.collection('active_devices').orderBy('lastLogin', 'desc').onSnapshot(snap => {
                    setActiveDevices(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubSettings = db.collection('settings').doc('app_config').onSnapshot(doc => {
                    if (doc.exists) setSettings(prev => ({ ...prev, ...doc.data() }));
                });

                return () => {
                    unsubStudents(); unsubTeachers(); unsubLogs(); unsubHwLogs();
                    unsubTeacherLogs(); unsubPledges(); unsubDevices(); unsubSettings();
                };
            }, []);

            useEffect(() => {
                const today = getTodayDateStr();
                const todayLog = teacherLogs.find(l => l.date === today);
                const map = {};
                teachers.forEach(t => {
                    if (todayLog && todayLog.records) {
                        const rec = todayLog.records.find(r => String(r.teacherId) === String(t.id));
                        map[t.id] = rec ? rec.status : 'present';
                    } else {
                        map[t.id] = 'present';
                    }
                });
                setTeacherAttendanceBatch(map);
            }, [teachers, teacherLogs]);

            const groups = useMemo(() => {
                const uniqueGroups = [...new Set(students.map(s => String(s.group).trim()))].filter(Boolean);
                return uniqueGroups.sort((a, b) => a.localeCompare(b, 'ar'));
            }, [students]);

            const sortedTeachers = useMemo(() => {
                return [...teachers].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            }, [teachers]);

            const handleLogin = async () => {
                if (isBlocked) return;
                const trimmedPin = pin.trim();
                if (!trimmedPin) return;

                let finalRole = null;
                let teacherObj = null;

                if (trimmedPin === '1234') {
                    finalRole = 'supervisor';
                    showToast('تم تسجيل الدخول كمشرف عام');
                } else if (trimmedPin === '0000') {
                    finalRole = 'monitor';
                    showToast('تم تسجيل الدخول كمسجل عام');
                } else {
                    const matchedTeacher = teachers.find(t => t.pin && String(t.pin).trim() === trimmedPin);
                    if (matchedTeacher) {
                        finalRole = 'teacher';
                        teacherObj = matchedTeacher;
                        showToast(`مرحباً بالأستاذ ${matchedTeacher.name}`);
                    } else {
                        showToast('رمز الدخول غير صحيح، يرجى المحاولة مرة أخرى', 'error');
                        return;
                    }
                }

                // Register Device
                const deviceId = getDeviceId();
                const currentStatusDoc = await db.collection('active_devices').doc(deviceId).get();
                if (currentStatusDoc.exists && currentStatusDoc.data().status === 'blocked') {
                    setIsBlocked(true);
                    showToast("هذا الجهاز محظور من الدخول نهائياً", "error");
                    return;
                }

                const locationData = await fetchLocation();
                await db.collection('active_devices').doc(deviceId).set({
                    deviceId: deviceId,
                    role: teacherObj ? teacherObj.name : (finalRole === 'supervisor' ? 'المشرف العام' : 'المسجل العام'),
                    deviceName: getDeviceOSDetails(),
                    location: locationData,
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'active'
                });

                setRole(finalRole);
                setCurrentTeacher(teacherObj);
                localStorage.setItem('itqan_role', finalRole);
                if (teacherObj) localStorage.setItem('itqan_teacher', JSON.stringify(teacherObj));
                
                setPin('');
                setShowPin(false);
            };

            const logout = async () => {
                const deviceId = getDeviceId();
                try {
                    await db.collection('active_devices').doc(deviceId).update({ status: 'inactive' });
                } catch(e) {}
                logoutSilently();
                showToast("تم تسجيل الخروج بنجاح");
            };

            const logoutSilently = () => {
                localStorage.removeItem('itqan_role');
                localStorage.removeItem('itqan_teacher');
                setRole(null);
                setCurrentTeacher(null);
            };

            const manageDevice = async (id, newStatus) => {
                try {
                    await db.collection('active_devices').doc(id).update({ status: newStatus });
                    showToast("تم تحديث حالة الجهاز بنجاح");
                } catch(err) { showToast("فشل التحديث", "error"); }
            };

            const handleStartGroup = (groupName) => {
                const today = getTodayDateStr();
                const attSessionId = `${groupName.replace(/\s+/g, '_')}_${today}`;
                const hwSessionId = `hw_${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingAttLog = logs.find(l => l.id === attSessionId);
                const existingHwLog = homeworkLogs.find(l => l.id === hwSessionId);
                const initialAttMap = {};
                const initialHwMap = {};
                const activeGroupStudents = students.filter(s => String(s.group).trim() === groupName && s.active);
                activeGroupStudents.forEach(s => {
                    if (existingAttLog) {
                        const rec = existingAttLog.records?.find(r => String(r.studentId) === String(s.id));
                        initialAttMap[s.id] = rec ? rec.status : 'present';
                    } else initialAttMap[s.id] = 'present';
                    if (existingHwLog) {
                        const rec = existingHwLog.records?.find(r => String(r.studentId) === String(s.id));
                        initialHwMap[s.id] = rec ? rec.status : 'submitted';
                    } else initialHwMap[s.id] = 'submitted';
                });
                setAttendanceBatch(initialAttMap);
                setHomeworkBatch(initialHwMap);
                setActiveMonitorGroup(groupName);
                setIsMonitoringTeachers(false);
            };

            const submitAttendance = async (groupToSubmit) => {
                const groupName = groupToSubmit || activeMonitorGroup;
                const today = getTodayDateStr();
                const sessionId = `${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingLog = logs.find(l => l.id === sessionId);
                const activeGroupStudents = students.filter(s => String(s.group).trim() === groupName && s.active).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
                const snapshotRecords = activeGroupStudents.map(s => ({
                    studentId: String(s.id), name: s.name, phone: s.phone, group: s.group, status: attendanceBatch[s.id] || 'present'
                }));
                try {
                    const batch = db.batch();
                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            if (r.status === 'absent') batch.update(db.collection('students').doc(r.studentId), { absences: firebase.firestore.FieldValue.increment(-1) });
                        });
                    }
                    snapshotRecords.forEach(r => {
                        if (r.status === 'absent') batch.update(db.collection('students').doc(r.studentId), { absences: firebase.firestore.FieldValue.increment(1) });
                    });
                    batch.set(db.collection('attendance_logs').doc(sessionId), {
                        id: sessionId, group: groupName, date: today, submittedBy: role === 'teacher' ? `المعلم: ${currentTeacher.name}` : 'المسجل العام',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(), records: snapshotRecords
                    });
                    await batch.commit();
                    showToast(existingLog ? "تم تعديل كشف الحضور" : "تم رصد الحضور بنجاح");
                    if (role === 'monitor') setActiveMonitorGroup(null);
                } catch (err) { showToast("خطأ في الحفظ", "error"); }
            };

            const submitHomework = async (groupToSubmit) => {
                const groupName = groupToSubmit || activeMonitorGroup;
                const today = getTodayDateStr();
                const sessionId = `hw_${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingLog = homeworkLogs.find(l => l.id === sessionId);
                const activeGroupStudents = students.filter(s => String(s.group).trim() === groupName && s.active).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
                const snapshotRecords = activeGroupStudents.map(s => ({
                    studentId: String(s.id), name: s.name, phone: s.phone, group: s.group, status: homeworkBatch[s.id] || 'submitted'
                }));
                try {
                    const batch = db.batch();
                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            if (r.status === 'missed') batch.update(db.collection('students').doc(r.studentId), { missedHomework: firebase.firestore.FieldValue.increment(-1) });
                        });
                    }
                    snapshotRecords.forEach(r => {
                        if (r.status === 'missed') batch.update(db.collection('students').doc(r.studentId), { missedHomework: firebase.firestore.FieldValue.increment(1) });
                    });
                    batch.set(db.collection('homework_logs').doc(sessionId), {
                        id: sessionId, group: groupName, date: today, submittedBy: role === 'teacher' ? `المعلم: ${currentTeacher.name}` : 'المسجل العام',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(), records: snapshotRecords
                    });
                    await batch.commit();
                    showToast("تم رصد الواجبات بنجاح");
                    if (role === 'monitor') setActiveMonitorGroup(null);
                } catch (err) { showToast("خطأ في الحفظ", "error"); }
            };

            const submitTeacherAttendance = async () => {
                const today = getTodayDateStr();
                const logId = `teachers_${today}`;
                const existingLog = teacherLogs.find(l => l.id === logId);
                const snapshotRecords = sortedTeachers.map(t => ({
                    teacherId: String(t.id), name: t.name, subject: t.subject, status: teacherAttendanceBatch[t.id] || 'present'
                }));
                try {
                    const batch = db.batch();
                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            const ref = db.collection('teachers').doc(r.teacherId);
                            if (r.status === 'present') batch.update(ref, { presentCount: firebase.firestore.FieldValue.increment(-1) });
                            else if (r.status === 'absent') batch.update(ref, { absentCount: firebase.firestore.FieldValue.increment(-1) });
                            else if (r.status === 'excused') batch.update(ref, { excusedCount: firebase.firestore.FieldValue.increment(-1) });
                        });
                    }
                    snapshotRecords.forEach(r => {
                        const ref = db.collection('teachers').doc(r.teacherId);
                        if (r.status === 'present') batch.update(ref, { presentCount: firebase.firestore.FieldValue.increment(1) });
                        else if (r.status === 'absent') batch.update(ref, { absentCount: firebase.firestore.FieldValue.increment(1) });
                        else if (r.status === 'excused') batch.update(ref, { excusedCount: firebase.firestore.FieldValue.increment(1) });
                    });
                    batch.set(db.collection('teacher_attendance_logs').doc(logId), {
                        id: logId, date: today, timestamp: firebase.firestore.FieldValue.serverTimestamp(), records: snapshotRecords
                    });
                    await batch.commit();
                    showToast("تم رصد حضور المعلمين بنجاح");
                    setIsMonitoringTeachers(false);
                } catch (err) { showToast("تعذر الحفظ", "error"); }
            };

            const handleToggleStudentExam = async (studentId, examKey, clickedGrade) => {
                const student = students.find(s => String(s.id) === String(studentId));
                const currentGrade = student?.exams?.[examKey];
                try {
                    if (currentGrade === clickedGrade) {
                        await db.collection('students').doc(studentId).update({ [`exams.${examKey}`]: firebase.firestore.FieldValue.delete() });
                    } else {
                        await db.collection('students').doc(studentId).update({ [`exams.${examKey}`]: clickedGrade });
                    }
                } catch (err) { showToast("فشل الرصد", "error"); }
            };

            const handleUpdateStudentExamNotes = async (studentId, examKey, notes) => {
                try { await db.collection('students').doc(studentId).update({ [`examNotes.${examKey}`]: notes }); } catch (err) {}
            };

            const handleDeleteLog = async (logId) => {
                if (confirm("إزالة الكشف نهائياً؟")) {
                    try { await db.collection('attendance_logs').doc(logId).delete(); showToast("تم الحذف"); } catch(e) {}
                }
            };
            const handleDeleteHwLog = async (logId) => {
                if (confirm("إزالة كشف الواجبات؟")) {
                    try { await db.collection('homework_logs').doc(logId).delete(); showToast("تم الحذف"); } catch(e) {}
                }
            };

            const handleConvertAbsence = async (logId, studentId) => {
                try {
                    const logRef = db.collection('attendance_logs').doc(logId);
                    const logDoc = await logRef.get();
                    if (!logDoc.exists) return;
                    const updatedRecords = logDoc.data().records.map(r => String(r.studentId) === String(studentId) ? { ...r, status: 'excused' } : r);
                    const batch = db.batch();
                    batch.update(logRef, { records: updatedRecords });
                    batch.update(db.collection('students').doc(String(studentId)), { absences: firebase.firestore.FieldValue.increment(-1) });
                    await batch.commit();
                    showToast("تم التحويل لمستئذن وخصم الغياب");
                } catch (err) {}
            };

            const handleAddPledge = async (e) => {
                e.preventDefault();
                if (!pledgeReason.trim()) return;
                try {
                    const batch = db.batch();
                    batch.update(db.collection('students').doc(showPledgeModal.id), { pledges: firebase.firestore.FieldValue.increment(1) });
                    batch.set(db.collection('pledges_logs').doc(), {
                        studentId: showPledgeModal.id, studentName: showPledgeModal.name, group: showPledgeModal.group,
                        reason: pledgeReason.trim(), date: getTodayDateStr(), timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    await batch.commit();
                    showToast("تم تسجيل التعهد");
                    setShowPledgeModal(null); setPledgeReason('');
                } catch (err) {}
            };

            const handleAddManualStudent = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('students').add({ ...newStudent, absences: 0, exams: {}, examNotes: {} });
                    setNewStudent({ name: '', phone: '', group: '', active: true, pledges: 0, missedHomework: 0 });
                    setShowAddModal(false); showToast("تمت الإضافة");
                } catch(e) {}
            };

            const handleExcelFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws, { defval: "" });
                    const parsed = data.map(row => {
                        const clean = {}; Object.keys(row).forEach(k => clean[k.trim()] = String(row[k]).trim());
                        return {
                            name: clean['الاسم'] || clean['اسم الطالب'] || '',
                            phone: formatSaudiPhone(clean['الرقم'] || clean['رقم الجوال'] || ''),
                            group: clean['الحلقة'] || clean['الفصل'] || 'عام',
                            absences: parseInt(clean['غيابات'] || 0),
                            missedHomework: parseInt(clean['واجبات'] || 0),
                            pledges: parseInt(clean['تعهدات'] || 0),
                            exams: {}, examNotes: {}, active: true
                        };
                    }).filter(s => s.name);
                    setImportPreview(parsed);
                };
                reader.readAsBinaryString(file);
                e.target.value = '';
            };

            const exportAbsencesToExcel = () => {
                const headers = ["الاسم", "الحلقة", "الجوال", "الغيابات", "الواجبات", "التعهدات", "الحالة"];
                const data = [headers, ...filteredStudents.map(s => [s.name, s.group, s.phone, s.absences, s.missedHomework, s.pledges, s.active?'نشط':'منقطع'])];
                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "التقرير");
                XLSX.writeFile(wb, `إتقان_تقرير_${getTodayDateStr()}.xlsx`);
            };

            const filteredStudents = useMemo(() => {
                return students.filter(s => {
                    const matchGroup = filterGroup === 'ALL' || String(s.group).trim() === filterGroup;
                    const matchSearch = s.name.includes(search) || s.phone.includes(search);
                    const matchStatus = filterStatus === 'ALL' || (filterStatus === 'ACTIVE' ? s.active : !s.active);
                    return matchGroup && matchSearch && matchStatus;
                }).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            }, [students, filterGroup, search, filterStatus]);

            const teacherStudents = useMemo(() => {
                if (!currentTeacher) return [];
                return students.filter(s => String(s.group).trim() === String(currentTeacher.subject).trim() && s.active).sort((a,b) => a.name.localeCompare(b.name, 'ar'));
            }, [students, currentTeacher]);

            if (isBlocked) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-6">
                        <div className="bg-white p-10 rounded-[3rem] shadow-2xl text-center max-w-md border-4 border-rose-600">
                            <div className="text-7xl mb-6">🚫</div>
                            <h1 className="text-3xl font-extrabold text-slate-900 mb-4">الجهاز محظور</h1>
                            <p className="text-slate-600 font-bold leading-relaxed">نأسف، لقد تم حظر هذا الجهاز من الدخول للمنصة بواسطة المشرف العام لمخالفة أمنية.</p>
                        </div>
                    </div>
                );
            }

            if (!role) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-emerald-950 to-slate-950">
                        <div className="max-w-md w-full bg-white/95 rounded-[2.5rem] shadow-2xl p-10 space-y-6 text-center border border-white/20">
                            <div className="w-20 h-20 bg-emerald-700 text-amber-300 text-4xl font-extrabold rounded-3xl flex items-center justify-center mx-auto shadow-xl">✓</div>
                            <h1 className="text-3xl font-extrabold text-slate-800">منصة إتقان للرصد فقط</h1>
                            <div className="relative">
                                <input type={showPin ? "text" : "password"} placeholder="أدخل رمز الدخول (PIN)" className="w-full p-4 pl-12 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-2xl tracking-widest outline-none focus:border-emerald-600 font-mono" value={pin} onChange={e => setPin(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                                <button type="button" onClick={() => setShowPin(!showPin)} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">{showPin ? "👁️" : "🔒"}</button>
                            </div>
                            <button onClick={handleLogin} className="w-full bg-emerald-700 text-white p-4 rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition-all">دخول فوري للمنصة</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24 max-w-6xl mx-auto">
                    <header className="sticky top-0 z-30 glass border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <span className="bg-emerald-700 text-white px-3.5 py-1.5 rounded-xl font-extrabold text-sm">إتقان</span>
                            <span className="font-extrabold text-slate-800 text-sm">
                                {role === 'supervisor' ? 'لوحة المشرف العام' : role === 'monitor' ? 'بوابة الرصد' : `المعلم: ${currentTeacher?.name}`}
                            </span>
                        </div>
                        <button onClick={logout} className="text-xs font-bold text-rose-600 bg-rose-50 border border-rose-200 px-3.5 py-2 rounded-xl">تسجيل الخروج ✕</button>
                    </header>

                    <main className="p-4 md:p-6">
                        {role === 'teacher' ? (
                            <div className="space-y-6">
                                <div className="flex bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm gap-1">
                                    <button onClick={() => setTeacherTab('attendance')} className={`flex-1 py-3 rounded-xl font-bold text-xs ${teacherTab === 'attendance' ? 'bg-emerald-700 text-white shadow-md' : 'text-slate-600'}`}>التحضير</button>
                                    <button onClick={() => setTeacherTab('homework')} className={`flex-1 py-3 rounded-xl font-bold text-xs ${teacherTab === 'homework' ? 'bg-purple-700 text-white shadow-md' : 'text-slate-600'}`}>الواجبات</button>
                                    <button onClick={() => setTeacherTab('exams')} className={`flex-1 py-3 rounded-xl font-bold text-xs ${teacherTab === 'exams' ? 'bg-indigo-700 text-white shadow-md' : 'text-slate-600'}`}>الاختبارات</button>
                                </div>

                                {teacherTab === 'attendance' && (
                                    <div className="space-y-4">
                                        <div className="bg-white rounded-3xl border divide-y">
                                            {teacherStudents.map(s => (
                                                <div key={s.id} className="p-4 flex justify-between items-center">
                                                    <span className="font-bold text-slate-800">{s.name}</span>
                                                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                        {['present','excused','absent'].map(st => (
                                                            <button key={st} onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: st}))} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold ${attendanceBatch[s.id] === st ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600'}`}>{st === 'present' ? 'حاضر' : st === 'excused' ? 'بعذر' : 'غائب'}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => submitAttendance(currentTeacher.subject)} className="w-full bg-emerald-700 text-white py-4 rounded-2xl font-bold">اعتماد التحضير سحابياً ✓</button>
                                    </div>
                                )}
                                {teacherTab === 'homework' && (
                                    <div className="space-y-4">
                                        <div className="bg-white rounded-3xl border divide-y">
                                            {teacherStudents.map(s => (
                                                <div key={s.id} className="p-4 flex justify-between items-center">
                                                    <span className="font-bold text-slate-800">{s.name}</span>
                                                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                        {['submitted','missed'].map(st => (
                                                            <button key={st} onClick={() => setHomeworkBatch(prev => ({...prev, [s.id]: st}))} className={`px-4 py-1.5 rounded-lg text-[10px] font-bold ${homeworkBatch[s.id] === st ? 'bg-purple-700 text-white shadow-sm' : 'text-slate-600'}`}>{st === 'submitted' ? 'حل' : 'لم يحل'}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => submitHomework(currentTeacher.subject)} className="w-full bg-purple-700 text-white py-4 rounded-2xl font-bold">إرسال كشف الواجبات سحابياً ✓</button>
                                    </div>
                                )}
                            </div>
                        ) : role === 'monitor' ? (
                            <div className="space-y-6">
                                {!activeMonitorGroup ? (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {groups.map(g => (
                                            <div key={g} onClick={() => handleStartGroup(g)} className="bg-white p-6 rounded-3xl border border-slate-200 hover:border-emerald-600 cursor-pointer shadow-sm transition-all flex justify-between items-center">
                                                <span className="font-extrabold text-slate-800 text-lg">{g}</span>
                                                <span className="text-emerald-700 font-bold">←</span>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="max-w-2xl mx-auto space-y-4">
                                        <div className="flex justify-between items-center bg-white p-4 rounded-2xl border">
                                            <button onClick={() => setActiveMonitorGroup(null)} className="text-xs font-bold text-slate-500">→ رجوع</button>
                                            <h2 className="font-bold">{activeMonitorGroup}</h2>
                                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                                <button onClick={() => setMonitorMode('attendance')} className={`px-3 py-1 rounded-lg text-[10px] font-bold ${monitorMode === 'attendance' ? 'bg-emerald-700 text-white' : ''}`}>حضور</button>
                                                <button onClick={() => setMonitorMode('homework')} className={`px-3 py-1 rounded-lg text-[10px] font-bold ${monitorMode === 'homework' ? 'bg-purple-700 text-white' : ''}`}>واجبات</button>
                                            </div>
                                        </div>
                                        {monitorMode === 'attendance' ? (
                                            <>
                                                <div className="bg-white rounded-3xl border divide-y overflow-hidden">
                                                    {students.filter(s => String(s.group).trim() === activeMonitorGroup && s.active).map(s => (
                                                        <div key={s.id} className="p-4 flex justify-between items-center">
                                                            <span className="font-bold text-slate-800">{s.name}</span>
                                                            <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                                {['present','excused','absent'].map(st => (
                                                                    <button key={st} onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: st}))} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold ${attendanceBatch[s.id] === st ? 'bg-emerald-700 text-white' : 'text-slate-600'}`}>{st === 'present' ? 'حاضر' : st === 'excused' ? 'بعذر' : 'غائب'}</button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                                <button onClick={() => submitAttendance()} className="w-full bg-emerald-700 text-white py-4 rounded-2xl font-bold">اعتماد التحضير ✓</button>
                                            </>
                                        ) : (
                                            <>
                                                <div className="bg-white rounded-3xl border divide-y overflow-hidden">
                                                    {students.filter(s => String(s.group).trim() === activeMonitorGroup && s.active).map(s => (
                                                        <div key={s.id} className="p-4 flex justify-between items-center">
                                                            <span className="font-bold text-slate-800">{s.name}</span>
                                                            <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                                {['submitted','missed'].map(st => (
                                                                    <button key={st} onClick={() => setHomeworkBatch(prev => ({...prev, [s.id]: st}))} className={`px-4 py-1.5 rounded-lg text-[10px] font-bold ${homeworkBatch[s.id] === st ? 'bg-purple-700 text-white' : 'text-slate-600'}`}>{st === 'submitted' ? 'حل' : 'لم يحل'}</button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                                <button onClick={() => submitHomework()} className="w-full bg-purple-700 text-white py-4 rounded-2xl font-bold">اعتماد الواجبات ✓</button>
                                            </>
                                        )}
                                    </div>
                                )}
                            </div>
                        ) : (
                            // --- Supervisor Portal ---
                            <div className="space-y-6">
                                <div className="flex flex-wrap bg-white p-1.5 rounded-2xl border shadow-sm gap-1 overflow-x-auto">
                                    {[
                                        { id: 'inbox', label: 'الوارد' },
                                        { id: 'students', label: 'الطلاب' },
                                        { id: 'exams', label: 'الاختبارات' },
                                        { id: 'devices', label: 'الأجهزة والجلسات 📱' },
                                        { id: 'teachers', label: 'المعلمون' },
                                        { id: 'settings', label: 'القوالب' }
                                    ].map(t => (
                                        <button key={t.id} onClick={() => setView(t.id)} className={`flex-1 min-w-[100px] py-3 px-2 rounded-xl font-bold text-xs transition-all ${view === t.id ? 'bg-emerald-700 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}>{t.label}</button>
                                    ))}
                                </div>

                                {view === 'inbox' && (
                                    <div className="space-y-4">
                                        <div className="flex gap-2 mb-4">
                                            <button onClick={() => setInboxSubTab('attendance')} className={`px-4 py-2 rounded-xl text-[10px] font-bold ${inboxSubTab === 'attendance' ? 'bg-emerald-700 text-white' : 'bg-slate-100'}`}>الحضور</button>
                                            <button onClick={() => setInboxSubTab('homework')} className={`px-4 py-2 rounded-xl text-[10px] font-bold ${inboxSubTab === 'homework' ? 'bg-purple-700 text-white' : 'bg-slate-100'}`}>الواجبات</button>
                                        </div>
                                        {inboxSubTab === 'attendance' ? (
                                            logs.map(log => (
                                                <div key={log.id} className="bg-white p-5 rounded-3xl border shadow-sm space-y-4">
                                                    <div className="flex justify-between border-b pb-3">
                                                        <span className="font-bold text-emerald-800">{log.group} | {log.date}</span>
                                                        <button onClick={() => handleDeleteLog(log.id)} className="text-xs text-rose-600 font-bold">حذف 🗑️</button>
                                                    </div>
                                                    <div className="space-y-2">
                                                        {log.records.filter(r => r.status !== 'present').map(r => (
                                                            <div key={r.studentId} className={`p-3 rounded-2xl border flex justify-between items-center ${r.status==='absent'?'bg-rose-50 border-rose-100':'bg-amber-50 border-amber-100'}`}>
                                                                <span className="font-bold text-xs">{r.name} ({r.status==='absent'?'غائب':'بعذر'})</span>
                                                                <div className="flex gap-2">
                                                                    <a href={`https://wa.me/${r.phone}?text=${encodeURIComponent(r.status==='absent'?settings.absence_template.replace(/{student_name}/g, r.name):settings.excused_template.replace(/{student_name}/g, r.name))}`} target="_blank" className="bg-emerald-600 text-white px-3 py-1 rounded-xl text-[10px] font-bold">واتساب 💬</a>
                                                                    {r.status==='absent' && <button onClick={() => handleConvertAbsence(log.id, r.studentId)} className="bg-amber-600 text-white px-3 py-1 rounded-xl text-[10px] font-bold">بعذر ⏱️</button>}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            homeworkLogs.map(log => (
                                                <div key={log.id} className="bg-white p-5 rounded-3xl border shadow-sm space-y-4">
                                                    <div className="flex justify-between border-b pb-3">
                                                        <span className="font-bold text-purple-800">{log.group} | {log.date}</span>
                                                        <button onClick={() => handleDeleteHwLog(log.id)} className="text-xs text-rose-600 font-bold">حذف 🗑️</button>
                                                    </div>
                                                    <div className="space-y-2">
                                                        {log.records.filter(r => r.status === 'missed').map(r => (
                                                            <div key={r.studentId} className="p-3 rounded-2xl border bg-rose-50 border-rose-100 flex justify-between items-center">
                                                                <span className="font-bold text-xs">{r.name} (لم يحل)</span>
                                                                <a href={`https://wa.me/${r.phone}?text=${encodeURIComponent(settings.homework_template.replace(/{student_name}/g, r.name))}`} target="_blank" className="bg-emerald-600 text-white px-3 py-1 rounded-xl text-[10px] font-bold">واتساب 💬</a>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}

                                {view === 'devices' && (
                                    <div className="space-y-6">
                                        <div className="bg-amber-50 p-6 rounded-3xl border border-amber-200">
                                            <h3 className="font-extrabold text-amber-900 text-lg">إدارة الأمان والتحكم بالأجهزة 📱</h3>
                                            <p className="text-xs text-amber-700 mt-1">تتيح لك هذه اللوحة مراقبة جميع المتصفحات والأجهزة التي دخلت النظام مع إمكانية طرد أي جهاز أو حظره نهائياً.</p>
                                        </div>
                                        <div className="bg-white rounded-3xl border shadow-sm overflow-hidden">
                                            <table className="w-full text-right text-sm">
                                                <thead className="bg-slate-50 text-slate-500 text-[10px]">
                                                    <tr>
                                                        <th className="p-4 font-bold">الجهاز</th>
                                                        <th className="p-4 font-bold">الحساب</th>
                                                        <th className="p-4 font-bold">الموقع التقريبي</th>
                                                        <th className="p-4 font-bold">آخر ظهور</th>
                                                        <th className="p-4 font-bold">الحالة</th>
                                                        <th className="p-4 font-bold text-center">الإجراء</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {activeDevices.map(dev => (
                                                        <tr key={dev.id} className="hover:bg-slate-50 transition-colors">
                                                            <td className="p-4">
                                                                <div className="font-bold text-slate-800 text-xs">{dev.deviceName}</div>
                                                                <div className="text-[9px] text-slate-400 font-mono">{dev.deviceId}</div>
                                                            </td>
                                                            <td className="p-4 font-bold text-emerald-800 text-xs">{dev.role}</td>
                                                            <td className="p-4 text-xs text-slate-600">{dev.location}</td>
                                                            <td className="p-4 text-[10px] text-slate-500">
                                                                {dev.lastLogin?.toDate().toLocaleString('ar-EG')}
                                                            </td>
                                                            <td className="p-4">
                                                                <span className={`text-[9px] px-2 py-1 rounded-full font-bold ${dev.status === 'active' ? 'bg-emerald-100 text-emerald-700' : dev.status === 'blocked' ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-500'}`}>
                                                                    {dev.status === 'active' ? 'متصل حالياً' : dev.status === 'blocked' ? 'محظور نهائياً' : 'غير متصل'}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 text-center">
                                                                <div className="flex justify-center gap-1.5">
                                                                    {dev.status === 'active' && <button onClick={() => manageDevice(dev.id, 'kicked')} className="bg-orange-50 text-orange-600 px-2.5 py-1 rounded-lg font-bold text-[10px] border border-orange-200">طرد 🚪</button>}
                                                                    {dev.status !== 'blocked' ? 
                                                                        <button onClick={() => manageDevice(dev.id, 'blocked')} className="bg-rose-600 text-white px-2.5 py-1 rounded-lg font-bold text-[10px]">حظر 🚫</button> :
                                                                        <button onClick={() => manageDevice(dev.id, 'active')} className="bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold text-[10px]">فك الحظر ♻️</button>
                                                                    }
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {view === 'students' && (
                                    <div className="space-y-4">
                                        <div className="bg-white p-5 rounded-3xl border shadow-sm flex flex-wrap gap-3">
                                            <button onClick={() => setShowAddModal(true)} className="bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold">+ طالب</button>
                                            <label className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">📊 استيراد Excel<input type="file" ref={fileInputRef} accept=".xlsx,.xls" onChange={handleExcelFileSelect} className="hidden" /></label>
                                            <button onClick={exportAbsencesToExcel} className="bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold">📥 تصدير Excel</button>
                                            <input type="text" placeholder="بحث باسم الطالب..." className="bg-slate-50 border rounded-xl px-4 py-2 text-xs outline-none w-full md:w-64 focus:border-emerald-600" value={search} onChange={e => setSearch(e.target.value)} />
                                            <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="bg-slate-50 border rounded-xl px-3 py-1.5 text-[10px] font-bold">
                                                <option value="ALL">جميع الحالات</option>
                                                <option value="ACTIVE">نشط</option>
                                                <option value="INACTIVE">منقطع</option>
                                            </select>
                                        </div>
                                        <div className="bg-white rounded-3xl border overflow-hidden shadow-sm">
                                            <table className="w-full text-right text-sm">
                                                <thead className="bg-slate-50 text-slate-500 text-[10px]">
                                                    <tr>
                                                        <th className="p-4 font-bold">الطالب</th>
                                                        <th className="p-4 font-bold">الحلقة</th>
                                                        <th className="p-4 font-bold">الغيابات</th>
                                                        <th className="p-4 font-bold">الواجبات</th>
                                                        <th className="p-4 font-bold text-center">إجراء</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredStudents.map(s => (
                                                        <tr key={s.id} className="hover:bg-slate-50">
                                                            <td className="p-4 font-bold text-slate-800 text-xs">{s.name}</td>
                                                            <td className="p-4 text-xs">{s.group}</td>
                                                            <td className="p-4">
                                                                <span className={`px-2 py-0.5 rounded-lg text-[9px] font-bold ${s.absences>=6?'bg-rose-100 text-rose-700':s.absences>=3?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700'}`}>{s.absences} غيابات</span>
                                                            </td>
                                                            <td className="p-4 text-xs font-bold text-purple-700">{s.missedHomework} / 15</td>
                                                            <td className="p-4 text-center">
                                                                <button onClick={() => setEditingStudent(s)} className="text-emerald-700 font-bold text-[10px]">تعديل ✏️</button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Modals & Overlays */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddManualStudent} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4 shadow-2xl">
                                <h3 className="text-lg font-bold border-b pb-2">إضافة طالب سحابياً</h3>
                                <input required placeholder="الاسم الكامل" className="w-full p-3 bg-slate-50 border rounded-xl outline-none" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                <input required placeholder="الجوال" className="w-full p-3 bg-slate-50 border rounded-xl outline-none text-left" dir="ltr" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} />
                                <input required placeholder="الحلقة" className="w-full p-3 bg-slate-50 border rounded-xl outline-none" value={newStudent.group} onChange={e => setNewStudent({...newStudent, group: e.target.value})} />
                                <div className="flex gap-2">
                                    <button type="submit" className="flex-1 bg-emerald-700 text-white font-bold py-3 rounded-xl">حفظ الطالب</button>
                                    <button type="button" onClick={() => setShowAddModal(false)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {importPreview && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
                                <h3 className="text-lg font-bold border-b pb-2">معاينة الاستيراد ({importPreview.length})</h3>
                                <div className="overflow-y-auto flex-1 space-y-2">
                                    {importPreview.map((p, idx) => (
                                        <div key={idx} className="p-2 border rounded-lg text-xs flex justify-between">
                                            <span>{p.name}</span><span className="font-bold">{p.group}</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={async () => {
                                    const batch = db.batch();
                                    importPreview.forEach(s => batch.set(db.collection('students').doc(), s));
                                    await batch.commit();
                                    setImportPreview(null); showToast("تم الاستيراد بنجاح");
                                }} className="w-full bg-emerald-700 text-white py-4 rounded-xl font-bold">تأكيد الحفظ السحابي</button>
                            </div>
                        </div>
                    )}

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
