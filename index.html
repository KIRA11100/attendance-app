<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إتقان - الإدارة السحابية الشاملة</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
        .modal-overlay { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(6px); }
        input[type="checkbox"] { accent-color: #047857; width: 1.15rem; height: 1.15rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDbKUezmXISXgC6PL170-soS-d3_lbKf1U",
            authDomain: "itqan-app-3c7a0.firebaseapp.com",
            projectId: "itqan-app-3c7a0",
            storageBucket: "itqan-app-3c7a0.firebasestorage.app",
            messagingSenderId: "896345573209",
            appId: "1:896345573209:web:cd394d95e092a6361f2e48"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const formatSaudiPhone = (input) => {
            if (!input) return '966500000000';
            let num = String(input).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, '');
            if (num.startsWith('05')) num = '966' + num.substring(1);
            else if (num.startsWith('5') && num.length === 9) num = '966' + num;
            else if (num.length === 9) num = '966' + num;
            return num || '966500000000';
        };

        const getTodayDateStr = () => new Date().toISOString().split('T')[0];

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl shadow-2xl text-white font-bold text-sm transition-all animate-bounce ${type === 'success' ? 'bg-emerald-600 border border-emerald-500' : 'bg-rose-600 border border-rose-500'}`}>
                    {message}
                </div>
            );
        };

        const getHomeworkAlert = (missedCount) => {
            const count = Number(missedCount) || 0;
            if (count >= 15) return { level: 'exceeded', text: 'تجاوز الحد (15+)', color: 'bg-rose-900 text-white' };
            if (count >= 14) return { level: 'final', text: 'التنبيه النهائي (14)', color: 'bg-rose-600 text-white' };
            if (count >= 10) return { level: 'second', text: 'التنبيه الثاني (10)', color: 'bg-amber-600 text-white' };
            if (count >= 5) return { level: 'first', text: 'التنبيه الأول (5)', color: 'bg-amber-100 text-amber-800' };
            return { level: 'none', text: 'منتظم', color: 'bg-emerald-50 text-emerald-700' };
        };

        const getAbsenceCategory = (absences) => {
            const c = Number(absences) || 0;
            if (c >= 6) return 'danger';
            if (c >= 3) return 'warning';
            return 'normal';
        };

        const EXAM_TYPES = [
            { id: 'formative_1', title: 'الاختبار البنائي الأول', isFinal: false },
            { id: 'formative_2', title: 'الاختبار البنائي الثاني', isFinal: false },
            { id: 'formative_3', title: 'الاختبار البنائي الثالث', isFinal: false },
            { id: 'formative_4', title: 'الاختبار البنائي الرابع', isFinal: false },
            { id: 'final_exam', title: 'الاختبار النهائي', isFinal: true }
        ];

        const STYLES = {
            header: {
                fill: { fgColor: { rgb: "065F46" } },
                font: { name: "Arial", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } }
            },
            normalCell: {
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "E2E8F0" } }, bottom: { style: "thin", color: { rgb: "E2E8F0" } }, left: { style: "thin", color: { rgb: "E2E8F0" } }, right: { style: "thin", color: { rgb: "E2E8F0" } } }
            },
            greenCell: {
                fill: { fgColor: { rgb: "DCFCE7" } },
                font: { color: { rgb: "166534" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            yellowCell: {
                fill: { fgColor: { rgb: "FEF9C3" } },
                font: { color: { rgb: "854D0E" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            orangeCell: {
                fill: { fgColor: { rgb: "FFEDD5" } },
                font: { color: { rgb: "9A3412" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            redCell: {
                fill: { fgColor: { rgb: "FEE2E2" } },
                font: { color: { rgb: "991B1B" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            }
        };

        const App = () => {
            const [role, setRole] = useState(() => localStorage.getItem('itqan_role') || null);
            const [currentTeacher, setCurrentTeacher] = useState(() => {
                const saved = localStorage.getItem('itqan_teacher');
                return saved ? JSON.parse(saved) : null;
            });
            const [teacherTab, setTeacherTab] = useState('attendance');
            
            const [view, setView] = useState('inbox');
            const [inboxSubTab, setInboxSubTab] = useState('attendance');
            const [pin, setPin] = useState('');
            const [showPin, setShowPin] = useState(false);
            
            const [students, setStudents] = useState([]);
            const [teachers, setTeachers] = useState([]);
            const [logs, setLogs] = useState([]);
            const [homeworkLogs, setHomeworkLogs] = useState([]);
            const [pledgeLogs, setPledgeLogs] = useState([]);
            const [teacherLogs, setTeacherLogs] = useState([]);
            
            const [settings, setSettings] = useState({ 
                absence_template: "عزيزي ولي أمر الطالب {student_name}، نفيدكم بغيابه اليوم {date}. إجمالي غياباته: {absence_count}",
                excused_template: "عزيزي ولي أمر الطالب {student_name}، تم تسجيل استئذان الطالب اليوم {date} بعذر مقبول.",
                homework_template: "عزيزي ولي أمر الطالب {student_name}، نود إشعاركم بعدم تسليمه لواجب اليوم {date}. إجمالي مرات عدم التسليم: {missed_count} واجبات ({alert_status}). نأمل متابعته حرصاً على مستواه.",
                listener_template: "السلام عليكم ورحمة الله وبركاته، المكرم ولي أمر الطالب {student_name}، نفيدكم بأنه نظراً لتجاوز الطالب الحد الأعلى المسموح به في اللائحة ({reason})، تقرر تحويل صفة قيده إلى (مستمع) مما يترتب عليه استمرار الحضور دون استحقاق الجوائز والتكريم والشهادات ومتابعة الضعف. يُمنح فرصة واحدة للعودة لصفة منتظم عند التزامه أسبوعين متتاليين دون مخالفة.",
                formative_exam_template: "السلام عليكم ورحمة الله وبركاته، نفيدكم بنتيجة الطالب {student_name} في ({exam_name}): تقدير الطالب هو [{grade}]. ملاحظة المعلم: {notes}. نسأل الله له دوام التوفيق والتميز.",
                final_exam_template: "السلام عليكم ورحمة الله وبركاته، نبارك لكم نتائج نهاية الفصل. نفيدكم بأن الطالب {student_name} في (الاختبار النهائي) قد حصل على نتيجة: [{grade}]. ملاحظة المعلم: {notes}. سائلين المولى له التوفيق."
            });
            const [toast, setToast] = useState(null);

            const [activeMonitorGroup, setActiveMonitorGroup] = useState(null);
            const [monitorMode, setMonitorMode] = useState('attendance');
            const [attendanceBatch, setAttendanceBatch] = useState({});
            const [homeworkBatch, setHomeworkBatch] = useState({});
            const [isMonitoringTeachers, setIsMonitoringTeachers] = useState(false);

            const [showAddModal, setShowAddModal] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [newStudent, setNewStudent] = useState({ name: '', phone: '', group: '', active: true, pledges: 0, missedHomework: 0 });
            const [importPreview, setImportPreview] = useState(null);
            const [selectedSids, setSelectedSids] = useState([]);
            const [filterGroup, setFilterGroup] = useState('ALL');
            const [filterAbsence, setFilterAbsence] = useState('ALL');
            const [filterHomework, setFilterHomework] = useState('ALL');
            const [filterStatus, setFilterStatus] = useState('ALL'); 
            const [search, setSearch] = useState('');
            const fileInputRef = useRef(null);

            const [selectedExamType, setSelectedExamType] = useState('formative_1');
            const [examFilterGroup, setExamFilterGroup] = useState('ALL');

            const [showPledgeModal, setShowPledgeModal] = useState(null);
            const [pledgeReason, setPledgeReason] = useState('');

            const [showAddTeacherModal, setShowAddTeacherModal] = useState(false);
            const [newTeacher, setNewTeacher] = useState({ name: '', phone: '', subject: '', pin: '' });
            const [teacherAttendanceBatch, setTeacherAttendanceBatch] = useState({});

            const showToast = (message, type = 'success') => setToast({ message, type });

            useEffect(() => {
                const unsubStudents = db.collection('students').onSnapshot(snap => {
                    setStudents(snap.docs.map(doc => ({ 
                        id: doc.id, 
                        pledges: 0, 
                        missedHomework: 0, 
                        absences: 0, 
                        exams: {}, 
                        examNotes: {}, 
                        ...doc.data() 
                    })));
                });

                const unsubTeachers = db.collection('teachers').onSnapshot(snap => {
                    setTeachers(snap.docs.map(doc => ({ id: doc.id, presentCount: 0, absentCount: 0, excusedCount: 0, pin: '', ...doc.data() })));
                });

                const unsubLogs = db.collection('attendance_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubHwLogs = db.collection('homework_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setHomeworkLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubTeacherLogs = db.collection('teacher_attendance_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setTeacherLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubPledges = db.collection('pledges_logs').orderBy('timestamp', 'desc').onSnapshot(snap => {
                    setPledgeLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubSettings = db.collection('settings').doc('app_config').onSnapshot(doc => {
                    if (doc.exists) setSettings(prev => ({ ...prev, ...doc.data() }));
                });

                return () => {
                    unsubStudents();
                    unsubTeachers();
                    unsubLogs();
                    unsubHwLogs();
                    unsubTeacherLogs();
                    unsubPledges();
                    unsubSettings();
                };
            }, []);

            useEffect(() => {
                const today = getTodayDateStr();
                const todayLog = teacherLogs.find(l => l.date === today);
                const map = {};
                teachers.forEach(t => {
                    if (todayLog && todayLog.records) {
                        const rec = todayLog.records.find(r => String(r.teacherId) === String(t.id));
                        map[t.id] = rec ? rec.status : 'present';
                    } else {
                        map[t.id] = 'present';
                    }
                });
                setTeacherAttendanceBatch(map);
            }, [teachers, teacherLogs]);

            useEffect(() => {
                if (role === 'teacher' && currentTeacher) {
                    const today = getTodayDateStr();
                    const teacherGroup = String(currentTeacher.subject || '').trim();
                    const attLogId = `${teacherGroup.replace(/\s+/g, '_')}_${today}`;
                    const hwLogId = `hw_${teacherGroup.replace(/\s+/g, '_')}_${today}`;

                    const existingAtt = logs.find(l => l.id === attLogId);
                    const existingHw = homeworkLogs.find(l => l.id === hwLogId);

                    const attMap = {};
                    const hwMap = {};
                    const myStudents = students.filter(s => String(s.group).trim() === teacherGroup && s.active);

                    myStudents.forEach(s => {
                        if (existingAtt && existingAtt.records) {
                            const r = existingAtt.records.find(rec => String(rec.studentId) === String(s.id));
                            attMap[s.id] = r ? r.status : 'present';
                        } else {
                            attMap[s.id] = 'present';
                        }

                        if (existingHw && existingHw.records) {
                            const r = existingHw.records.find(rec => String(rec.studentId) === String(s.id));
                            hwMap[s.id] = r ? r.status : 'submitted';
                        } else {
                            hwMap[s.id] = 'submitted';
                        }
                    });

                    setAttendanceBatch(attMap);
                    setHomeworkBatch(hwMap);
                    setActiveMonitorGroup(teacherGroup);
                }
            }, [role, currentTeacher, students, logs, homeworkLogs]);

            const groups = useMemo(() => {
                const uniqueGroups = [...new Set(students.map(s => String(s.group).trim()))].filter(Boolean);
                return uniqueGroups.sort((a, b) => a.localeCompare(b, 'ar'));
            }, [students]);

            const sortedTeachers = useMemo(() => {
                return [...teachers].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            }, [teachers]);

            const handleLogin = () => {
                const trimmedPin = pin.trim();
                if (!trimmedPin) return;

                if (trimmedPin === '1234') {
                    setRole('supervisor');
                    setCurrentTeacher(null);
                    localStorage.setItem('itqan_role', 'supervisor');
                    localStorage.removeItem('itqan_teacher');
                    showToast('تم تسجيل الدخول كمشرف عام');
                } else if (trimmedPin === '0000') {
                    setRole('monitor');
                    setCurrentTeacher(null);
                    localStorage.setItem('itqan_role', 'monitor');
                    localStorage.removeItem('itqan_teacher');
                    showToast('تم تسجيل الدخول كمسجل عام');
                } else {
                    const matchedTeacher = teachers.find(t => t.pin && String(t.pin).trim() === trimmedPin);
                    if (matchedTeacher) {
                        setRole('teacher');
                        setCurrentTeacher(matchedTeacher);
                        setTeacherTab('attendance');
                        localStorage.setItem('itqan_role', 'teacher');
                        localStorage.setItem('itqan_teacher', JSON.stringify(matchedTeacher));
                        showToast(`مرحباً بالأستاذ ${matchedTeacher.name}`);
                    } else {
                        showToast('رمز الدخول غير صحيح، يرجى المحاولة مرة أخرى', 'error');
                    }
                }

                setPin('');
                setShowPin(false);
            };

            const logout = () => {
                localStorage.removeItem('itqan_role');
                localStorage.removeItem('itqan_teacher');
                setRole(null);
                setCurrentTeacher(null);
                setPin('');
                setShowPin(false);
                setActiveMonitorGroup(null);
                setIsMonitoringTeachers(false);
                setAttendanceBatch({});
                setHomeworkBatch({});
                setEditingStudent(null);
                setShowAddModal(false);
                setShowPledgeModal(null);
                setShowAddTeacherModal(false);
                showToast("تم تسجيل الخروج بنجاح");
            };

            const handleStartGroup = (groupName) => {
                const today = getTodayDateStr();
                const attSessionId = `${groupName.replace(/\s+/g, '_')}_${today}`;
                const hwSessionId = `hw_${groupName.replace(/\s+/g, '_')}_${today}`;
                
                const existingAttLog = logs.find(l => l.id === attSessionId);
                const existingHwLog = homeworkLogs.find(l => l.id === hwSessionId);

                const initialAttMap = {};
                const initialHwMap = {};
                const activeGroupStudents = students.filter(s => String(s.group).trim() === groupName && s.active);

                activeGroupStudents.forEach(s => {
                    if (existingAttLog) {
                        const rec = existingAttLog.records?.find(r => String(r.studentId) === String(s.id));
                        initialAttMap[s.id] = rec ? rec.status : 'present';
                    } else {
                        initialAttMap[s.id] = 'present';
                    }

                    if (existingHwLog) {
                        const rec = existingHwLog.records?.find(r => String(r.studentId) === String(s.id));
                        initialHwMap[s.id] = rec ? rec.status : 'submitted';
                    } else {
                        initialHwMap[s.id] = 'submitted';
                    }
                });

                setAttendanceBatch(initialAttMap);
                setHomeworkBatch(initialHwMap);
                setActiveMonitorGroup(groupName);
                setIsMonitoringTeachers(false);
            };

            const submitAttendance = async (groupToSubmit) => {
                const groupName = groupToSubmit || activeMonitorGroup;
                const today = getTodayDateStr();
                const sessionId = `${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingLog = logs.find(l => l.id === sessionId);
                const activeGroupStudents = students
                    .filter(s => String(s.group).trim() === groupName && s.active)
                    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));

                const snapshotRecords = activeGroupStudents.map(s => ({
                    studentId: String(s.id),
                    name: s.name,
                    phone: s.phone,
                    group: s.group,
                    status: attendanceBatch[s.id] || 'present'
                }));

                try {
                    const batch = db.batch();

                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            if (r.status === 'absent') {
                                const ref = db.collection('students').doc(r.studentId);
                                batch.update(ref, { absences: firebase.firestore.FieldValue.increment(-1) });
                            }
                        });
                    }

                    snapshotRecords.forEach(r => {
                        if (r.status === 'absent') {
                            const ref = db.collection('students').doc(r.studentId);
                            batch.update(ref, { absences: firebase.firestore.FieldValue.increment(1) });
                        }
                    });

                    const logRef = db.collection('attendance_logs').doc(sessionId);
                    batch.set(logRef, {
                        id: sessionId,
                        group: groupName,
                        date: today,
                        submittedBy: role === 'teacher' ? `المعلم: ${currentTeacher.name}` : 'المسجل العام',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        records: snapshotRecords
                    });

                    await batch.commit();
                    showToast(existingLog ? "تم تعديل كشف الحضور بنجاح" : "تم اعتماد كشف الحضور وإرساله للإدارة بنجاح");
                    if (role === 'monitor') setActiveMonitorGroup(null);
                } catch (err) {
                    showToast("حدث خطأ أثناء الحفظ", "error");
                }
            };

            const submitHomework = async (groupToSubmit) => {
                const groupName = groupToSubmit || activeMonitorGroup;
                const today = getTodayDateStr();
                const sessionId = `hw_${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingLog = homeworkLogs.find(l => l.id === sessionId);
                const activeGroupStudents = students
                    .filter(s => String(s.group).trim() === groupName && s.active)
                    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));

                const snapshotRecords = activeGroupStudents.map(s => ({
                    studentId: String(s.id),
                    name: s.name,
                    phone: s.phone,
                    group: s.group,
                    status: homeworkBatch[s.id] || 'submitted'
                }));

                try {
                    const batch = db.batch();

                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            if (r.status === 'missed') {
                                const ref = db.collection('students').doc(r.studentId);
                                batch.update(ref, { missedHomework: firebase.firestore.FieldValue.increment(-1) });
                            }
                        });
                    }

                    snapshotRecords.forEach(r => {
                        if (r.status === 'missed') {
                            const ref = db.collection('students').doc(r.studentId);
                            batch.update(ref, { missedHomework: firebase.firestore.FieldValue.increment(1) });
                        }
                    });

                    const logRef = db.collection('homework_logs').doc(sessionId);
                    batch.set(logRef, {
                        id: sessionId,
                        group: groupName,
                        date: today,
                        submittedBy: role === 'teacher' ? `المعلم: ${currentTeacher.name}` : 'المسجل العام',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        records: snapshotRecords
                    });

                    await batch.commit();
                    showToast(existingLog ? "تم تحديث كشف الواجبات" : "تم اعتماد كشف الواجبات وإرساله للإدارة بنجاح");
                    if (role === 'monitor') setActiveMonitorGroup(null);
                } catch (err) {
                    showToast("حدث خطأ أثناء حفظ الواجبات", "error");
                }
            };

            const submitTeacherAttendance = async () => {
                const today = getTodayDateStr();
                const logId = `teachers_${today}`;
                const existingLog = teacherLogs.find(l => l.id === logId);

                const snapshotRecords = sortedTeachers.map(t => ({
                    teacherId: String(t.id),
                    name: t.name,
                    subject: t.subject,

            const calculatePassStats = (targetList, examKey) => {
                const total = targetList.length;
                if (total === 0) return { total: 0, graded: 0, passed: 0, failed: 0, rate: 0 };
                
                const isFinal = examKey === 'final_exam';
                let graded = 0;
                let passed = 0;

                targetList.forEach(s => {
                    const g = s.exams?.[examKey];
                    if (g) {
                        graded++;
                        if (isFinal) {
                            if (g === 'مجتاز') passed++;
                        } else {
                            if (g === 'متمكن' || g === 'ضعيف') passed++;
                        }
                    }
                });

                const rate = graded > 0 ? Math.round((passed / graded) * 100) : 0;
                return { total, graded, passed, failed: graded - passed, rate };
            };

            if (!role) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-950 to-emerald-950">
                        <div className="max-w-md w-full bg-white/95 backdrop-blur-xl rounded-[2.5rem] shadow-2xl p-8 sm:p-10 space-y-6 text-center border border-white/20">
                            <div className="w-20 h-20 bg-gradient-to-tr from-emerald-700 to-teal-600 text-amber-300 text-4xl font-extrabold rounded-3xl flex items-center justify-center mx-auto shadow-xl shadow-emerald-900/30 border-2 border-emerald-500/30">
                                ✓
                            </div>
                            <div className="space-y-1">
                                <h1 className="text-3xl font-extrabold text-slate-800 tracking-tight">منصة إتقان السحابية</h1>
                                <p className="text-slate-500 text-xs font-medium">نظام الإدارة والتحضير السحابي الموحد</p>
                            </div>
                            
                            <div className="space-y-4 pt-2">
                                <div className="relative">
                                    <input 
                                        type={showPin ? "text" : "password"} 
                                        placeholder="أدخل رمز الدخول (PIN)" 
                                        className="w-full p-4 pl-12 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-2xl tracking-widest outline-none focus:border-emerald-600 focus:bg-white transition-all font-mono shadow-inner"
                                        value={pin}
                                        onChange={e => setPin(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleLogin()}
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowPin(!showPin)}
                                        className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-700 text-xl focus:outline-none transition-all p-1"
                                    >
                                        {showPin ? "👁️" : "🔒"}
                                    </button>
                                </div>

                                <button 
                                    onClick={handleLogin} 
                                    className="w-full bg-gradient-to-r from-emerald-700 to-teal-700 hover:from-emerald-800 hover:to-teal-800 text-white p-4 rounded-2xl font-bold text-lg shadow-lg shadow-emerald-900/20 active:scale-[0.98] transition-all"
                                >
                                    دخول فوري للمنصة
                                </button>
                            </div>
                            <div className="text-[11px] text-slate-400 font-bold">
                                المشرف: 1234 | المسجل: 0000 | المعلم: رمزه الخاص
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24 max-w-6xl mx-auto">
                    <header className="sticky top-0 z-30 glass border-b border-slate-200/80 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <span className="bg-gradient-to-r from-emerald-700 to-teal-700 text-white px-3.5 py-1.5 rounded-xl font-extrabold text-sm shadow-sm">
                                إتقان
                            </span>
                            <span className="font-extrabold text-slate-800 text-sm sm:text-base">
                                {role === 'supervisor' ? 'لوحة تحكم المشرف العام' : role === 'monitor' ? 'بوابة الرصد والتحضير (المسجل)' : `بوابة المعلم: ${currentTeacher?.name || ''}`}
                            </span>
                        </div>
                        <button onClick={logout} className="text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-3.5 py-2 rounded-xl transition-all">
                            تسجيل الخروج ✕
                        </button>
                    </header>

                    <main className="p-4 md:p-6">
                        {/* ======================= بوابة المعلم ======================= */}
                        {role === 'teacher' ? (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-wrap justify-between items-center gap-4">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <span className="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-xl font-extrabold border border-emerald-200">حلقة: {currentTeacher.subject}</span>
                                            <h2 className="text-xl font-extrabold text-slate-800">مرحباً بالأستاذ: {currentTeacher.name}</h2>
                                        </div>
                                        <p className="text-xs text-slate-400 mt-1.5">قم برصد الحضور، الواجبات، ونتائج الاختبارات لطلاب حلقتك؛ وتصل للإدارة تلقائياً</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm">
                                            ✓ جلسة متصلة ومحفوظة
                                        </span>
                                    </div>
                                </div>

                                <div className="flex bg-white p-1.5 rounded-2xl border border-slate-200/80 shadow-sm gap-1">
                                    <button 
                                        onClick={() => setTeacherTab('attendance')}
                                        className={`flex-1 py-3 rounded-xl font-bold text-xs md:text-sm transition-all ${teacherTab === 'attendance' ? 'bg-emerald-700 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}
                                    >
                                        تحضير اليوم ({getTodayDateStr()})
                                    </button>
                                    <button 
                                        onClick={() => setTeacherTab('homework')}
                                        className={`flex-1 py-3 rounded-xl font-bold text-xs md:text-sm transition-all ${teacherTab === 'homework' ? 'bg-purple-700 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}
                                    >
                                        تسليم واجبات اليوم
                                    </button>
                                    <button 
                                        onClick={() => setTeacherTab('exams')}
                                        className={`flex-1 py-3 rounded-xl font-bold text-xs md:text-sm transition-all ${teacherTab === 'exams' ? 'bg-indigo-700 text-white shadow-md' : 'text-slate-600 hover:bg-slate-50'}`}
                                    >
                                        الاختبارات والتقييمات
                                    </button>
                                </div>

                                {teacherTab === 'attendance' && (
                                    <div className="space-y-4 max-w-3xl mx-auto">
                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 overflow-hidden divide-y divide-slate-100">
                                            <div className="p-4 bg-slate-50 flex justify-between items-center text-xs border-b">
                                                <span className="font-bold text-slate-700">رصد الحضور لحلقة: {currentTeacher.subject}</span>
                                                <span className="text-slate-500 font-bold">الطلاب: {teacherStudents.length} (أبجدياً)</span>
                                            </div>
                                            {teacherStudents.map(s => {
                                                const currentStatus = attendanceBatch[s.id] || 'present';
                                                return (
                                                    <div key={s.id} className={`p-4 flex flex-wrap justify-between items-center transition-colors gap-2 ${currentStatus === 'absent' ? 'bg-rose-50/60' : currentStatus === 'excused' ? 'bg-amber-50/60' : ''}`}>
                                                        <div>
                                                            <span className="font-bold text-base text-slate-800">{s.name}</span>
                                                            <span className="text-xs text-slate-400 block mt-0.5">غياباته السابقة: {s.absences || 0}</span>
                                                        </div>
                                                        <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                            <button onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: 'present'}))} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'present' ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600'}`}>حاضر</button>
                                                            <button onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: 'excused'}))} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'excused' ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-600'}`}>مستئذن</button>
                                                            <button onClick={() => setAttendanceBatch(prev => ({...prev, [s.id]: 'absent'}))} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'absent' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600'}`}>غائب</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        {teacherStudents.length > 0 && (
                                            <button onClick={() => submitAttendance(currentTeacher.subject)} className="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-4 rounded-2xl font-bold shadow-lg shadow-emerald-900/10 transition-all">
                                                اعتماد كشف التحضير وإرساله للإدارة سحابياً ✓
                                            </button>
                                        )}
                                    </div>
                                )}

                                {teacherTab === 'homework' && (
                                    <div className="space-y-4 max-w-3xl mx-auto">
                                        <div className="bg-purple-50 p-4 rounded-2xl text-xs text-purple-900 border border-purple-200/80 flex justify-between items-center shadow-sm">
                                            <span>رصد تسليم الواجبات لحلقة: <b>{currentTeacher.subject}</b> (الحد الأقصى 15 واجباً)</span>
                                            <span className="font-extrabold text-purple-700">لم يسلموا: {Object.values(homeworkBatch).filter(v => v === 'missed').length}</span>
                                        </div>
                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-200/80 overflow-hidden divide-y divide-slate-100">
                                            {teacherStudents.map(s => {
                                                const currentStatus = homeworkBatch[s.id] || 'submitted';
                                                const alert = getHomeworkAlert(s.missedHomework || 0);

                                                return (
                                                    <div key={s.id} className={`p-4 flex flex-wrap justify-between items-center transition-colors gap-2 ${currentStatus === 'missed' ? 'bg-rose-50/60' : ''}`}>
                                                        <div>
                                                            <span className="font-bold text-base text-slate-800">{s.name}</span>
                                                            <div className="flex items-center gap-2 mt-1">
                                                                <span className="text-xs text-slate-400">مرات عدم التسليم: {s.missedHomework || 0}</span>
                                                                <span className={`text-[10px] px-2 py-0.5 rounded-md font-bold ${alert.color}`}>{alert.text}</span>
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                            <button onClick={() => setHomeworkBatch(prev => ({...prev, [s.id]: 'submitted'}))} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'submitted' ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600'}`}>حل الواجب ✓</button>
                                                            <button onClick={() => setHomeworkBatch(prev => ({...prev, [s.id]: 'missed'}))} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'missed' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600'}`}>لم يحل ✕</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        {teacherStudents.length > 0 && (
                                            <button onClick={() => submitHomework(currentTeacher.subject)} className="w-full bg-purple-700 hover:bg-purple-800 text-white py-4 rounded-2xl font-bold shadow-lg shadow-purple-900/10 transition-all">
                                                اعتماد كشف الواجبات وإرساله للإدارة سحابياً ✓
                                            </button>
                                        )}
                                    </div>
                                )}

                                {teacherTab === 'exams' && (
                                    <div className="space-y-6">
                                        <div className="bg-gradient-to-br from-slate-900 to-indigo-950 text-white p-6 rounded-3xl shadow-xl flex flex-wrap justify-between items-center gap-6 border border-slate-800">
                                            <div className="space-y-1">
                                                <span className="text-xs text-indigo-300 font-bold block">مؤشر أداء الحلقة لـ ({EXAM_TYPES.find(x => x.id === selectedExamType)?.title})</span>
                                                <h3 className="text-3xl font-extrabold flex items-center gap-3">
                                                    <span>نسبة الاجتياز:</span>
                                                    <span className={teacherExamStats.rate >= 80 ? "text-emerald-400" : teacherExamStats.rate >= 60 ? "text-amber-400" : "text-rose-400"}>
                                                        %{teacherExamStats.rate}
                                                    </span>
                                                </h3>
                                                <p className="text-xs text-slate-400">
                                                    اجتاز {teacherExamStats.passed} من أصل {teacherExamStats.graded} طالب تم رصدهم (إجمالي طلاب الحلقة: {teacherExamStats.total})
                                                </p>
                                            </div>
                                            <div className="w-full md:w-64 bg-white/10 p-2.5 rounded-2xl border border-white/10 space-y-1.5">
                                                <div className="flex justify-between text-xs font-bold text-slate-300">
                                                    <span>المعدل المئوي</span>
                                                    <span>%{teacherExamStats.rate}</span>
                                                </div>
                                                <div className="w-full bg-slate-800 h-3 rounded-full overflow-hidden">
                                                    <div 
                                                        className={`h-full transition-all duration-700 rounded-full ${teacherExamStats.rate >= 80 ? "bg-emerald-500" : teacherExamStats.rate >= 60 ? "bg-amber-500" : "bg-rose-500"}`}
                                                        style={{ width: `${teacherExamStats.rate}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden p-5 space-y-4">
                                            <div className="flex flex-wrap justify-between items-center gap-3 border-b pb-4">
                                                <div className="flex items-center gap-2">
                                                    <span className="font-bold text-sm text-slate-700">تحديد الاختبار للرصد:</span>
                                                    <select 
                                                        value={selectedExamType} 
                                                        onChange={e => setSelectedExamType(e.target.value)}
                                                        className="bg-emerald-50 text-emerald-900 border border-emerald-200 rounded-xl px-4 py-2 text-xs font-bold outline-none"
                                                    >
                                                        {EXAM_TYPES.map(ex => (
                                                            <option key={ex.id} value={ex.id}>{ex.title}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <button 
                                                    onClick={() => exportExamsToExcel(teacherStudents, currentTeacher.subject)}
                                                    className="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm transition-all flex items-center gap-1"
                                                >
                                                    📥 تصدير درجات حلقتي Excel
                                                </button>
                                            </div>

                                            <div className="overflow-x-auto">
                                                <table className="w-full text-right text-sm">
                                                    <thead className="bg-slate-50 text-slate-500 text-xs">
                                                        <tr>
                                                            <th className="p-4 font-bold">اسم الطالب</th>
                                                            <th className="p-4 font-bold text-center">الدرجة / التقدير (اضغط لإلغاء التحديد)</th>
                                                            <th className="p-4 font-bold text-center">ملاحظات المعلم (لهذا الاختبار فقط)</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {teacherStudents.map(s => {
                                                            const currentGrade = s.exams?.[selectedExamType] || '';
                                                            const currentNotes = s.examNotes?.[selectedExamType] || '';
                                                            const isFinal = selectedExamType === 'final_exam';

                                                            return (
                                                                <tr key={s.id} className="hover:bg-slate-50">
                                                                    <td className="p-4">
                                                                        <div className="font-bold text-slate-800">{s.name}</div>
                                                                        <div className="text-xs text-slate-400" dir="ltr">{s.phone}</div>
                                                                    </td>
                                                                    <td className="p-4 text-center">
                                                                        {isFinal ? (
                                                                            <div className="inline-flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                                                <button 
                                                                                    onClick={() => handleToggleStudentExam(s.id, selectedExamType, 'مجتاز')}
                                                                                    className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${currentGrade === 'مجتاز' ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600'}`}
                                                                                >
                                                                                    مجتاز ✓
                                                                                </button>
                                                                                <button 
                                                                                    onClick={() => handleToggleStudentExam(s.id, selectedExamType, 'غير مجتاز')}
                                                                                    className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${currentGrade === 'غير مجتاز' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600'}`}
                                                                                >
                                                                                    غير مجتاز ✕
                                                                                </button>
                                                                            </div>
                                                                        ) : (
                                                                            <div className="inline-flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                                                <button 
                                                                                    onClick={() => handleToggleStudentExam(s.id, selectedExamType, 'متمكن')}
                                                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentGrade === 'متمكن' ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600'}`}
                                                                                >
                                                                                    متمكن 🌟
                                                                                </button>
                                                                                <button 
                                                                                    onClick={() => handleToggleStudentExam(s.id, selectedExamType, 'ضعيف')}
                                                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentGrade === 'ضعيف' ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-600'}`}
                                                                                >
                                                                                    ضعيف ⚠️
                                                                                </button>
                                                                                <button 
                                                                                    onClick={() => handleToggleStudentExam(s.id, selectedExamType, 'مخفق')}
                                                                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentGrade === 'مخفق' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600'}`}
                                                                                >
                                                                                    مخفق ✕
                                                                                </button>
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                    <td className="p-4 text-center">
                                                                        <textarea 
                                                                            key={`${s.id}_${selectedExamType}`}
                                                                            defaultValue={currentNotes} 
                                                                            placeholder="اكتب ملاحظة حول أداء الطالب..." 
                                                                            rows="2"
                                                                            className="w-full min-w-[200px] max-w-md p-2.5 text-xs bg-slate-50 border-2 border-slate-200 rounded-xl outline-none focus:border-emerald-600 focus:bg-white transition-all resize-y shadow-inner"
                                                                            onBlur={(e) => handleUpdateStudentExamNotes(s.id, selectedExamType, e.target.value)}
                                                                        />
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : role === 'monitor' ? (
                            /* ======================= بوابة المسجل الكاملة ======================= */
                            <div className="space-y-6">
                                {!activeMonitorGroup && !isMonitoringTeachers ? (
                                    <div className="space-y-4">
                                        <div 
                                            onClick={() => setIsMonitoringTeachers(true)}
                                            className="bg-gradient-to-r from-emerald-800 to-teal-800 text-white p-5 rounded-3xl shadow-lg hover:shadow-xl cursor-pointer flex justify-between items-center transition-all border border-emerald-600"
                                        >
                                            <div className="space-y-1">
                                                <div className="flex items-center gap-2">
                                                    <span className="bg-white/20 px-3 py-1 rounded-xl text-xs font-bold">خاص بالمسجل</span>
                                                    <h2 className="font-extrabold text-xl">📋 تحضير المعلمين لليوم</h2>
                                                </div>
                                                <p className="text-xs text-emerald-100">رصد الحضور اليومي للمعلمين هجائياً واعتماده سحابياً ({teachers.length} معلم)</p>
                                                {teacherLogs.some(l => l.date === getTodayDateStr()) && (
                                                    <span className="inline-block text-[11px] bg-emerald-500 text-white font-bold px-2 py-0.5 rounded">
                                                        ✓ تم رصد حضور المعلمين اليوم (اضغط للتعديل)
                                                    </span>
                                                )}
                                            </div>
                                            <span className="text-3xl font-bold bg-white/10 w-12 h-12 rounded-2xl flex items-center justify-center">←</span>
                                        </div>

                                        <div className="bg-emerald-50 p-5 rounded-2xl border border-emerald-200/80 flex justify-between items-center">
                                            <div>
                                                <h2 className="font-bold text-emerald-950 text-lg">تحضير الحلقات البديل (عند غياب المعلم)</h2>
                                                <p className="text-xs text-emerald-700 mt-1">اختر الحلقة التي ترغب بتحضيرها نيابة عن معلمها الغائب</p>
                                            </div>
                                            <span className="bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl">{groups.length} حلقات</span>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {groups.map(g => {
                                                const count = students.filter(s => String(s.group).trim() === g && s.active).length;
                                                const isAttDone = logs.some(l => l.id === `${g.replace(/\s+/g, '_')}_${getTodayDateStr()}`);
                                                const isHwDone = homeworkLogs.some(l => l.id === `hw_${g.replace(/\s+/g, '_')}_${getTodayDateStr()}`);

                                                return (
                                                    <div 
                                                        key={g} 
                                                        onClick={() => handleStartGroup(g)}
                                                        className="bg-white p-5 rounded-3xl border border-slate-200/80 hover:border-emerald-500 hover:shadow-md cursor-pointer flex justify-between items-center transition-all"
                                                    >
                                                        <div>
                                                            <h3 className="font-bold text-slate-800 text-lg">{g}</h3>
                                                            <p className="text-xs text-slate-400 mt-1">{count} طالب نشط</p>
                                                            <div className="flex gap-2 mt-2">
                                                                {isAttDone && <span className="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded">التحضير مرصود ✓</span>}
                                                                {isHwDone && <span className="text-[10px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded">الواجبات مرصودة ✓</span>}
                                                            </div>
                                                        </div>
                                                        <span className="text-emerald-700 font-bold text-xl">←</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : isMonitoringTeachers ? (
                                    <div className="space-y-4 max-w-3xl mx-auto">
                                        <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                                            <button onClick={() => setIsMonitoringTeachers(false)} className="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-2 rounded-xl">
                                                → رجوع لقائمة الرصد
                                            </button>
                                            <h2 className="font-bold text-lg text-slate-800">تحضير المعلمين أبجدياً ({getTodayDateStr()})</h2>
                                            <div className="flex gap-2 text-xs font-bold">
                                                <span className="text-emerald-600">{Object.values(teacherAttendanceBatch).filter(v => v === 'present').length} حاضر</span>
                                                <span className="text-rose-500">{Object.values(teacherAttendanceBatch).filter(v => v === 'absent').length} غائب</span>
                                            </div>
                                        </div>
