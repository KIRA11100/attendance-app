<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الغياب والاشعارات</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Data ---
        const initialStudents = [
            { id: 1, name: "أحمد محمد علي", phone: "966500000001", group: "الصف الأول", absences: 1 },
            { id: 2, name: "سارة عبد الرحمن", phone: "966500000002", group: "الصف الأول", absences: 4 },
            { id: 3, name: "خالد وليد حسن", phone: "966500000003", group: "الصف الثاني", absences: 7 },
            { id: 4, name: "ليلى محمود", phone: "966500000004", group: "الصف الثالث", absences: 0 },
            { id: 5, name: "عمر يوسف", phone: "966500000005", group: "الصف الثاني", absences: 3 },
        ];

        const initialTemplate = "عزيزي ولي أمر الطالب/ة {student_name}، نفيدكم علماً بغياب الطالب اليوم {date}. نرجو التواصل معنا. علماً أن عدد غياباته الإجمالي: {absence_count}";

        // --- Components ---

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-lg text-white transition-all transform animate-bounce ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                    {message}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null); // { role: 'supervisor' | 'monitor' }
            const [view, setView] = useState('dashboard'); // supervisor views: dashboard, students, settings
            const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('students')) || initialStudents);
            const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('logs')) || []);
            const [template, setTemplate] = useState(() => localStorage.getItem('sms_template') || initialTemplate);
            const [toast, setToast] = useState(null);
            
            // Login State
            const [pin, setPin] = useState("");
            const [selectedRole, setSelectedRole] = useState('monitor');

            // Attendance State (for Monitor)
            const [attendanceBatch, setAttendanceBatch] = useState({}); // studentId: boolean

            // Persist Data
            useEffect(() => { localStorage.setItem('students', JSON.stringify(students)); }, [students]);
            useEffect(() => { localStorage.setItem('logs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('sms_template', template); }, [template]);

            const showToast = (msg, type = 'success') => setToast({ msg, type });

            const handleLogin = () => {
                if (selectedRole === 'supervisor' && pin === '1234') {
                    setUser({ role: 'supervisor' });
                } else if (selectedRole === 'monitor' && pin === '0000') {
                    setUser({ role: 'monitor' });
                } else {
                    alert("رمز التحقق غير صحيح");
                }
            };

            const logout = () => {
                setUser(null);
                setPin("");
            };

            // --- Logic Functions ---
            
            const submitAttendance = () => {
                const absentIds = Object.keys(attendanceBatch).filter(id => attendanceBatch[id] === true).map(Number);
                if (absentIds.length === 0) {
                    if(!confirm("لم يتم تحديد أي طالب غائب. هل تريد الإرسال كتقرير 'الكل حاضر'؟")) return;
                }

                const newLog = {
                    id: Date.now(),
                    date: new Date().toLocaleString('ar-SA'),
                    absentees: absentIds,
                    processed: false
                };

                // Update total absence counts for students
                const updatedStudents = students.map(s => {
                    if (absentIds.includes(s.id)) {
                        return { ...s, absences: s.absences + 1 };
                    }
                    return s;
                });

                setStudents(updatedStudents);
                setLogs([newLog, ...logs]);
                setAttendanceBatch({});
                showToast("تم تسجيل الحضور بنجاح وإرساله للمشرف");
            };

            const deleteStudent = (id) => {
                if(confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
                    setStudents(students.filter(s => s.id !== id));
                    showToast("تم حذف الطالب");
                }
            };

            const addStudent = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newStudent = {
                    id: Date.now(),
                    name: formData.get('name'),
                    phone: formData.get('phone'),
                    group: formData.get('group'),
                    absences: 0
                };
                setStudents([...students, newStudent]);
                e.target.reset();
                showToast("تم إضافة الطالب بنجاح");
            };

            const getStatusBadge = (count) => {
                if (count >= 6) return <span className="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">خطر (حمراء)</span>;
                if (count >= 3) return <span className="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs font-bold">تحذير (صفراء)</span>;
                return <span className="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">طبيعي</span>;
            };

            const formatMsg = (student) => {
                return template
                    .replace('{student_name}', student.name)
                    .replace('{date}', new Date().toLocaleDateString('ar-SA'))
                    .replace('{absence_count}', student.absences);
            };

            const markLogProcessed = (logId) => {
                setLogs(logs.map(l => l.id === logId ? {...l, processed: true} : l));
                showToast("تم تحديث الحالة");
            };

            // --- Views ---

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <div className="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                    <Icon name="shield-check" size={32} className="text-white" />
                                </div>
                                <h1 className="text-2xl font-bold text-gray-800">نظام الحضور والغياب</h1>
                                <p className="text-gray-500 mt-2">يرجى تسجيل الدخول للمتابعة</p>
                            </div>

                            <div className="flex gap-4 mb-6">
                                <button 
                                    onClick={() => setSelectedRole('monitor')}
                                    className={`flex-1 py-3 rounded-xl border-2 transition-all ${selectedRole === 'monitor' ? 'border-blue-600 bg-blue-50 text-blue-600 font-bold' : 'border-gray-100 text-gray-400'}`}
                                >
                                    مسجل غياب
                                </button>
                                <button 
                                    onClick={() => setSelectedRole('supervisor')}
                                    className={`flex-1 py-3 rounded-xl border-2 transition-all ${selectedRole === 'supervisor' ? 'border-blue-600 bg-blue-50 text-blue-600 font-bold' : 'border-gray-100 text-gray-400'}`}
                                >
                                    المشرف
                                </button>
                            </div>

                            <div className="space-y-4">
                                <input 
                                    type="password" 
                                    placeholder="رمز الدخول (PIN)" 
                                    className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-center text-2xl tracking-widest outline-none focus:ring-2 focus:ring-blue-500"
                                    value={pin}
                                    onChange={(e) => setPin(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                />
                                <button 
                                    onClick={handleLogin}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold shadow-lg transition-transform active:scale-95"
                                >
                                    دخول
                                </button>
                               
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-2 rounded-lg">
                                    <Icon name="users" size={20} className="text-white" />
                                </div>
                                <span className="font-bold text-gray-700">
                                    {user.role === 'supervisor' ? 'لوحة المشرف' : 'تسجيل الغياب'}
                                </span>
                            </div>
                            <button onClick={logout} className="text-red-500 p-2 hover:bg-red-50 rounded-full transition-colors">
                                <Icon name="log-out" />
                            </button>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4">
                        {user.role === 'monitor' ? (
                            <div className="space-y-4">
                                <div className="bg-blue-50 p-4 rounded-2xl flex items-center justify-between border border-blue-100">
                                    <div>
                                        <h2 className="font-bold text-blue-800">قائمة الطلاب اليوم</h2>
                                        <p className="text-sm text-blue-600">{new Date().toLocaleDateString('ar-SA')}</p>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-2xl font-bold text-blue-800">{Object.values(attendanceBatch).filter(v => v).length}</span>
                                        <span className="text-sm block text-blue-600">غائب</span>
                                    </div>
                                </div>

                                <div className="space-y-2">
                                    {students.map(student => (
                                        <div 
                                            key={student.id} 
                                            onClick={() => setAttendanceBatch(prev => ({...prev, [student.id]: !prev[student.id]}))}
                                            className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${attendanceBatch[student.id] ? 'bg-red-50 border-red-200' : 'bg-white border-gray-100'}`}
                                        >
                                            <div className="flex items-center gap-4">
                                                <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl ${attendanceBatch[student.id] ? 'bg-red-200 text-red-600' : 'bg-gray-100 text-gray-500'}`}>
                                                    {student.name.charAt(0)}
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-gray-800">{student.name}</h3>
                                                    <p className="text-sm text-gray-500">{student.group}</p>
                                                </div>
                                            </div>
                                            <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors ${attendanceBatch[student.id] ? 'bg-red-500 border-red-500' : 'border-gray-200'}`}>
                                                {attendanceBatch[student.id] && <Icon name="x" size={16} className="text-white" />}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={submitAttendance}
                                    className="fixed bottom-6 right-4 left-4 max-w-4xl mx-auto bg-green-600 text-white p-4 rounded-2xl font-bold shadow-2xl flex items-center justify-center gap-2 hover:bg-green-700"
                                >
                                    <Icon name="check-circle" />
                                    إرسال تقرير الغياب اليومي
                                </button>
                            </div>
                        ) : (
                            /* Supervisor Admin View */
                            <div className="space-y-6">
                                {/* Navigation Tabs */}
                                <div className="flex bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                                    <button 
                                        onClick={() => setView('dashboard')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 ${view === 'dashboard' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
                                        <Icon name="inbox" /> الوارد
                                    </button>
                                    <button 
                                        onClick={() => setView('students')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 ${view === 'students' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
                                        <Icon name="users" /> الطلاب
                                    </button>
                                    <button 
                                        onClick={() => setView('settings')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 ${view === 'settings' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
                                        <Icon name="settings" /> الإعدادات
                                    </button>
                                </div>

                                {view === 'dashboard' && (
                                    <div className="space-y-4">
                                        <h2 className="text-xl font-bold text-gray-800">تنبيهات الغياب الجديدة</h2>
                                        {logs.length === 0 && (
                                            <div className="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200">
                                                <Icon name="coffee" size={48} className="mx-auto text-gray-300 mb-4" />
                                                <p className="text-gray-400">لا توجد جلسات غياب حالياً</p>
                                            </div>
                                        )}
                                        {logs.map(log => (
                                            <div key={log.id} className={`bg-white rounded-2xl shadow-sm border ${log.processed ? 'opacity-60 grayscale' : 'border-blue-100'}`}>
                                                <div className="p-4 border-b border-gray-50 flex justify-between items-center">
                                                    <div>
                                                        <span className="text-xs font-bold text-blue-500 uppercase tracking-wider">جلسة غياب</span>
                                                        <p className="text-sm text-gray-500">{log.date}</p>
                                                    </div>
                                                    {!log.processed ? (
                                                        <button onClick={() => markLogProcessed(log.id)} className="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full hover:bg-green-100 hover:text-green-700 transition-colors">
                                                            تمت المعالجة
                                                        </button>
                                                    ) : (
                                                        <span className="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full">مكتمل</span>
                                                    )}
                                                </div>
                                                <div className="p-4 space-y-3">
                                                    {log.absentees.length === 0 ? <p className="text-sm text-gray-400 italic">لا يوجد غائبين (الكل حاضر)</p> : 
                                                        log.absentees.map(absentId => {
                                                            const s = students.find(st => st.id === absentId);
                                                            if (!s) return null;
                                                            return (
                                                                <div key={absentId} className="flex items-center justify-between bg-gray-50 p-3 rounded-xl">
                                                                    <div>
                                                                        <div className="font-bold text-gray-800">{s.name}</div>
                                                                        <div className="text-xs text-gray-500">{s.phone}</div>
                                                                    </div>
                                                                    <div className="flex gap-2">
                                                                        <button 
                                                                            onClick={() => {
                                                                                navigator.clipboard.writeText(formatMsg(s));
                                                                                showToast("تم نسخ الرسالة");
                                                                            }}
                                                                            className="p-2 bg-white text-gray-600 rounded-lg border border-gray-200 hover:text-blue-600"
                                                                            title="نسخ الرسالة"
                                                                        >
                                                                            <Icon name="copy" size={18} />
                                                                        </button>
                                                                        <a 
                                                                            href={`https://wa.me/${s.phone}?text=${encodeURIComponent(formatMsg(s))}`}
                                                                            target="_blank"
                                                                            className="p-2 bg-green-500 text-white rounded-lg hover:bg-green-600"
                                                                            title="إرسال واتساب"
                                                                        >
                                                                            <Icon name="send" size={18} />
                                                                        </a>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })
                                                    }
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {view === 'students' && (
                                    <div className="space-y-6">
                                        <form onSubmit={addStudent} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                                            <h3 className="font-bold text-gray-800">إضافة طالب جديد</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <input name="name" required placeholder="اسم الطالب الكامل" className="p-3 bg-gray-50 rounded-xl border border-gray-100 outline-none focus:ring-2 focus:ring-blue-500" />
                                                <input name="phone" required placeholder="رقم واتساب (مثال: 966500...)" className="p-3 bg-gray-50 rounded-xl border border-gray-100 outline-none focus:ring-2 focus:ring-blue-500" />
                                                <input name="group" required placeholder="الفصل / المجموعة" className="p-3 bg-gray-50 rounded-xl border border-gray-100 outline-none focus:ring-2 focus:ring-blue-500" />
                                                <button type="submit" className="bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-all">إضافة</button>
                                            </div>
                                        </form>

                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                            <table className="w-full text-right">
                                                <thead className="bg-gray-50 text-gray-500 text-sm">
                                                    <tr>
                                                        <th className="p-4">الطالب</th>
                                                        <th className="p-4">الفصل</th>
                                                        <th className="p-4">حالة الغياب</th>
                                                        <th className="p-4">الإجراء</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-50">
                                                    {students.map(s => (
                                                        <tr key={s.id} className="hover:bg-gray-50 transition-colors">
                                                            <td className="p-4 font-bold text-gray-800">{s.name}</td>
                                                            <td className="p-4 text-gray-500 text-sm">{s.group}</td>
                                                            <td className="p-4">
                                                                <div className="flex flex-col gap-1">
                                                                    <span className="text-sm font-bold">{s.absences} غيابات</span>
                                                                    {getStatusBadge(s.absences)}
                                                                </div>
                                                            </td>
                                                            <td className="p-4 text-left">
                                                                <button onClick={() => deleteStudent(s.id)} className="text-red-400 hover:text-red-600 p-2">
                                                                    <Icon name="trash-2" size={18} />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {view === 'settings' && (
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                                        <h3 className="font-bold text-gray-800">نموذج الرسالة التلقائية</h3>
                                        <p className="text-sm text-gray-500">استخدم الكلمات المفتاحية: {'{student_name}'} ، {'{date}'} ، {'{absence_count}'}</p>
                                        <textarea 
                                            className="w-full p-4 h-40 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                                            value={template}
                                            onChange={(e) => setTemplate(e.target.value)}
                                        ></textarea>
                                        <button 
                                            onClick={() => showToast("تم حفظ النموذج")}
                                            className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg"
                                        >
                                            حفظ الإعدادات
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {toast && (
                        <Toast 
                            message={toast.msg} 
                            type={toast.type} 
                            onClose={() => setToast(null)} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
