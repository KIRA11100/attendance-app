<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إتقان لمتابعة الحلقات</title>
    <!-- Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); }
        .modal-overlay { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); }
        input[type="checkbox"] { accent-color: #2563eb; width: 1.15rem; height: 1.15rem; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const formatSaudiPhone = (input) => {
            if (!input) return '966500000000';
            let num = String(input).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, '');
            if (num.startsWith('05')) num = '966' + num.substring(1);
            else if (num.startsWith('5') && num.length === 9) num = '966' + num;
            else if (num.length === 9) num = '966' + num;
            return num || '966500000000';
        };

        const initialAbsenceTemplate = "عزيزي ولي أمر الطالب/ة {student_name}، نفيدكم علماً بغياب الطالب اليوم {date}. نرجو التواصل معنا. علماً أن عدد غياباته الإجمالي: {absence_count}";
        const initialExcusedTemplate = "عزيزي ولي أمر الطالب/ة {student_name}، تم تسجيل استئذان الطالب اليوم {date} بعذر مقبول. شاكرين ومقدرين تواصلكم.";

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl shadow-xl text-white font-bold text-sm transition-all animate-bounce ${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>
                    {message}
                </div>
            );
        };

        const App = () => {
            const [role, setRole] = useState(null);
            const [view, setView] = useState('inbox');
            
            const [students, setStudents] = useState(() => {
                try {
                    const saved = localStorage.getItem('itqan_v6_students');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });
            const [logs, setLogs] = useState(() => {
                try {
                    const saved = localStorage.getItem('itqan_v6_logs');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });
            const [template, setTemplate] = useState(() => localStorage.getItem('itqan_v6_template') || initialAbsenceTemplate);
            const [excusedTemplate, setExcusedTemplate] = useState(() => localStorage.getItem('itqan_v6_excused_template') || initialExcusedTemplate);
            const [toast, setToast] = useState(null);

            const [pin, setPin] = useState('');
            const [activeMonitorGroup, setActiveMonitorGroup] = useState(null);
            // attendanceBatch[studentId] = 'present' | 'absent' | 'excused'
            const [attendanceBatch, setAttendanceBatch] = useState({});

            // Modals
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [newStudent, setNewStudent] = useState({ name: '', phone: '', group: '', active: true });

            const [selectedSids, setSelectedSids] = useState([]);
            const [filterGroup, setFilterGroup] = useState('ALL');
            const fileInputRef = useRef(null);

            useEffect(() => { localStorage.setItem('itqan_v6_students', JSON.stringify(students)); }, [students]);
            useEffect(() => { localStorage.setItem('itqan_v6_logs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('itqan_v6_template', template); }, [template]);
            useEffect(() => { localStorage.setItem('itqan_v6_excused_template', excusedTemplate); }, [excusedTemplate]);

            const showToast = (msg, type = 'success') => setToast({ msg, type });

            const groups = useMemo(() => [...new Set(students.map(s => String(s.group).trim()))].filter(Boolean), [students]);

            const handleLogin = () => {
                if (pin === '1234') setRole('supervisor');
                else if (pin === '0000') setRole('monitor');
                else alert('رمز الدخول غير صحيح (المشرف: 1234 | المسجل: 0000)');
                setPin('');
            };

            const logout = () => {
                setRole(null);
                setPin('');
                setActiveMonitorGroup(null);
                setAttendanceBatch({});
                setEditingStudent(null);
                setShowAddModal(false);
                setSelectedSids([]);
            };

            const handleExcelImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws, { defval: "" });

                        if (data.length === 0) {
                            showToast("الملف فارغ", "error");
                            return;
                        }

                        const parsedList = data.map((row, idx) => {
                            const clean = {};
                            Object.keys(row).forEach(k => clean[k.trim()] = String(row[k]).trim());

                            const name = clean['الاسم'] || clean['اسم الطالب'] || clean['name'] || clean['Name'] || '';
                            const phone = formatSaudiPhone(clean['الرقم'] || clean['رقم الجوال'] || clean['phone'] || clean['Phone'] || '');
                            const group = clean['الحلقة'] || clean['الفصل'] || clean['Group'] || 'عام';
                            const rawStatus = clean['الحالة'] || clean['status'] || 'مستمر';
                            const isActive = !(rawStatus.includes('منقطع') || rawStatus.includes('غير') || rawStatus.includes('false'));

                            return {
                                id: Date.now() + idx,
                                name: name,
                                phone: phone,
                                group: group,
                                absences: parseInt(clean['غيابات'] || clean['absences'] || 0) || 0,
                                active: isActive
                            };
                        }).filter(s => s.name && s.name.length > 1);

                        if (parsedList.length === 0) {
                            showToast("لم يتم العثور على عمود باسم 'الاسم' داخل الملف", "error");
                            return;
                        }

                        setStudents(prev => [...prev, ...parsedList]);
                        showToast(`تم استيراد ${parsedList.length} طالب بنجاح!`);
                        if (fileInputRef.current) fileInputRef.current.value = "";
                    } catch (err) {
                        showToast("حدث خطأ أثناء قراءة ملف Excel", "error");
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = '';
            };

            const downloadSample = () => {
                const ws = XLSX.utils.json_to_sheet([
                    { "الاسم": "أحمد محمد", "الرقم": "0501234567", "الحلقة": "الرابع ب", "الحالة": "مستمر", "غيابات": 0 },
                    { "الاسم": "أمجد المريسي", "الرقم": "0502153365", "الحلقة": "الرابع ب", "الحالة": "مستمر", "غيابات": 0 }
                ]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "الطلاب");
                XLSX.writeFile(wb, "نموذج_إتقان_للطلاب.xlsx");
            };

            const handleAddStudent = (e) => {
                e.preventDefault();
                if (!newStudent.name.trim()) return;

                const student = {
                    id: Date.now(),
                    name: newStudent.name.trim(),
                    phone: formatSaudiPhone(newStudent.phone),
                    group: newStudent.group.trim() || 'عام',
                    absences: 0,
                    active: newStudent.active
                };

                setStudents(prev => [...prev, student]);
                setNewStudent({ name: '', phone: '', group: '', active: true });
                setShowAddModal(false);
                showToast("تمت إضافة الطالب بنجاح");
            };

            const handleSaveEdit = (e) => {
                e.preventDefault();
                setStudents(prev => prev.map(s => String(s.id) === String(editingStudent.id) ? {
                    ...editingStudent,
                    name: editingStudent.name.trim(),
                    phone: formatSaudiPhone(editingStudent.phone),
                    group: editingStudent.group.trim(),
                    absences: parseInt(editingStudent.absences || 0),
                    active: editingStudent.active === true || editingStudent.active === 'true'
                } : s));
                setEditingStudent(null);
                showToast("تم تحديث بيانات الطالب");
            };

            // اعتماد الكشف من المسجل
            const submitAttendance = () => {
                const currentGroup = String(activeMonitorGroup).trim();
                const activeGroupStudents = students.filter(s => String(s.group).trim() === currentGroup && s.active);

                const absentees = [];
                const excused = [];

                activeGroupStudents.forEach(s => {
                    const st = attendanceBatch[s.id];
                    if (st === 'absent') absentees.push(String(s.id));
                    else if (st === 'excused') excused.push(String(s.id));
                });

                if (absentees.length === 0 && excused.length === 0) {
                    if (!confirm(`لم تسجل أي غائب أو مستئذن في "${currentGroup}". هل تريد إرسال الكشف كـ 'الكل حاضر'؟`)) return;
                }

                const logEntry = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString('ar-SA'),
                    group: currentGroup,
                    absentees,
                    excused,
                    reviewed: false
                };

                // إضافة الغياب فقط للغائبين بدون عذر
                setStudents(prevStudents => {
                    return prevStudents.map(student => {
                        if (absentees.includes(String(student.id))) {
                            return { ...student, absences: (parseInt(student.absences) || 0) + 1 };
                        }
                        return student;
                    });
                });

                setLogs(prevLogs => [logEntry, ...prevLogs]);
                showToast("تم اعتماد كشف التحضير وإرساله للمشرف بنجاح");
                setActiveMonitorGroup(null);
                setAttendanceBatch({});
            };

            // تحويل حالة الطالب من غائب إلى مستئذن من قبل المشرف
            const convertAbsentToExcused = (logId, studentId) => {
                const sIdStr = String(studentId);
                // 1. خصم الغياب من رصيد الطالب
                setStudents(prev => prev.map(s => {
                    if (String(s.id) === sIdStr) {
                        return { ...s, absences: Math.max(0, (parseInt(s.absences) || 1) - 1) };
                    }
                    return s;
                }));

                // 2. تحديث سجل المحضر
                setLogs(prev => prev.map(log => {
                    if (log.id === logId) {
                        const newAbs = (log.absentees || []).filter(id => String(id) !== sIdStr);
                        const newExc = [...(log.excused || []), sIdStr];
                        return { ...log, absentees: newAbs, excused: newExc };
                    }
                    return log;
                }));

                showToast("تم تحويل الطالب إلى مستئذن وخصم الغياب من رصيده");
            };

            const deleteStudent = (id) => {
                if (confirm('هل أنت متأكد من حذف هذا الطالب نهائياً؟')) {
                    setStudents(prev => prev.filter(s => String(s.id) !== String(id)));
                    setSelectedSids(prev => prev.filter(sid => String(sid) !== String(id)));
                    showToast("تم حذف الطالب");
                }
            };

            const deleteSelected = () => {
                if (selectedSids.length === 0) return;
                if (confirm(`هل أنت متأكد من حذف ${selectedSids.length} طالب محددين؟`)) {
                    setStudents(prev => prev.filter(s => !selectedSids.includes(String(s.id))));
                    setSelectedSids([]);
                    showToast("تم حذف الطلاب المحددين");
                }
            };

            const deleteGroup = () => {
                if (filterGroup === 'ALL' || !confirm(`تحذير: هل أنت متأكد من حذف جميع طلاب حلقة ${filterGroup}؟`)) return;
                setStudents(prev => prev.filter(s => String(s.group).trim() !== filterGroup));
                setFilterGroup('ALL');
                showToast(`تم حذف طلاب حلقة ${filterGroup}`);
            };

            const clearAll = () => {
                if (confirm("تحذير أخير: هل أنت متأكد من مسح جميع بيانات الطلاب بالكامل؟")) {
                    setStudents([]);
                    setSelectedSids([]);
                    showToast("تم مسح جميع الطلاب");
                }
            };

            const getStatusBadge = (count) => {
                const c = Number(count) || 0;
                if (c >= 6) return <span className="bg-red-100 text-red-700 px-2.5 py-0.5 rounded-md text-xs font-bold">خطر (حمراء)</span>;
                if (c >= 3) return <span className="bg-yellow-100 text-yellow-700 px-2.5 py-0.5 rounded-md text-xs font-bold">تحذير (صفراء)</span>;
                return <span className="bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-md text-xs font-bold">طبيعي</span>;
            };

            const filteredStudents = useMemo(() => {
                return filterGroup === 'ALL' ? students : students.filter(s => String(s.group).trim() === filterGroup);
            }, [students, filterGroup]);

            if (!role) return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-6 text-center">
                        <div>
                            <div className="w-16 h-16 bg-blue-600 text-white text-3xl font-bold rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                ✓
                            </div>
                            <h1 className="text-2xl font-extrabold text-slate-800">نظام إتقان</h1>
                            <p className="text-slate-400 text-sm mt-1">بوابة متابعة الحضور والغياب والاستئذان</p>
                        </div>
                        <div className="space-y-4">
                            <input 
                                type="password" 
                                placeholder="رمز الدخول (PIN)" 
                                className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-2xl tracking-widest outline-none focus:border-blue-600 transition-all"
                                value={pin}
                                onChange={e => setPin(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                            />
                            <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-bold text-lg shadow-lg transition-transform active:scale-95">
                                تسجيل الدخول
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 max-w-5xl mx-auto">
                    <header className="sticky top-0 z-30 glass border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <span className="bg-blue-600 text-white px-3 py-1.5 rounded-xl font-bold text-sm">نظام إتقان</span>
                            <span className="font-bold text-slate-700 text-base">{role === 'supervisor' ? 'لوحة تحكم المشرف' : 'بوابة مسجل الغياب'}</span>
                        </div>
                        <button onClick={logout} className="text-xs font-bold text-red-500 hover:bg-red-50 px-3 py-2 rounded-xl transition-colors">
                            تسجيل الخروج
                        </button>
                    </header>

                    <main className="p-4 md:p-6">
                        {role === 'monitor' ? (
                            /* واجهة مسجل الغياب */
                            <div className="space-y-6">
                                {!activeMonitorGroup ? (
                                    <div className="space-y-4">
                                        <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 flex justify-between items-center">
                                            <div>
                                                <h2 className="font-bold text-blue-900 text-lg">قائمة الحلقات / الفصول</h2>
                                                <p className="text-xs text-blue-600 mt-1">اضغط على الحلقة لتسجيل الحضور والغياب والاستئذان</p>
                                            </div>
                                            <span className="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">{groups.length} حلقات</span>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {groups.map(g => {
                                                const activeCount = students.filter(s => String(s.group).trim() === g && s.active).length;
                                                return (
                                                    <div 
                                                        key={g} 
                                                        onClick={() => { setActiveMonitorGroup(g); setAttendanceBatch({}); }}
                                                        className="bg-white p-5 rounded-3xl border border-slate-100 hover:border-blue-400 hover:shadow-md cursor-pointer flex justify-between items-center transition-all group"
                                                    >
                                                        <div>
                                                            <h3 className="font-bold text-slate-800 text-lg">{g}</h3>
                                                            <p className="text-xs text-slate-400 mt-1">{activeCount} طالب نشط</p>
                                                        </div>
                                                        <span className="text-blue-600 font-bold text-xl group-hover:translate-x-1 transition-transform">←</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        {groups.length === 0 && <div className="text-center py-20 bg-white rounded-3xl border border-dashed text-slate-400 font-bold">لا توجد حلقات مسجلة حالياً</div>}
                                    </div>
                                ) : (
                                    <div className="space-y-4 max-w-2xl mx-auto">
                                        <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                            <button onClick={() => setActiveMonitorGroup(null)} className="text-xs font-bold text-slate-600 hover:text-blue-600 bg-slate-100 px-3 py-2 rounded-xl">
                                                → رجوع للحلقات
                                            </button>
                                            <h2 className="font-bold text-lg text-slate-800">{activeMonitorGroup}</h2>
                                            <div className="flex gap-2 text-xs font-bold">
                                                <span className="text-red-500">
                                                    {Object.values(attendanceBatch).filter(v => v === 'absent').length} غائب
                                                </span>
                                                <span className="text-amber-600">
                                                    {Object.values(attendanceBatch).filter(v => v === 'excused').length} مستئذن
                                                </span>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden divide-y divide-slate-50">
                                            {students.filter(s => String(s.group).trim() === activeMonitorGroup && s.active).map(s => {
                                                const currentStatus = attendanceBatch[s.id] || 'present';
                                                return (
                                                    <div 
                                                        key={s.id} 
                                                        className={`p-4 flex flex-wrap justify-between items-center gap-3 transition-colors ${currentStatus === 'absent' ? 'bg-red-50/70' : currentStatus === 'excused' ? 'bg-amber-50/70' : 'hover:bg-slate-50/60'}`}
                                                    >
                                                        <div>
                                                            <span className={`font-bold text-base ${currentStatus === 'absent' ? 'text-red-700' : currentStatus === 'excused' ? 'text-amber-800' : 'text-slate-800'}`}>{s.name}</span>
                                                            <span className="text-xs text-slate-400 block mt-0.5">الغيابات السابقة: {s.absences || 0}</span>
                                                        </div>

                                                        {/* خيارات التحضير الثلاثية */}
                                                        <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl">
                                                            <button 
                                                                type="button"
                                                                onClick={() => setAttendanceBatch(prev => ({ ...prev, [s.id]: 'present' }))}
                                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'present' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                                            >
                                                                حاضر ✓
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={() => setAttendanceBatch(prev => ({ ...prev, [s.id]: 'excused' }))}
                                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'excused' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                                            >
                                                                مستئذن ⏱️
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={() => setAttendanceBatch(prev => ({ ...prev, [s.id]: 'absent' }))}
                                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currentStatus === 'absent' ? 'bg-red-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                                            >
                                                                غائب ✕
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <button onClick={submitAttendance} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">
                                            اعتماد وإرسال كشف التحضير ✓
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            /* واجهة المشرف */
                            <div className="space-y-6">
                                <div className="flex bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm">
                                    {['inbox', 'students', 'settings'].map(t => (
                                        <button 
                                            key={t}
                                            onClick={() => setView(t)}
                                            className={`flex-1 py-3 rounded-xl font-bold text-sm transition-all ${view === t ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}
                                        >
                                            {t === 'inbox' ? 'الوارد' : t === 'students' ? 'الطلاب والحلقات' : 'الإعدادات'}
                                        </button>
                                    ))}
                                </div>

                                {view === 'inbox' && (
                                    <div className="space-y-4">
                                        {logs.map(log => {
                                            const absentees = log.absentees || [];
                                            const excused = log.excused || [];
                                            const totalIssues = absentees.length + excused.length;

                                            return (
                                                <div key={log.id} className={`bg-white rounded-3xl border transition-all ${log.reviewed ? 'opacity-60 bg-slate-50 border-slate-200' : 'border-blue-100 shadow-sm'}`}>
                                                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 rounded-t-3xl">
                                                        <div className="flex items-center gap-3">
                                                            <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold">{log.group}</span>
                                                            <span className="text-xs text-slate-400">{log.timestamp}</span>
                                                        </div>
                                                        <button 
                                                            onClick={() => setLogs(prev => prev.map(l => l.id === log.id ? {...l, reviewed: !l.reviewed} : l))}
                                                            className={`text-xs px-3 py-1.5 rounded-xl font-bold transition-colors ${log.reviewed ? 'bg-slate-200 text-slate-600' : 'bg-emerald-100 text-emerald-700'}`}
                                                        >
                                                            {log.reviewed ? 'تمت المعالجة' : 'تحديد كـ معالج'}
                                                        </button>
                                                    </div>

                                                    <div className="p-4 space-y-3">
                                                        {totalIssues === 0 ? (
                                                            <div className="text-center text-emerald-600 text-sm font-bold py-2">✓ لا يوجد غياب أو استئذان في هذه الجلسة (الكل حاضر)</div>
                                                        ) : (
                                                            <>
                                                                {/* قائمة الغائبين */}
                                                                {absentees.map(sid => {
                                                                    const s = students.find(st => String(st.id) === String(sid));
                                                                    if (!s) return null;
                                                                    const msg = template
                                                                        .replace(/{student_name}/g, s.name)
                                                                        .replace(/{date}/g, log.timestamp.split(',')[0])
                                                                        .replace(/{absence_count}/g, s.absences);

                                                                    return (
                                                                        <div key={sid} className="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-red-50/50 p-4 rounded-2xl border border-red-100">
                                                                            <div>
                                                                                <div className="flex items-center gap-2">
                                                                                    <span className="font-bold text-slate-800 text-sm">{s.name}</span>
                                                                                    <span className="bg-red-100 text-red-700 text-[10px] px-2 py-0.5 rounded-full font-bold">غائب</span>
                                                                                </div>
                                                                                <div className="text-xs text-slate-500 mt-1" dir="ltr">{s.phone} | إجمالي الغيابات: {s.absences}</div>
                                                                            </div>
                                                                            <div className="flex flex-wrap gap-2">
                                                                                {/* زر التحويل إلى مستئذن */}
                                                                                <button 
                                                                                    onClick={() => convertAbsentToExcused(log.id, s.id)}
                                                                                    className="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-200 px-3 py-1.5 rounded-xl text-xs font-bold transition-colors"
                                                                                    title="تحويل إلى مستئذن وخصم الغياب"
                                                                                >
                                                                                    ⏱️ تحويل لمستئذن
                                                                                </button>
                                                                                <button 
                                                                                    onClick={() => { navigator.clipboard.writeText(msg); showToast("تم نسخ نص رسالة الغياب"); }}
                                                                                    className="bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-slate-100"
                                                                                >
                                                                                    📋 نسخ
                                                                                </button>
                                                                                <a 
                                                                                    href={`https://wa.me/${s.phone}?text=${encodeURIComponent(msg)}`} 
                                                                                    target="_blank"
                                                                                    className="bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-emerald-600 flex items-center gap-1 shadow-sm"
                                                                                >
                                                                                    واتساب 💬
                                                                                </a>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}

                                                                {/* قائمة المستئذنين */}
                                                                {excused.map(sid => {
                                                                    const s = students.find(st => String(st.id) === String(sid));
                                                                    if (!s) return null;
                                                                    const msg = excusedTemplate
                                                                        .replace(/{student_name}/g, s.name)
                                                                        .replace(/{date}/g, log.timestamp.split(',')[0]);

                                                                    return (
                                                                        <div key={sid} className="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-amber-50/50 p-4 rounded-2xl border border-amber-200">
                                                                            <div>
                                                                                <div className="flex items-center gap-2">
                                                                                    <span className="font-bold text-slate-800 text-sm">{s.name}</span>
                                                                                    <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold">مستئذن (بعذر)</span>
                                                                                </div>
                                                                                <div className="text-xs text-slate-500 mt-1" dir="ltr">{s.phone} | الغيابات: {s.absences}</div>
                                                                            </div>
                                                                            <div className="flex gap-2">
                                                                                <button 
                                                                                    onClick={() => { navigator.clipboard.writeText(msg); showToast("تم نسخ نص رسالة الاستئذان"); }}
                                                                                    className="bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-slate-100"
                                                                                >
                                                                                    📋 نسخ
                                                                                </button>
                                                                                <a 
                                                                                    href={`https://wa.me/${s.phone}?text=${encodeURIComponent(msg)}`} 
                                                                                    target="_blank"
                                                                                    className="bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-emerald-600 flex items-center gap-1 shadow-sm"
                                                                                >
                                                                                    واتساب 💬
                                                                                </a>
                                                                            </div>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {logs.length === 0 && <div className="py-20 text-center text-slate-400 font-bold">لا توجد تقارير غياب واردة حتى الآن</div>}
                                    </div>
                                )}

                                {view === 'students' && (
                                    <div className="space-y-6">
                                        <div className="flex flex-wrap gap-3 items-center justify-between bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                                            <div>
                                                <h3 className="font-bold text-slate-800 text-base">إدارة الطلاب والحلقات</h3>
                                                <p className="text-xs text-slate-400 mt-0.5">يمكنك إضافة الطلاب يدوياً أو استيرادهم من ملف Excel</p>
                                            </div>
                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={() => setShowAddModal(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-md">
                                                    + إضافة طالب يدوياً
                                                </button>
                                                <div className="relative inline-block">
                                                    <input type="file" ref={fileInputRef} accept=".xlsx,.xls,.csv" onChange={handleExcelImport} className="hidden" id="excel-input" />
                                                    <label htmlFor="excel-input" className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-bold text-xs cursor-pointer inline-block">
                                                        📊 استيراد Excel
                                                    </label>
                                                </div>
                                                <button onClick={downloadSample} className="bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 px-3 py-2.5 rounded-xl font-bold text-xs">
                                                    📥 نموذج Excel
                                                </button>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                                            <div className="p-4 border-b border-slate-100 flex flex-wrap gap-3 items-center justify-between bg-slate-50/50">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xs font-bold text-slate-600">الحلقة:</span>
                                                    <select 
                                                        value={filterGroup} 
                                                        onChange={e => setFilterGroup(e.target.value)}
                                                        className="bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold outline-none"
                                                    >
                                                        <option value="ALL">جميع الحلقات ({students.length})</option>
                                                        {groups.map(g => <option key={g} value={g}>{g}</option>)}
                                                    </select>
                                                    {filterGroup !== 'ALL' && (
                                                        <button onClick={deleteGroup} className="text-xs bg-red-50 text-red-600 font-bold px-3 py-1.5 rounded-xl hover:bg-red-100">
                                                            حذف طلاب ({filterGroup})
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="flex items-center gap-2">
                                                    {selectedSids.length > 0 && (
                                                        <button onClick={deleteSelected} className="bg-red-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm">
                                                            حذف ({selectedSids.length}) محددين
                                                        </button>
                                                    )}
                                                    {students.length > 0 && (
                                                        <button onClick={clearAll} className="text-xs text-red-500 hover:text-red-700 font-bold px-2 py-1">
                                                            مسح شامل للكل
                                                        </button>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="overflow-x-auto">
                                                <table className="w-full text-right text-sm">
                                                    <thead className="bg-slate-50 text-slate-500 text-xs">
                                                        <tr className="border-b border-slate-100">
                                                            <th className="p-4 w-10">
                                                                <input 
                                                                    type="checkbox" 
                                                                    checked={filteredStudents.length > 0 && selectedSids.length === filteredStudents.length}
                                                                    onChange={e => setSelectedSids(e.target.checked ? filteredStudents.map(s => String(s.id)) : [])}
                                                                />
                                                            </th>
                                                            <th className="p-4 font-bold">اسم الطالب</th>
                                                            <th className="p-4 font-bold">الحلقة</th>
                                                            <th className="p-4 font-bold">الغيابات</th>
                                                            <th className="p-4 font-bold">الحالة</th>
                                                            <th className="p-4 font-bold text-center">الخيارات</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-50">
                                                        {filteredStudents.map(s => (
                                                            <tr key={s.id} className={`hover:bg-slate-50/50 ${!s.active ? 'opacity-60 bg-slate-50' : ''}`}>
                                                                <td className="p-4">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={selectedSids.includes(String(s.id))}
                                                                        onChange={() => setSelectedSids(prev => prev.includes(String(s.id)) ? prev.filter(i => i !== String(s.id)) : [...prev, String(s.id)])}
                                                                    />
                                                                </td>
                                                                <td className="p-4">
                                                                    <div className="font-bold text-slate-800">{s.name}</div>
                                                                    <div className="text-xs text-slate-400 font-medium" dir="ltr">{s.phone}</div>
                                                                </td>
                                                                <td className="p-4 text-slate-600 font-medium">{s.group}</td>
                                                                <td className="p-4">
                                                                    <div className="flex flex-col gap-1 items-start">
                                                                        <span className="font-bold text-xs">{s.absences || 0} غيابات</span>
                                                                        {getStatusBadge(s.absences)}
                                                                    </div>
                                                                </td>
                                                                <td className="p-4">
                                                                    <span className={`text-[10px] px-2.5 py-1 rounded-md font-bold ${s.active ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-200 text-slate-600'}`}>
                                                                        {s.active ? 'مستمر' : 'منقطع'}
                                                                    </span>
                                                                </td>
                                                                <td className="p-4 text-center">
                                                                    <div className="flex justify-center gap-2">
                                                                        <button onClick={() => setEditingStudent({...s, active: s.active !== false})} className="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-xl font-bold text-xs transition-colors">
                                                                            تعديل ✏️
                                                                        </button>
                                                                        <button onClick={() => deleteStudent(s.id)} className="bg-red-50 text-red-600 hover:bg-red-600 hover:text-white px-3 py-1.5 rounded-xl font-bold text-xs transition-colors">
                                                                            حذف 🗑️
                                                                        </button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {filteredStudents.length === 0 && (
                                                            <tr><td colSpan="6" className="p-10 text-center text-slate-400 font-bold">لا يوجد طلاب مسجلين في هذه القائمة</td></tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {view === 'settings' && (
                                    <div className="bg-white p-6 rounded-3xl border border-slate-100 space-y-6 shadow-sm">
                                        <div>
                                            <h3 className="font-bold text-slate-800 text-lg">قالب رسالة الغياب (بدون عذر)</h3>
                                            <p className="text-xs text-slate-400 mb-2">المتغيرات المتاحة: {'{student_name}'} ، {'{date}'} ، {'{absence_count}'}</p>
                                            <textarea 
                                                className="w-full p-4 h-32 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-600 text-sm leading-relaxed"
                                                value={template}
                                                onChange={e => setTemplate(e.target.value)}
                                            />
                                        </div>

                                        <div>
                                            <h3 className="font-bold text-slate-800 text-lg">قالب رسالة الاستئذان (بعذر مقبول)</h3>
                                            <p className="text-xs text-slate-400 mb-2">المتغيرات المتاحة: {'{student_name}'} ، {'{date}'}</p>
                                            <textarea 
                                                className="w-full p-4 h-32 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-600 text-sm leading-relaxed"
                                                value={excusedTemplate}
                                                onChange={e => setExcusedTemplate(e.target.value)}
                                            />
                                        </div>

                                        <button onClick={() => showToast("تم حفظ قوالب الرسائل بنجاح")} className="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold text-xs shadow-md hover:bg-blue-700">
                                            حفظ الإعدادات
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* نافذة إضافة طالب يدوياً */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddStudent} className="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 space-y-4">
                                <h3 className="text-lg font-bold text-slate-800 border-b pb-3">إضافة طالب جديد</h3>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">اسم الطالب الكامل</label>
                                    <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} placeholder="الاسم الثلاثي" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">رقم واتساب ولي الأمر</label>
                                    <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" dir="ltr" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} placeholder="05xxxxxxxx" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">اسم الحلقة أو الفصل</label>
                                    <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" value={newStudent.group} onChange={e => setNewStudent({...newStudent, group: e.target.value})} placeholder="مثال: الرابع ب" />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">حالة الطالب</label>
                                    <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold outline-none" value={newStudent.active ? "true" : "false"} onChange={e => setNewStudent({...newStudent, active: e.target.value === 'true'})}>
                                        <option value="true">مستمر (نشط)</option>
                                        <option value="false">منقطع / غير فعال</option>
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">إضافة الطالب</button>
                                    <button type="button" onClick={() => setShowAddModal(false)} className="px-5 bg-slate-100 font-bold rounded-xl text-slate-600">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* نافذة تعديل بيانات الطالب */}
                    {editingStudent && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleSaveEdit} className="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 space-y-4">
                                <h3 className="text-lg font-bold text-slate-800 border-b pb-3">تعديل بيانات الطالب</h3>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">اسم الطالب</label>
                                    <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">رقم الجوال</label>
                                    <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" dir="ltr" value={editingStudent.phone} onChange={e => setEditingStudent({...editingStudent, phone: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-slate-600 block mb-1">الحلقة</label>
                                    <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" value={editingStudent.group} onChange={e => setEditingStudent({...editingStudent, group: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">الغيابات التراكمية</label>
                                        <input type="number" min="0" className="w-full p-3 bg-slate-50 border rounded-xl outline-none" value={editingStudent.absences} onChange={e => setEditingStudent({...editingStudent, absences: parseInt(e.target.value || 0)})} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">الحالة</label>
                                        <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold outline-none" value={editingStudent.active ? "true" : "false"} onChange={e => setEditingStudent({...editingStudent, active: e.target.value === 'true'})}>
                                            <option value="true">مستمر</option>
                                            <option value="false">منقطع</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md">حفظ التعديلات</button>
                                    <button type="button" onClick={() => setEditingStudent(null)} className="px-5 bg-slate-100 font-bold rounded-xl text-slate-600">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {toast && <Toast message={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
