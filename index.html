<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إتقان - الإدارة السحابية الشاملة</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDbKUezmXISXgC6PL170-soS-d3_lbKf1U",
            authDomain: "itqan-app-3c7a0.firebaseapp.com",
            projectId: "itqan-app-3c7a0",
            storageBucket: "itqan-app-3c7a0.firebasestorage.app",
            messagingSenderId: "896345573209",
            appId: "1:896345573209:web:cd394d95e092a6361f2e48"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const formatSaudiPhone = (input) => {
            if (!input) return '966500000000';
            let num = String(input).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, '');
            if (num.startsWith('05')) num = '966' + num.substring(1);
            else if (num.startsWith('5') && num.length === 9) num = '966' + num;
            else if (num.length === 9) num = '966' + num;
            return num || '966500000000';
        };

        const getTodayDateStr = () => new Date().toISOString().split('T')[0];

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-2xl shadow-xl text-white font-bold text-sm transition-all animate-bounce ${type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>
                    {message}
                </div>
            );
        };

        const getHomeworkAlert = (missedCount) => {
            const count = Number(missedCount) || 0;
            if (count >= 15) return { level: 'exceeded', text: 'تجاوز الحد (15+)', color: 'bg-rose-900 text-white' };
            if (count >= 14) return { level: 'final', text: 'التنبيه النهائي (14)', color: 'bg-red-600 text-white' };
            if (count >= 10) return { level: 'second', text: 'التنبيه الثاني (10)', color: 'bg-amber-600 text-white' };
            if (count >= 5) return { level: 'first', text: 'التنبيه الأول (5)', color: 'bg-yellow-100 text-yellow-800' };
            return { level: 'none', text: 'منتظم', color: 'bg-emerald-50 text-emerald-700' };
        };

        const getAbsenceCategory = (absences) => {
            const c = Number(absences) || 0;
            if (c >= 6) return 'danger';
            if (c >= 3) return 'warning';
            return 'normal';
        };

        const EXAM_TYPES = [
            { id: 'formative_1', title: 'الاختبار البنائي الأول', isFinal: false },
            { id: 'formative_2', title: 'الاختبار البنائي الثاني', isFinal: false },
            { id: 'formative_3', title: 'الاختبار البنائي الثالث', isFinal: false },
            { id: 'formative_4', title: 'الاختبار البنائي الرابع', isFinal: false },
            { id: 'final_exam', title: 'الاختبار النهائي', isFinal: true }
        ];

        // أنماط الألوان المشتركة لملفات Excel
        const STYLES = {
            header: {
                fill: { fgColor: { rgb: "1E3A8A" } },
                font: { name: "Arial", sz: 11, bold: true, color: { rgb: "FFFFFF" } },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } }
            },
            normalCell: {
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "E2E8F0" } }, bottom: { style: "thin", color: { rgb: "E2E8F0" } }, left: { style: "thin", color: { rgb: "E2E8F0" } }, right: { style: "thin", color: { rgb: "E2E8F0" } } }
            },
            greenCell: {
                fill: { fgColor: { rgb: "DCFCE7" } },
                font: { color: { rgb: "166534" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            yellowCell: {
                fill: { fgColor: { rgb: "FEF9C3" } },
                font: { color: { rgb: "854D0E" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            orangeCell: {
                fill: { fgColor: { rgb: "FFEDD5" } },
                font: { color: { rgb: "9A3412" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            },
            redCell: {
                fill: { fgColor: { rgb: "FEE2E2" } },
                font: { color: { rgb: "991B1B" }, bold: true },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: { style: "thin", color: { rgb: "CBD5E1" } }, bottom: { style: "thin", color: { rgb: "CBD5E1" } }, left: { style: "thin", color: { rgb: "CBD5E1" } }, right: { style: "thin", color: { rgb: "CBD5E1" } } }
            }
        };

        const App = () => {
            const [role, setRole] = useState(null);
            const [view, setView] = useState('inbox');
            const [inboxSubTab, setInboxSubTab] = useState('attendance');
            const [pin, setPin] = useState('');
            const [students, setStudents] = useState([]);
            const [teachers, setTeachers] = useState([]);
            const [logs, setLogs] = useState([]);
            const [homeworkLogs, setHomeworkLogs] = useState([]);
            const [pledgeLogs, setPledgeLogs] = useState([]);
            const [teacherLogs, setTeacherLogs] = useState([]);
            
            const [settings, setSettings] = useState({ 
                absence_template: "عزيزي ولي أمر الطالب {student_name}، نفيدكم بغيابه اليوم {date}. إجمالي غياباته: {absence_count}",
                excused_template: "عزيزي ولي أمر الطالب {student_name}، تم تسجيل استئذان الطالب اليوم {date} بعذر مقبول.",
                homework_template: "عزيزي ولي أمر الطالب {student_name}، نود إشعاركم بعدم تسليمه لواجب اليوم {date}. إجمالي مرات عدم التسليم: {missed_count} واجبات ({alert_status}). نأمل متابعته حرصاً على مستواه.",
                formative_exam_template: "السلام عليكم ورحمة الله وبركاته، نفيدكم بنتيجة الطالب {student_name} في ({exam_name}): تقدير الطالب هو [{grade}]. نسأل الله له دوام التوفيق والتميز.",
                final_exam_template: "السلام عليكم ورحمة الله وبركاته، نبارك لكم نتائج نهاية الفصل. نفيدكم بأن الطالب {student_name} في (الاختبار النهائي) قد حصل على نتيجة: [{grade}]. سائلين المولى له التوفيق."
            });
            const [toast, setToast] = useState(null);

            // رصد المسجل
            const [activeMonitorGroup, setActiveMonitorGroup] = useState(null);
            const [monitorMode, setMonitorMode] = useState('attendance');
            const [attendanceBatch, setAttendanceBatch] = useState({});
            const [homeworkBatch, setHomeworkBatch] = useState({});
            const [isMonitoringTeachers, setIsMonitoringTeachers] = useState(false);

            // إدارة الطلاب
            const [showAddModal, setShowAddModal] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [newStudent, setNewStudent] = useState({ name: '', phone: '', group: '', active: true, pledges: 0, missedHomework: 0 });
            const [importPreview, setImportPreview] = useState(null);
            const [selectedSids, setSelectedSids] = useState([]);
            const [filterGroup, setFilterGroup] = useState('ALL');
            const [filterAbsence, setFilterAbsence] = useState('ALL');
            const [filterHomework, setFilterHomework] = useState('ALL');
            const [search, setSearch] = useState('');
            const fileInputRef = useRef(null);

            // إدارة الاختبارات
            const [selectedExamType, setSelectedExamType] = useState('formative_1');
            const [examFilterGroup, setExamFilterGroup] = useState('ALL');

            // التعهدات
            const [showPledgeModal, setShowPledgeModal] = useState(null);
            const [pledgeReason, setPledgeReason] = useState('');

            // المعلمين
            const [showAddTeacherModal, setShowAddTeacherModal] = useState(false);
            const [newTeacher, setNewTeacher] = useState({ name: '', phone: '', subject: '' });
            const [teacherAttendanceBatch, setTeacherAttendanceBatch] = useState({});

            const showToast = (message, type = 'success') => setToast({ message, type });

            useEffect(() => {
                const unsubStudents = db.collection('students').onSnapshot(snap => {
                    setStudents(snap.docs.map(doc => ({ 
                        id: doc.id, 
                        pledges: 0, 
                        missedHomework: 0, 
                        absences: 0, 
                        exams: {}, 
                        ...doc.data() 
                    })));
                }, () => showToast("يرجى التأكد من تفعيل Firestore Database", "error"));

                const unsubTeachers = db.collection('teachers').onSnapshot(snap => {
                    setTeachers(snap.docs.map(doc => ({ id: doc.id, presentCount: 0, absentCount: 0, excusedCount: 0, ...doc.data() })));
                });

                const unsubLogs = db.collection('attendance_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubHwLogs = db.collection('homework_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setHomeworkLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubTeacherLogs = db.collection('teacher_attendance_logs').orderBy('date', 'desc').onSnapshot(snap => {
                    setTeacherLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubPledges = db.collection('pledges_logs').orderBy('timestamp', 'desc').onSnapshot(snap => {
                    setPledgeLogs(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubSettings = db.collection('settings').doc('app_config').onSnapshot(doc => {
                    if (doc.exists) setSettings(prev => ({ ...prev, ...doc.data() }));
                });

                return () => {
                    unsubStudents();
                    unsubTeachers();
                    unsubLogs();
                    unsubHwLogs();
                    unsubTeacherLogs();
                    unsubPledges();
                    unsubSettings();
                };
            }, []);

            useEffect(() => {
                const today = getTodayDateStr();
                const todayLog = teacherLogs.find(l => l.date === today);
                const map = {};
                teachers.forEach(t => {
                    if (todayLog && todayLog.records) {
                        const rec = todayLog.records.find(r => String(r.teacherId) === String(t.id));
                        map[t.id] = rec ? rec.status : 'present';
                    } else {
                        map[t.id] = 'present';
                    }
                });
                setTeacherAttendanceBatch(map);
            }, [teachers, teacherLogs]);

            const groups = useMemo(() => {
                const uniqueGroups = [...new Set(students.map(s => String(s.group).trim()))].filter(Boolean);
                return uniqueGroups.sort((a, b) => a.localeCompare(b, 'ar'));
            }, [students]);

            const sortedTeachers = useMemo(() => {
                return [...teachers].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            }, [teachers]);

            const handleLogin = () => {
                if (pin === '1234') {
                    setRole('supervisor');
                    setToast(null);
                } else if (pin === '0000') {
                    setRole('monitor');
                    setToast(null);
                } else {
                    showToast('رمز الدخول غير صحيح، يرجى المحاولة مرة أخرى', 'error');
                }
                setPin('');
            };

            const logout = () => {
                setRole(null);
                setPin('');
                setActiveMonitorGroup(null);
                setIsMonitoringTeachers(false);
                setAttendanceBatch({});
                setHomeworkBatch({});
                setEditingStudent(null);
                setShowAddModal(false);
                setShowPledgeModal(null);
                setShowAddTeacherModal(false);
            };

            const handleStartGroup = (groupName) => {
                const today = getTodayDateStr();
                const attSessionId = `${groupName.replace(/\s+/g, '_')}_${today}`;
                const hwSessionId = `hw_${groupName.replace(/\s+/g, '_')}_${today}`;
                
                const existingAttLog = logs.find(l => l.id === attSessionId);
                const existingHwLog = homeworkLogs.find(l => l.id === hwSessionId);

                const initialAttMap = {};
                const initialHwMap = {};
                const activeGroupStudents = students.filter(s => String(s.group).trim() === groupName && s.active);

                activeGroupStudents.forEach(s => {
                    if (existingAttLog) {
                        const rec = existingAttLog.records?.find(r => String(r.studentId) === String(s.id));
                        initialAttMap[s.id] = rec ? rec.status : 'present';
                    } else {
                        initialAttMap[s.id] = 'present';
                    }

                    if (existingHwLog) {
                        const rec = existingHwLog.records?.find(r => String(r.studentId) === String(s.id));
                        initialHwMap[s.id] = rec ? rec.status : 'submitted';
                    } else {
                        initialHwMap[s.id] = 'submitted';
                    }
                });

                setAttendanceBatch(initialAttMap);
                setHomeworkBatch(initialHwMap);
                setActiveMonitorGroup(groupName);
                setIsMonitoringTeachers(false);
            };

            const submitAttendance = async () => {
                const groupName = activeMonitorGroup;
                const today = getTodayDateStr();
                const sessionId = `${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingLog = logs.find(l => l.id === sessionId);
                const activeGroupStudents = students
                    .filter(s => String(s.group).trim() === groupName && s.active)
                    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));

                const snapshotRecords = activeGroupStudents.map(s => ({
                    studentId: String(s.id),
                    name: s.name,
                    phone: s.phone,
                    group: s.group,
                    status: attendanceBatch[s.id] || 'present'
                }));

                try {
                    const batch = db.batch();

                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            if (r.status === 'absent') {
                                const ref = db.collection('students').doc(r.studentId);
                                batch.update(ref, { absences: firebase.firestore.FieldValue.increment(-1) });
                            }
                        });
                    }

                    snapshotRecords.forEach(r => {
                        if (r.status === 'absent') {
                            const ref = db.collection('students').doc(r.studentId);
                            batch.update(ref, { absences: firebase.firestore.FieldValue.increment(1) });
                        }
                    });

                    const logRef = db.collection('attendance_logs').doc(sessionId);
                    batch.set(logRef, {
                        id: sessionId,
                        group: groupName,
                        date: today,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        records: snapshotRecords
                    });

                    await batch.commit();
                    showToast(existingLog ? "تم تحديث كشف الحضور بنجاح" : "تم اعتماد كشف الحضور سحابياً");
                    setActiveMonitorGroup(null);
                } catch (err) {
                    showToast("حدث خطأ أثناء الحفظ", "error");
                }
            };

            const submitHomework = async () => {
                const groupName = activeMonitorGroup;
                const today = getTodayDateStr();
                const sessionId = `hw_${groupName.replace(/\s+/g, '_')}_${today}`;
                const existingLog = homeworkLogs.find(l => l.id === sessionId);
                const activeGroupStudents = students
                    .filter(s => String(s.group).trim() === groupName && s.active)
                    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));

                const snapshotRecords = activeGroupStudents.map(s => ({
                    studentId: String(s.id),
                    name: s.name,
                    phone: s.phone,
                    group: s.group,
                    status: homeworkBatch[s.id] || 'submitted'
                }));

                try {
                    const batch = db.batch();

                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            if (r.status === 'missed') {
                                const ref = db.collection('students').doc(r.studentId);
                                batch.update(ref, { missedHomework: firebase.firestore.FieldValue.increment(-1) });
                            }
                        });
                    }

                    snapshotRecords.forEach(r => {
                        if (r.status === 'missed') {
                            const ref = db.collection('students').doc(r.studentId);
                            batch.update(ref, { missedHomework: firebase.firestore.FieldValue.increment(1) });
                        }
                    });

                    const logRef = db.collection('homework_logs').doc(sessionId);
                    batch.set(logRef, {
                        id: sessionId,
                        group: groupName,
                        date: today,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        records: snapshotRecords
                    });

                    await batch.commit();
                    showToast(existingLog ? "تم تحديث كشف الواجبات" : "تم اعتماد كشف الواجبات سحابياً");
                    setActiveMonitorGroup(null);
                } catch (err) {
                    showToast("حدث خطأ أثناء حفظ الواجبات", "error");
                }
            };

            const submitTeacherAttendance = async () => {
                const today = getTodayDateStr();
                const logId = `teachers_${today}`;
                const existingLog = teacherLogs.find(l => l.id === logId);

                const snapshotRecords = sortedTeachers.map(t => ({
                    teacherId: String(t.id),
                    name: t.name,
                    subject: t.subject,
                    status: teacherAttendanceBatch[t.id] || 'present'
                }));

                try {
                    const batch = db.batch();

                    if (existingLog && existingLog.records) {
                        existingLog.records.forEach(r => {
                            const ref = db.collection('teachers').doc(r.teacherId);
                            if (r.status === 'present') batch.update(ref, { presentCount: firebase.firestore.FieldValue.increment(-1) });
                            else if (r.status === 'absent') batch.update(ref, { absentCount: firebase.firestore.FieldValue.increment(-1) });
                            else if (r.status === 'excused') batch.update(ref, { excusedCount: firebase.firestore.FieldValue.increment(-1) });
                        });
                    }

                    snapshotRecords.forEach(r => {
                        const ref = db.collection('teachers').doc(r.teacherId);
                        if (r.status === 'present') batch.update(ref, { presentCount: firebase.firestore.FieldValue.increment(1) });
                        else if (r.status === 'absent') batch.update(ref, { absentCount: firebase.firestore.FieldValue.increment(1) });
                        else if (r.status === 'excused') batch.update(ref, { excusedCount: firebase.firestore.FieldValue.increment(1) });
                    });

                    const logRef = db.collection('teacher_attendance_logs').doc(logId);
                    batch.set(logRef, {
                        id: logId,
                        date: today,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        records: snapshotRecords
                    });

                    await batch.commit();
                    showToast("تم اعتماد تحضير المعلمين لليوم بنجاح ✓");
                    setIsMonitoringTeachers(false);
                } catch (err) {
                    showToast("تعذر حفظ تحضير المعلمين", "error");
                }
            };

            const handleUpdateStudentExam = async (studentId, examKey, grade) => {
                try {
                    await db.collection('students').doc(studentId).update({
                        [`exams.${examKey}`]: grade
                    });
                    showToast("تم تسجيل درجة الاختبار بنجاح");
                } catch (err) {
                    showToast("تعذر حفظ درجة الاختبار", "error");
                }
            };

            const handleDeleteHwLog = async (logId) => {
                if (!confirm("هل تريد إزالة كشف الواجبات هذا بالكامل من الوارد؟")) return;
                try {
                    await db.collection('homework_logs').doc(logId).delete();
                    showToast("تمت إزالة كشف الواجبات");
                } catch (err) {
                    showToast("تعذر حذف الكشف", "error");
                }
            };

            const handleDeleteLog = async (logId) => {
                if (!confirm("هل تريد إزالة هذا الكشف بالكامل من قائمة الوارد؟")) return;
                try {
                    await db.collection('attendance_logs').doc(logId).delete();
                    showToast("تمت إزالة الكشف بنجاح");
                } catch (err) {
                    showToast("تعذر حذف الكشف", "error");
                }
            };

            const handleDismissStudentFromLog = async (logId, studentId) => {
                try {
                    const logRef = db.collection('attendance_logs').doc(logId);
                    const logDoc = await logRef.get();
                    if (!logDoc.exists) return;

                    const logData = logDoc.data();
                    const updatedRecords = logData.records.filter(r => String(r.studentId) !== String(studentId));

                    if (updatedRecords.length === 0) await logRef.delete();
                    else await logRef.update({ records: updatedRecords });
                    showToast("تمت إزالة الطالب من الوارد");
                } catch (err) {
                    showToast("تعذر تحديث الكشف", "error");
                }
            };

            const handleConvertAbsence = async (logId, studentId) => {
                try {
                    const logRef = db.collection('attendance_logs').doc(logId);
                    const logDoc = await logRef.get();
                    if (!logDoc.exists) return;

                    const logData = logDoc.data();
                    const updatedRecords = logData.records.map(r => {
                        if (String(r.studentId) === String(studentId)) {
                            return { ...r, status: 'excused' };
                        }
                        return r;
                    });

                    const batch = db.batch();
                    batch.update(logRef, { records: updatedRecords });
                    batch.update(db.collection('students').doc(String(studentId)), {
                        absences: firebase.firestore.FieldValue.increment(-1)
                    });

                    await batch.commit();
                    showToast("تم تحويل الطالب إلى مستئذن وخصم الغياب");
                } catch (err) {
                    showToast("تعذر التحديث", "error");
                }
            };

            const handleAddPledge = async (e) => {
                e.preventDefault();
                if (!showPledgeModal || !pledgeReason.trim()) return;

                try {
                    const batch = db.batch();
                    const studentRef = db.collection('students').doc(showPledgeModal.id);
                    batch.update(studentRef, {
                        pledges: firebase.firestore.FieldValue.increment(1)
                    });

                    const pledgeLogRef = db.collection('pledges_logs').doc();
                    batch.set(pledgeLogRef, {
                        studentId: showPledgeModal.id,
                        studentName: showPledgeModal.name,
                        group: showPledgeModal.group,
                        reason: pledgeReason.trim(),
                        date: getTodayDateStr(),
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    await batch.commit();
                    showToast(`تم تسجيل التعهد التأديبي على الطالب ${showPledgeModal.name}`);
                    setShowPledgeModal(null);
                    setPledgeReason('');
                } catch (err) {
                    showToast("تعذر تسجيل التعهد", "error");
                }
            };

            const handleResetPledges = async (studentId, studentName) => {
                if (!confirm(`هل تريد تصفير التعهدات للطالب ${studentName}؟`)) return;
                try {
                    await db.collection('students').doc(studentId).update({ pledges: 0 });
                    showToast("تم تصفير تعهدات الطالب");
                } catch (err) {
                    showToast("تعذر التصفير", "error");
                }
            };

            const handleResetHomework = async (studentId, studentName) => {
                if (!confirm(`هل تريد تصفير عداد عدم تسليم الواجبات للطالب ${studentName}؟`)) return;
                try {
                    await db.collection('students').doc(studentId).update({ missedHomework: 0 });
                    showToast("تم تصفير واجبات الطالب");
                } catch (err) {
                    showToast("تعذر التصفير", "error");
                }
            };

            const handleAddTeacher = async (e) => {
                e.preventDefault();
                if (!newTeacher.name.trim()) return;
                try {
                    await db.collection('teachers').add({
                        name: newTeacher.name.trim(),
                        phone: formatSaudiPhone(newTeacher.phone),
                        subject: newTeacher.subject.trim() || 'عام',
                        presentCount: 0,
                        absentCount: 0,
                        excusedCount: 0
                    });
                    setNewTeacher({ name: '', phone: '', subject: '' });
                    setShowAddTeacherModal(false);
                    showToast("تمت إضافة المعلم بنجاح");
                } catch (err) {
                    showToast("تعذر حفظ بيانات المعلم", "error");
                }
            };

            const handleDeleteTeacher = async (id, name) => {
                if (!confirm(`حذف المعلم ${name} نهائياً؟`)) return;
                try {
                    await db.collection('teachers').doc(id).delete();
                    showToast("تم حذف المعلم");
                } catch (err) {
                    showToast("تعذر الحذف", "error");
                }
            };

            const handleExcelFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, { type: 'binary' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const data = XLSX.utils.sheet_to_json(ws, { defval: "" });

                        const parsed = data.map((row) => {
                            const clean = {};
                            Object.keys(row).forEach(k => clean[k.trim()] = String(row[k]).trim());

                            const name = clean['الاسم'] || clean['اسم الطالب'] || clean['name'] || '';
                            const phone = formatSaudiPhone(clean['الرقم'] || clean['رقم الجوال'] || clean['phone'] || '');
                            const group = clean['الحلقة'] || clean['الفصل'] || 'عام';
                            const rawStatus = clean['الحالة'] || 'مستمر';
                            const isActive = !(rawStatus.includes('منقطع') || rawStatus.includes('غير'));

                            return {
                                name,
                                phone,
                                group,
                                absences: parseInt(clean['غيابات'] || 0) || 0,
                                missedHomework: parseInt(clean['واجبات'] || clean['عدم تسليم الواجبات'] || 0) || 0,
                                pledges: parseInt(clean['تعهدات'] || 0) || 0,
                                exams: {},
                                active: isActive
                            };
                        }).filter(s => s.name && s.name.length > 1);

                        if (parsed.length === 0) {
                            showToast("لم يتم العثور على بيانات صالحة", "error");
                            return;
                        }

                        setImportPreview(parsed);
                    } catch (err) {
                        showToast("خطأ في قراءة الملف", "error");
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = '';
            };

            const commitExcelImport = async () => {
                if (!importPreview) return;
                try {
                    const batch = db.batch();
                    importPreview.forEach(s => {
                        const newDocRef = db.collection('students').doc();
                        batch.set(newDocRef, s);
                    });
                    await batch.commit();
                    showToast(`تم استيراد ${importPreview.length} طالب سحابياً`);
                    setImportPreview(null);
                } catch (err) {
                    showToast("خطأ أثناء الحفظ", "error");
                }
            };

            // 1. تصدير التقرير الشامل مع تلوين الخلايا الاحترافي
            const exportAbsencesToExcel = () => {
                if (filteredStudents.length === 0) {
                    showToast("لا توجد بيانات طلاب لتصديرها", "error");
                    return;
                }

                const headers = ["م", "اسم الطالب", "الحلقة / الفصل", "رقم الجوال", "مجموع الغيابات", "حالة الغياب", "تواريخ أيام الغياب", "عدم تسليم الواجبات", "تنبيه الواجبات", "التعهدات", "حالة القيد"];
                const data = [headers];

                filteredStudents.forEach((s, idx) => {
                    const abs = Number(s.absences) || 0;
                    const hw = Number(s.missedHomework) || 0;
                    const hwAlert = getHomeworkAlert(hw);
                    const absCat = getAbsenceCategory(abs);

                    const absenceDates = logs
                        .filter(l => l.records && l.records.some(r => String(r.studentId) === String(s.id) && r.status === 'absent'))
                        .map(l => l.date)
                        .sort()
                        .join('، ');

                    data.push([
                        idx + 1,
                        s.name,
                        s.group,
                        s.phone,
                        abs,
                        absCat === 'danger' ? 'خطر (أحمر)' : absCat === 'warning' ? 'تحذير (أصفر)' : 'طبيعي',
                        absenceDates || (abs > 0 ? "غيابات يدوية سابقة" : "لا يوجد"),
                        hw,
                        hwAlert.text,
                        s.pledges || 0,
                        s.active ? "مستمر" : "منقطع"
                    ]);
                });

                const ws = XLSX.utils.aoa_to_sheet(data);

                // تطبيق التنسيقات والألوان
                data.forEach((row, rIdx) => {
                    row.forEach((_, cIdx) => {
                        const cellRef = XLSX.utils.encode_cell({ r: rIdx, c: cIdx });
                        if (!ws[cellRef]) return;

                        if (rIdx === 0) {
                            ws[cellRef].s = STYLES.header;
                        } else {
                            ws[cellRef].s = { ...STYLES.normalCell };
                            
                            // تلوين عمود حالة الغياب (العمود 5)
                            if (cIdx === 5) {
                                const val = String(row[cIdx]);
                                if (val.includes('خطر')) ws[cellRef].s = STYLES.redCell;
                                else if (val.includes('تحذير')) ws[cellRef].s = STYLES.yellowCell;
                                else ws[cellRef].s = STYLES.greenCell;
                            }

                            // تلوين عمود تنبيه الواجبات (العمود 8)
                            if (cIdx === 8) {
                                const val = String(row[cIdx]);
                                if (val.includes('تجاوز') || val.includes('النهائي')) ws[cellRef].s = STYLES.redCell;
                                else if (val.includes('الثاني')) ws[cellRef].s = STYLES.orangeCell;
                                else if (val.includes('الأول')) ws[cellRef].s = STYLES.yellowCell;
                                else ws[cellRef].s = STYLES.greenCell;
                            }

                            // تلوين حالة القيد (العمود 10)
                            if (cIdx === 10) {
                                ws[cellRef].s = row[cIdx] === 'مستمر' ? STYLES.greenCell : STYLES.normalCell;
                            }
                        }
                    });
                });

                ws['!cols'] = [{ wch: 5 }, { wch: 24 }, { wch: 14 }, { wch: 15 }, { wch: 14 }, { wch: 15 }, { wch: 32 }, { wch: 18 }, { wch: 20 }, { wch: 10 }, { wch: 12 }];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "التقرير الشامل");
                XLSX.writeFile(wb, `التقرير_الشامل_${filterGroup === 'ALL' ? 'الكل' : filterGroup}_${getTodayDateStr()}.xlsx`);
                showToast("تم تصدير التقرير الشامل الملون بنجاح");
            };

            // 2. تصدير نتائج الاختبارات والدرجات مع التلوين الاحترافي
            const exportExamsToExcel = () => {
                if (examFilteredStudents.length === 0) {
                    showToast("لا توجد بيانات طلاب لتصديرها", "error");
                    return;
                }

                const headers = ["م", "اسم الطالب", "الحلقة / الفصل", "رقم الجوال", "البنائي 1", "البنائي 2", "البنائي 3", "البنائي 4", "الاختبار النهائي"];
                const data = [headers];

                examFilteredStudents.forEach((s, idx) => {
                    data.push([
                        idx + 1,
                        s.name,
                        s.group,
                        s.phone,
                        s.exams?.formative_1 || "غير مرصود",
                        s.exams?.formative_2 || "غير مرصود",
                        s.exams?.formative_3 || "غير مرصود",
                        s.exams?.formative_4 || "غير مرصود",
                        s.exams?.final_exam || "غير مرصود"
                    ]);
                });

                const ws = XLSX.utils.aoa_to_sheet(data);

                // تطبيق التنسيقات والألوان للأعمدة
                data.forEach((row, rIdx) => {
                    row.forEach((_, cIdx) => {
                        const cellRef = XLSX.utils.encode_cell({ r: rIdx, c: cIdx });
                        if (!ws[cellRef]) return;

                        if (rIdx === 0) {
                            ws[cellRef].s = STYLES.header;
                        } else {
                            ws[cellRef].s = { ...STYLES.normalCell };
                            
                            // تلوين خلايا الاختبارات (الأعمدة من 4 إلى 8)
                            if (cIdx >= 4 && cIdx <= 8) {
                                const val = String(row[cIdx]).trim();
                                if (val === 'متمكن' || val === 'مجتاز') {
                                    ws[cellRef].s = STYLES.greenCell;
                                } else if (val === 'ضعيف') {
                                    ws[cellRef].s = STYLES.yellowCell;
                                } else if (val === 'مخفق' || val === 'غير مجتاز') {
                                    ws[cellRef].s = STYLES.redCell;
                                }
                            }
                        }
                    });
                });

                ws['!cols'] = [{ wch: 5 }, { wch: 25 }, { wch: 14 }, { wch: 15 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 16 }];

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "نتائج الاختبارات");
                XLSX.writeFile(wb, `تقرير_الاختبارات_${examFilterGroup === 'ALL' ? 'الكل' : examFilterGroup}_${getTodayDateStr()}.xlsx`);
                showToast("تم تصدير درجات الاختبارات الملونة بنجاح");
            };

            const handleAddManualStudent = async (e) => {
                e.preventDefault();
                if (!newStudent.name.trim()) return;

                try {
                    await db.collection('students').add({
                        name: newStudent.name.trim(),
                        phone: formatSaudiPhone(newStudent.phone),
                        group: newStudent.group.trim() || 'عام',
                        absences: 0,
                        missedHomework: 0,
                        pledges: 0,
                        exams: {},
                        active: newStudent.active
                    });
                    setNewStudent({ name: '', phone: '', group: '', active: true, pledges: 0, missedHomework: 0 });
                    setShowAddModal(false);
                    showToast("تمت إضافة الطالب بنجاح");
                } catch (err) {
                    showToast("تعذر حفظ الطالب", "error");
                }
            };

            const handleSaveEdit = async (e) => {
                e.preventDefault();
                try {
                    await db.collection('students').doc(editingStudent.id).update({
                        name: editingStudent.name.trim(),
                        phone: formatSaudiPhone(editingStudent.phone),
                        group: editingStudent.group.trim(),
                        absences: parseInt(editingStudent.absences || 0),
                        missedHomework: parseInt(editingStudent.missedHomework || 0),
                        pledges: parseInt(editingStudent.pledges || 0),
                        active: editingStudent.active === true || editingStudent.active === 'true'
                    });
                    setEditingStudent(null);
                    showToast("تم تحديث بيانات الطالب");
                } catch (err) {
                    showToast("فشل التعديل", "error");
                }
            };

            const deleteSingleStudent = async (id) => {
                if (confirm("هل أنت متأكد من حذف هذا الطالب نهائياً من السحابة؟")) {
                    try {
                        await db.collection('students').doc(id).delete();
                        showToast("تم حذف الطالب");
                    } catch (err) {
                        showToast("تعذر الحذف", "error");
                    }
                }
            };

            const deleteSelectedStudents = async () => {
                if (!confirm(`حذف ${selectedSids.length} طالب محددين نهائياً؟`)) return;
                try {
                    const batch = db.batch();
                    selectedSids.forEach(id => batch.delete(db.collection('students').doc(id)));
                    await batch.commit();
                    setSelectedSids([]);
                    showToast("تم حذف الطلاب المحددين");
                } catch (err) {
                    showToast("تعذر الحذف", "error");
                }
            };

            const getStatusBadge = (count) => {
                const c = Number(count) || 0;
                if (c >= 6) return <span className="bg-red-100 text-red-700 px-2.5 py-0.5 rounded-md text-xs font-bold">خطر (حمراء)</span>;
                if (c >= 3) return <span className="bg-yellow-100 text-yellow-700 px-2.5 py-0.5 rounded-md text-xs font-bold">تحذير (صفراء)</span>;
                return <span className="bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-md text-xs font-bold">طبيعي</span>;
            };

            const getPledgeBadge = (count) => {
                const c = Number(count) || 0;
                if (c >= 3) return <span className="bg-purple-100 text-purple-700 px-2.5 py-0.5 rounded-md text-xs font-bold">{c} تعهدات</span>;
                if (c >= 1) return <span className="bg-amber-100 text-amber-700 px-2.5 py-0.5 rounded-md text-xs font-bold">{c} تعهد</span>;
                return <span className="bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md text-xs">لا يوجد</span>;
            };

            const filteredStudents = useMemo(() => {
                return students.filter(s => {
                    const matchGroup = filterGroup === 'ALL' || String(s.group).trim() === filterGroup;
                    const matchSearch = s.name.includes(search) || s.phone.includes(search);
                    
                    let matchAbsence = true;
                    const absCategory = getAbsenceCategory(s.absences);
                    if (filterAbsence === 'NORMAL') matchAbsence = absCategory === 'normal';
                    else if (filterAbsence === 'WARNING') matchAbsence = absCategory === 'warning';
                    else if (filterAbsence === 'DANGER') matchAbsence = absCategory === 'danger';

                    let matchHomework = true;
                    const hwAlert = getHomeworkAlert(s.missedHomework);
                    if (filterHomework !== 'ALL') {
                        matchHomework = hwAlert.level === filterHomework;
                    }

                    return matchGroup && matchSearch && matchAbsence && matchHomework;
                }).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            }, [students, filterGroup, filterAbsence, filterHomework, search]);

            const examFilteredStudents = useMemo(() => {
                return students.filter(s => {
                    return (examFilterGroup === 'ALL' || String(s.group).trim() === examFilterGroup) && s.active;
                }).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            }, [students, examFilterGroup]);

            if (!role) return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
                    <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-6 text-center">
                        <div className="w-16 h-16 bg-blue-600 text-white text-3xl font-bold rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">✓</div>
                        <h1 className="text-2xl font-extrabold text-slate-800">منصة إتقان السحابية</h1>
                        <p className="text-slate-400 text-sm">مزامنة سحابية: الغياب، الواجبات، الاختبارات، التعهدات</p>
                        <div className="space-y-4">
                            <input 
                                type="password" 
                                placeholder="أدخل رمز الدخول (PIN)" 
                                className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center text-2xl tracking-widest outline-none focus:border-blue-600 transition-all"
                                value={pin}
                                onChange={e => setPin(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && handleLogin()}
                            />
                            <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-bold text-lg shadow-lg transition-all">
                                تسجيل الدخول
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-24 max-w-6xl mx-auto">
                    <header className="sticky top-0 z-30 glass border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2">
                            <span className="bg-blue-600 text-white px-3 py-1.5 rounded-xl font-bold text-sm">إتقان السحابي</span>
                            <span className="font-bold text-slate-700">{role === 'supervisor' ? 'لوحة تحكم المشرف' : 'بوابة الرصد والتحضير'}</span>
                        </div>
                        <button onClick={logout} className="text-xs font-bold text-red-500 hover:bg-red-50 px-3 py-2 rounded-xl transition-all">تسجيل الخروج</button>
                    </header>

                    <main className="p-4 md:p-6">
                        {role === 'monitor' ? (
                            <div className="space-y-6">
                                {!activeMonitorGroup && !isMonitoringTeachers ? (
                                    <div className="space-y-4">
                                        <div 
                                            onClick={() => setIsMonitoringTeachers(true)}
                                            className="bg-gradient-to-r from-blue-700 to-indigo-700 text-white p-5 rounded-3xl shadow-lg hover:shadow-xl cursor-pointer flex justify-between items-center transition-all border border-blue-500"
                                        >
                                            <div className="space-y-1">
                                                <div className="flex items-center gap-2">
                                                    <span className="bg-white/20 px-3 py-1 rounded-xl text-xs font-bold">رصد خاص</span>
                                                    <h2 className="font-extrabold text-xl">📋 تحضير المعلمين لليوم</h2>
                                                </div>
                                                <p className="text-xs text-blue-100">رصد الحضور اليومي للمعلمين هجائياً واعتماده سحابياً ({teachers.length} معلم)</p>
                                                {teacherLogs.some(l => l.date === getTodayDateStr()) && (
                                                    <span className="inline-block text-[11px] bg-emerald-500 text-white font-bold px-2 py-0.5 rounded">
                                                        ✓ تم رصد حضور المعلمين اليوم (اضغط للتعديل)
                                                    </span>
                                                )}
                                            </div>
                                            <span className="text-3xl font-bold bg-white/10 w-12 h-12 rounded-2xl flex items-center justify-center">←</span>
                                        </div>

                                        <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 flex justify-between items-center">
                                            <div>
                                                <h2 className="font-bold text-blue-900 text-lg">قائمة الحلقات والصفوف (تحضير وواجبات الطلاب)</h2>
                                                <p className="text-xs text-blue-600 mt-1">اختر الحلقة لبدء التحضير (الأسماء مرتبة أبجدياً أ-ي لتسهيل الرصد)</p>
                                            </div>
                                            <span className="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">{groups.length} حلقات</span>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {groups.map(g => {
                                                const count = students.filter(s => String(s.group).trim() === g && s.active).length;
                                                const isAttDone = logs.some(l => l.id === `${g.replace(/\s+/g, '_')}_${getTodayDateStr()}`);
                                                const isHwDone = homeworkLogs.some(l => l.id === `hw_${g.replace(/\s+/g, '_')}_${getTodayDateStr()}`);

                                                return (
                                                    <div 
                                                        key={g} 
                                                        onClick={() => handleStartGroup(g)}
                                                        className="bg-white p-5 rounded-3xl border border-slate-100 hover:border-blue-400 hover:shadow-md cursor-pointer flex justify-between items-center transition-all"
                                                    >
                                                        <div>
                                                            <h3 className="font-bold text-slate-800 text-lg">{g}</h3>
                                                            <p className="text-xs text-slate-400 mt-1">{count} طالب نشط</p>
                                                            <div className="flex gap-2 mt-2">
                                                                {isAttDone && <span className="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded">التحضير مسجل ✓</span>}
                                                                {isHwDone && <span className="text-[10px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded">الواجبات مسجلة ✓</span>}
                                                            </div>
                                                        </div>
                                                        <span className="text-blue-600 font-bold text-xl">←</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ) : isMonitoringTeachers ? (
                                    <div className="space-y-4 max-w-3xl mx-auto">
                                        <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                            <button onClick={() => setIsMonitoringTeachers(false)} className="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-2 rounded-xl">
                                                → رجوع لقائمة الرصد
                                            </button>
                                            <h2 className="font-bold text-lg text-slate-800">تحضير المعلمين أبجدياً ({getTodayDateStr()})</h2>
                                            <div className="flex gap-2 text-xs font-bold">

                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة عدم تسليم الواجب (تنبيهات الواجبات)</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-28 text-sm outline-none" value={settings.homework_template} onChange={e => setSettings({...settings, homework_template: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة نتيجة الاختبار البنائي</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-24 text-sm outline-none" value={settings.formative_exam_template} onChange={e => setSettings({...settings, formative_exam_template: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة نتيجة الاختبار النهائي</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-24 text-sm outline-none" value={settings.final_exam_template} onChange={e => setSettings({...settings, final_exam_template: e.target.value})} />
                                        </div>
                                        <button onClick={() => { db.collection('settings').doc('app_config').set(settings); showToast("تم حفظ الإعدادات سحابياً"); }} className="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-md">
                                            حفظ الإعدادات
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {showPledgeModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddPledge} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <h3 className="text-lg font-bold border-b pb-2 text-slate-800">تسجيل تعهد تأديبي</h3>
                                <div>
                                    <p className="text-sm text-slate-600 font-bold">الطالب: <span className="text-purple-700">{showPledgeModal.name}</span></p>
                                    <p className="text-xs text-slate-400">الحلقة: {showPledgeModal.group} | التعهدات السابقة: {showPledgeModal.pledges || 0}</p>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">سبب التعهد:</label>
                                    <textarea 
                                        required 
                                        placeholder="مثال: التأخر المتكرر، إثارة الفوضى، إحضار الهاتف..." 
                                        className="w-full p-3 bg-slate-50 border rounded-xl text-sm h-24 outline-none"
                                        value={pledgeReason}
                                        onChange={e => setPledgeReason(e.target.value)}
                                    />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-xl transition-all">تأكيد التعهد سحابياً</button>
                                    <button type="button" onClick={() => setShowPledgeModal(null)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showAddTeacherModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddTeacher} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <h3 className="text-lg font-bold border-b pb-2">إضافة معلم جديد</h3>
                                <input required placeholder="اسم المعلم" className="w-full p-3 bg-slate-50 border rounded-xl" value={newTeacher.name} onChange={e => setNewTeacher({...newTeacher, name: e.target.value})} />
                                <input placeholder="رقم الجوال (اختياري)" className="w-full p-3 bg-slate-50 border rounded-xl" dir="ltr" value={newTeacher.phone} onChange={e => setNewTeacher({...newTeacher, phone: e.target.value})} />
                                <input placeholder="التخصص / اسم الحلقة المسؤول عنها" className="w-full p-3 bg-slate-50 border rounded-xl" value={newTeacher.subject} onChange={e => setNewTeacher({...newTeacher, subject: e.target.value})} />
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">حفظ المعلم</button>
                                    <button type="button" onClick={() => setShowAddTeacherModal(false)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddManualStudent} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <h3 className="text-lg font-bold border-b pb-2">إضافة طالب سحابياً</h3>
                                <input required placeholder="اسم الطالب الكامل" className="w-full p-3 bg-slate-50 border rounded-xl" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                <input required placeholder="رقم الجوال (05xxxx)" className="w-full p-3 bg-slate-50 border rounded-xl" dir="ltr" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} />
                                <input required placeholder="اسم الحلقة أو الفصل" className="w-full p-3 bg-slate-50 border rounded-xl" value={newStudent.group} onChange={e => setNewStudent({...newStudent, group: e.target.value})} />
                                <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold" value={newStudent.active ? "true" : "false"} onChange={e => setNewStudent({...newStudent, active: e.target.value === 'true'})}>
                                    <option value="true">مستمر (نشط)</option>
                                    <option value="false">منقطع</option>
                                </select>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">حفظ في السحابة</button>
                                    <button type="button" onClick={() => setShowAddModal(false)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {editingStudent && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleSaveEdit} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <h3 className="text-lg font-bold border-b pb-2">تعديل بيانات الطالب الشاملة</h3>
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} />
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl" dir="ltr" value={editingStudent.phone} onChange={e => setEditingStudent({...editingStudent, phone: e.target.value})} />
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl" value={editingStudent.group} onChange={e => setEditingStudent({...editingStudent, group: e.target.value})} />
                                <div className="grid grid-cols-4 gap-2">
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold block mb-1">الغيابات</label>
                                        <input type="number" min="0" className="w-full p-2 bg-slate-50 border rounded-xl text-center" value={editingStudent.absences} onChange={e => setEditingStudent({...editingStudent, absences: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold block mb-1">الواجبات المقصرة</label>
                                        <input type="number" min="0" max="15" className="w-full p-2 bg-slate-50 border rounded-xl text-center" value={editingStudent.missedHomework || 0} onChange={e => setEditingStudent({...editingStudent, missedHomework: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold block mb-1">التعهدات</label>
                                        <input type="number" min="0" className="w-full p-2 bg-slate-50 border rounded-xl text-center" value={editingStudent.pledges || 0} onChange={e => setEditingStudent({...editingStudent, pledges: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold block mb-1">الحالة</label>
                                        <select className="w-full p-2 bg-slate-50 border rounded-xl font-bold text-xs" value={editingStudent.active ? "true" : "false"} onChange={e => setEditingStudent({...editingStudent, active: e.target.value === 'true'})}>
                                            <option value="true">مستمر</option>
                                            <option value="false">منقطع</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">تحديث السحابة</button>
                                    <button type="button" onClick={() => setEditingStudent(null)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {importPreview && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 max-h-[85vh] flex flex-col">
                                <h3 className="text-lg font-bold border-b pb-2">معاينة استيراد الطلاب ({importPreview.length})</h3>
                                <div className="overflow-y-auto flex-1 divide-y divide-slate-100">
                                    {importPreview.map((p, i) => (
                                        <div key={i} className="py-2 flex justify-between items-center text-xs">
                                            <div>
                                                <div className="font-bold text-slate-800">{p.name}</div>
                                                <div className="text-slate-400" dir="ltr">{p.phone}</div>
                                            </div>
                                            <span className="bg-slate-100 px-2 py-1 rounded font-bold">{p.group}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2 pt-2 border-t">
                                    <button onClick={commitExcelImport} className="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl">تأكيد الاستيراد السحابي</button>
                                    <button onClick={() => setImportPreview(null)} className="px-5 bg-slate-100 rounded-xl">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
