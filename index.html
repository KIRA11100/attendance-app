<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إتقان - الإصدار الاحترافي</title>
    
    <!-- Scripts & Styles -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .btn-press:active { transform: scale(0.97); }
        .modal-enter { animation: modalScale 0.2s ease-out; }
        @keyframes modalScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        /* --- CONFIGURATION & FIREBASE MOCK ADAPTER --- */
        // To use real Firebase, replace this mock with: import { db } from './firebase-config';
        const StorageAdapter = {
            async save(key, data) {
                localStorage.setItem(`itqan_pro_${key}`, JSON.stringify(data));
                return true;
            },
            async load(key) {
                const data = localStorage.getItem(`itqan_pro_${key}`);
                return data ? JSON.parse(data) : null;
            }
        };

        /* --- UTILITIES --- */
        const UIUtils = {
            formatPhone: (val) => {
                let num = String(val).replace(/\D/g, '');
                if (num.startsWith('05')) num = '966' + num.substring(1);
                if (num.length === 9) num = '966' + num;
                return num.length === 12 ? num : null;
            },
            getTodayStr: () => new Date().toISOString().split('T')[0],
            generateSessionId: (groupId, date) => `${groupId.replace(/\s+/g, '_')}_${date}`
        };

        /* --- COMPONENTS --- */

        const Modal = ({ isOpen, onClose, title, children, footer }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="bg-white w-full max-w-2xl rounded-3xl shadow-2xl z-10 overflow-hidden flex flex-col max-h-[90vh] modal-enter">
                        <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                            <h3 className="text-xl font-extrabold text-slate-800 tracking-tight">{title}</h3>
                            <button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-500">✕</button>
                        </div>
                        <div className="p-6 overflow-y-auto custom-scrollbar flex-1">{children}</div>
                        {footer && <div className="p-4 bg-slate-50 border-t flex gap-3 justify-end">{footer}</div>}
                    </div>
                </div>
            );
        };

        const Toast = ({ msg, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, [onClose]);
            const styles = type === 'error' ? 'bg-red-600' : 'bg-emerald-600';
            return (
                <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-2xl shadow-2xl text-white font-bold flex items-center gap-3 animate-bounce ${styles}`}>
                    <span>{type === 'error' ? '⚠️' : '✅'}</span>
                    {msg}
                </div>
            );
        };

        /* --- MAIN APPLICATION --- */

        const ItqanApp = () => {
            const [role, setRole] = useState(null); // 'supervisor' | 'monitor'
            const [view, setView] = useState('dashboard');
            const [students, setStudents] = useState([]);
            const [sessions, setSessions] = useState([]);
            const [settings, setSettings] = useState({
                absenceMsg: "ولي أمر الطالب {name}، نفيدكم بغياب ابننا اليوم {date}. إجمالي الغيابات: {count}",
                excuseMsg: "تم قبول عذر الطالب {name} لتاريخ {date}. شكراً لتواصلكم.",
                pinSupervisor: '1234',
                pinMonitor: '0000'
            });

            const [toast, setToast] = useState(null);
            const [activeSession, setActiveSession] = useState(null); // Current group being recorded
            const [importPreview, setImportPreview] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterCircle, setFilterCircle] = useState('ALL');

            // Load Data
            useEffect(() => {
                const loadData = async () => {
                    const s = await StorageAdapter.load('students') || [];
                    const sess = await StorageAdapter.load('sessions') || [];
                    const set = await StorageAdapter.load('settings') || settings;
                    setStudents(s);
                    setSessions(sess);
                    setSettings(set);
                };
                loadData();
            }, []);

            // Auto-Save whenever state changes
            useEffect(() => { StorageAdapter.save('students', students); }, [students]);
            useEffect(() => { StorageAdapter.save('sessions', sessions); }, [sessions]);
            useEffect(() => { StorageAdapter.save('settings', settings); }, [settings]);

            const notify = (msg, type = 'success') => setToast({ msg, type });

            /* --- SESSION LOGIC --- */
            const startAttendance = (groupName) => {
                const today = UIUtils.getTodayStr();
                const existing = sessions.find(s => s.id === UIUtils.generateSessionId(groupName, today));
                
                setActiveSession({
                    groupId: groupName,
                    date: today,
                    isUpdate: !!existing,
                    records: students
                        .filter(s => s.group === groupName && s.active)
                        .map(s => {
                            const past = existing?.records.find(r => r.studentId === s.id);
                            return {
                                studentId: s.id,
                                name: s.name,
                                phone: s.phone,
                                status: past ? past.status : 'present',
                                contactStatus: past ? past.contactStatus : 'pending'
                            };
                        })
                });
                setView('recorder');
            };

            const submitAttendance = () => {
                const sessionId = UIUtils.generateSessionId(activeSession.groupId, activeSession.date);
                
                // Update Student Aggregate Absences (Subtract old if update, then add new)
                let updatedStudents = [...students];
                
                // If it was an update, we need to revert previous session's impact first
                const existingSession = sessions.find(s => s.id === sessionId);
                if (existingSession) {
                    existingSession.records.forEach(rec => {
                        if (rec.status === 'absent') {
                            updatedStudents = updatedStudents.map(s => s.id === rec.studentId ? {...s, absences: Math.max(0, s.absences - 1)} : s);
                        }
                    });
                }

                // Apply new impacts
                activeSession.records.forEach(rec => {
                    if (rec.status === 'absent') {
                        updatedStudents = updatedStudents.map(s => s.id === rec.studentId ? {...s, absences: s.absences + 1} : s);
                    }
                });

                const finalSession = {
                    ...activeSession,
                    id: sessionId,
                    timestamp: new Date().toISOString()
                };

                setStudents(updatedStudents);
                setSessions(prev => [finalSession, ...prev.filter(s => s.id !== sessionId)]);
                setView('dashboard');
                setActiveSession(null);
                notify("تم حفظ سجل التحضير بنجاح");
            };

            /* --- EXCEL PIPELINE --- */
            const handleExcelImport = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    
                    const parsed = data.map((row, idx) => ({
                        id: Date.now() + idx,
                        name: (row['الاسم'] || row['Name'] || '').trim(),
                        phone: UIUtils.formatPhone(row['الجوال'] || row['Phone']),
                        group: (row['الحلقة'] || row['Group'] || 'عام').trim(),
                        absences: parseInt(row['الغيابات'] || 0),
                        active: true
                    })).filter(p => p.name && p.phone);

                    if (parsed.length === 0) return notify("لم يتم العثور على بيانات صالحة", "error");
                    setImportPreview(parsed);
                };
                reader.readAsBinaryString(file);
            };

            /* --- VIEW COMPONENTS --- */
            
            const LoginView = () => {
                const [pin, setPin] = useState('');
                const attempt = () => {
                    if (pin === settings.pinSupervisor) setRole('supervisor');
                    else if (pin === settings.pinMonitor) setRole('monitor');
                    else notify("رمز الدخول خاطئ", "error");
                };
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
                        <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md text-center space-y-8">
                            <div className="inline-flex p-5 bg-blue-600 rounded-3xl text-white shadow-xl shadow-blue-200">
                                <svg className="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A10.003 10.003 0 0012 3m0 0c.887 0 1.741.099 2.56.287M12 3v18m0-18l3.66 3.66M12 21l-3.66-3.66" /></svg>
                            </div>
                            <h1 className="text-3xl font-black text-slate-800">منصة إتقان</h1>
                            <input 
                                type="password" placeholder="أدخل رمز الدخول (PIN)" 
                                className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl text-center text-3xl tracking-[1em] outline-none focus:border-blue-500 transition-all"
                                value={pin} onChange={e => setPin(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && attempt()}
                            />
                            <button onClick={attempt} className="w-full bg-slate-900 text-white p-5 rounded-2xl font-bold text-lg btn-press shadow-xl">تسجيل الدخول</button>
                        </div>
                    </div>
                );
            };

            const Dashboard = () => {
                const circles = [...new Set(students.map(s => s.group))];
                return (
                    <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <h4 className="text-slate-400 font-bold text-sm uppercase">إجمالي الطلاب</h4>
                                <p className="text-4xl font-black text-slate-800 mt-2">{students.length}</p>
                            </div>
                            <div className="bg-blue-600 p-6 rounded-3xl shadow-lg shadow-blue-100 text-white">
                                <h4 className="text-blue-100 font-bold text-sm uppercase">نسبة الحضور الأسبوعية</h4>
                                <p className="text-4xl font-black mt-2">84%</p>
                            </div>
                            <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                <h4 className="text-slate-400 font-bold text-sm uppercase">حالات تستوجب التواصل</h4>
                                <p className="text-4xl font-black text-red-500 mt-2">{students.filter(s => s.absences >= 3).length}</p>
                            </div>
                        </div>

                        <div className="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100">
                            <h3 className="text-xl font-black mb-6">الحلقات والصفوف</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {circles.map(c => {
                                    const count = students.filter(s => s.group === c && s.active).length;
                                    const isDone = sessions.some(s => s.id === UIUtils.generateSessionId(c, UIUtils.getTodayStr()));
                                    return (
                                        <div key={c} className="group p-5 bg-slate-50 border border-slate-200 rounded-2xl hover:border-blue-400 transition-all cursor-pointer" onClick={() => startAttendance(c)}>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h5 className="font-bold text-lg text-slate-800">{c}</h5>
                                                    <span className="text-sm text-slate-500 font-medium">{count} طالب نشط</span>
                                                </div>
                                                {isDone ? 
                                                    <span className="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-1 rounded-lg font-bold">تم الرصد اليوم</span> :
                                                    <span className="bg-blue-100 text-blue-700 text-[10px] px-2 py-1 rounded-lg font-bold">انتظار الرصد</span>
                                                }
                                            </div>
                                            <div className="mt-4 flex items-center text-blue-600 font-bold text-xs group-hover:gap-2 transition-all">
                                                {isDone ? 'تعديل كشف اليوم' : 'بدء التحضير'} 
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const StudentManager = () => {
                const filtered = students.filter(s => {
                    const matchSearch = s.name.includes(searchQuery) || s.phone.includes(searchQuery);
                    const matchCircle = filterCircle === 'ALL' || s.group === filterCircle;
                    return matchSearch && matchCircle;
                });

                return (
                    <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
                        <div className="p-6 border-b flex flex-wrap gap-4 items-center justify-between">
                            <div className="flex gap-2 w-full md:w-auto">
                                <input 
                                    className="bg-slate-50 border-none rounded-xl px-4 py-2 text-sm w-full md:w-64 focus:ring-2 focus:ring-blue-500"
                                    placeholder="بحث بالاسم أو الجوال..."
                                    value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                                />
                                <select 
                                    className="bg-slate-50 border-none rounded-xl px-4 py-2 text-sm"
                                    value={filterCircle} onChange={e => setFilterCircle(e.target.value)}
                                >
                                    <option value="ALL">كل الحلقات</option>
                                    {[...new Set(students.map(s => s.group))].map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div className="flex gap-2">
                                <label className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold cursor-pointer btn-press">
                                    استيراد Excel
                                    <input type="file" className="hidden" accept=".xlsx" onChange={handleExcelImport} />
                                </label>
                            </div>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right">
                                <thead className="bg-slate-50/50 text-slate-500 text-xs font-bold uppercase tracking-wider">
                                    <tr>
                                        <th className="p-5">الطالب</th>
                                        <th className="p-5">الحلقة</th>
                                        <th className="p-5">الغيابات</th>
                                        <th className="p-5">الحالة</th>
                                        <th className="p-5">الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {filtered.map(s => (
                                        <tr key={s.id} className="hover:bg-slate-50/30 transition-colors">
                                            <td className="p-5">
                                                <div className="font-bold text-slate-800">{s.name}</div>
                                                <div className="text-xs text-slate-400 font-mono tracking-tighter" dir="ltr">{s.phone}</div>
                                            </td>
                                            <td className="p-5 text-sm text-slate-600 font-medium">{s.group}</td>
                                            <td className="p-5">
                                                <span className={`px-3 py-1 rounded-full text-xs font-bold ${s.absences >= 6 ? 'bg-red-100 text-red-600' : s.absences >= 3 ? 'bg-amber-100 text-amber-600' : 'bg-slate-100 text-slate-600'}`}>
                                                    {s.absences} غيابات
                                                </span>
                                            </td>
                                            <td className="p-5">
                                                <div className={`w-2 h-2 rounded-full ${s.active ? 'bg-emerald-500' : 'bg-slate-300'}`}></div>
                                            </td>
                                            <td className="p-5">
                                                <button className="text-blue-600 hover:text-blue-800 font-bold text-xs" onClick={() => {
                                                    if(confirm('حذف الطالب؟')) setStudents(prev => prev.filter(st => st.id !== s.id));
                                                }}>حذف</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            const RecorderView = () => {
                return (
                    <div className="max-w-3xl mx-auto space-y-6">
                        <div className="bg-white p-6 rounded-[2rem] shadow-sm flex items-center justify-between">
                            <div>
                                <h2 className="text-2xl font-black text-slate-800">{activeSession.groupId}</h2>
                                <p className="text-sm text-slate-400 font-medium">تحضير يوم: {activeSession.date}</p>
                            </div>
                            {activeSession.isUpdate && <span className="bg-amber-100 text-amber-700 px-4 py-1 rounded-full text-xs font-black">تعديل سجل موجود</span>}
                        </div>

                        <div className="space-y-3">
                            {activeSession.records.map((rec, idx) => (
                                <div key={rec.studentId} className={`p-5 rounded-3xl border-2 transition-all flex items-center justify-between ${rec.status === 'absent' ? 'bg-red-50 border-red-100' : rec.status === 'excused' ? 'bg-amber-50 border-amber-100' : 'bg-white border-slate-100'}`}>
                                    <div className="flex-1">
                                        <h4 className="font-bold text-slate-800">{rec.name}</h4>
                                        <p className="text-xs text-slate-400">الغيابات المسجلة: {students.find(s => s.id === rec.studentId)?.absences || 0}</p>
                                    </div>
                                    <div className="flex bg-slate-100 p-1 rounded-2xl gap-1">
                                        {[
                                            {id: 'present', label: 'حاضر', color: 'bg-emerald-600'},
                                            {id: 'excused', label: 'بعذر', color: 'bg-amber-500'},
                                            {id: 'absent', label: 'غائب', color: 'bg-red-600'}
                                        ].map(opt => (
                                            <button 
                                                key={opt.id}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${rec.status === opt.id ? `${opt.color} text-white shadow-md` : 'text-slate-500 hover:text-slate-700'}`}
                                                onClick={() => {
                                                    const next = [...activeSession.records];
                                                    next[idx].status = opt.id;
                                                    setActiveSession({...activeSession, records: next});
                                                }}
                                            >
                                                {opt.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button 
                            onClick={submitAttendance}
                            className="w-full bg-blue-600 text-white p-6 rounded-[2rem] font-black text-lg shadow-xl shadow-blue-100 btn-press"
                        >
                            اعتماد كشف التحضير
                        </button>
                    </div>
                );
            };

            const InboxView = () => {
                const logs = sessions.filter(s => s.records.some(r => r.status !== 'present'));
                
                const updateContactStatus = (sessId, stuId, status) => {
                    setSessions(prev => prev.map(s => {
                        if (s.id !== sessId) return s;
                        return {
                            ...s,
                            records: s.records.map(r => r.studentId === stuId ? {...r, contactStatus: status} : r)
                        };
                    }));
                };

                return (
                    <div className="space-y-6">
                        {logs.map(sess => (
                            <div key={sess.id} className="bg-white rounded-[2rem] border border-slate-100 overflow-hidden shadow-sm">
                                <div className="p-6 bg-slate-50 border-b flex justify-between items-center">
                                    <div className="flex items-center gap-4">
                                        <span className="font-black text-slate-800">{sess.groupId}</span>
                                        <span className="text-xs text-slate-400">{sess.date}</span>
                                    </div>
                                    <span className="text-[10px] font-bold bg-slate-200 px-2 py-1 rounded">تاريخ الأرشفة: {new Date(sess.timestamp).toLocaleTimeString('ar-SA')}</span>
                                </div>
                                <div className="divide-y divide-slate-50">
                                    {sess.records.filter(r => r.status !== 'present').map(r => {
                                        const msg = (r.status === 'absent' ? settings.absenceMsg : settings.excuseMsg)
                                            .replace('{name}', r.name)
                                            .replace('{date}', sess.date)
                                            .replace('{count}', students.find(s => s.id === r.studentId)?.absences || 0);

                                        return (
                                            <div key={r.studentId} className="p-6 flex flex-wrap items-center justify-between gap-4">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-bold text-slate-800">{r.name}</span>
                                                        <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${r.status === 'absent' ? 'bg-red-100 text-red-600' : 'bg-amber-100 text-amber-600'}`}>
                                                            {r.status === 'absent' ? 'غائب' : 'مستأذن'}
                                                        </span>
                                                    </div>
                                                    <div className="text-xs text-slate-500 mt-1">{r.phone}</div>
                                                </div>
                                                
                                                <div className="flex items-center gap-3">
                                                    <select 
                                                        className={`text-[10px] font-bold border-none rounded-lg px-3 py-2 ${r.contactStatus === 'done' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}
                                                        value={r.contactStatus}
                                                        onChange={(e) => updateContactStatus(sess.id, r.studentId, e.target.value)}
                                                    >
                                                        <option value="pending">لم يتم التواصل</option>
                                                        <option value="opened">تم فتح واتساب</option>
                                                        <option value="done">تم التواصل</option>
                                                        <option value="error">تعذر الوصول</option>
                                                    </select>

                                                    <a 
                                                        href={`https://wa.me/${r.phone}?text=${encodeURIComponent(msg)}`} 
                                                        target="_blank"
                                                        onClick={() => updateContactStatus(sess.id, r.studentId, 'opened')}
                                                        className="bg-emerald-500 text-white p-2 px-4 rounded-xl text-xs font-bold btn-press flex items-center gap-2"
                                                    >
                                                        واتساب
                                                    </a>
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>
                );
            };

            /* --- LAYOUT WRAPPER --- */

            if (!role) return <LoginView />;

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <header className="sticky top-0 z-50 glass border-b border-slate-200 px-6 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white font-black">إ</div>
                            <div>
                                <h1 className="font-black text-slate-800 text-lg leading-none">إتقان</h1>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{role === 'supervisor' ? 'لوحة المشرف' : 'بوابة المسجل'}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={() => setRole(null)} className="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                                <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                            </button>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-6">
                        {/* Navigation */}
                        {role === 'supervisor' && view !== 'recorder' && (
                            <nav className="flex gap-2 mb-8 bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm w-fit">
                                {[
                                    {id: 'dashboard', label: 'الرئيسية'},
                                    {id: 'students', label: 'الطلاب'},
                                    {id: 'inbox', label: 'الوارد'}
                                ].map(t => (
                                    <button 
                                        key={t.id} onClick={() => setView(t.id)}
                                        className={`px-6 py-2.5 rounded-xl font-bold text-sm transition-all ${view === t.id ? 'bg-slate-900 text-white shadow-lg' : 'text-slate-500 hover:bg-slate-50'}`}
                                    >
                                        {t.label}
                                    </button>
                                ))}
                            </nav>
                        )}

                        {view === 'dashboard' && <Dashboard />}
                        {view === 'students' && <StudentManager />}
                        {view === 'recorder' && <RecorderView />}
                        {view === 'inbox' && <InboxView />}
                    </main>

                    {/* Footer Nav for Mobile */}
                    <div className="fixed bottom-0 left-0 right-0 glass border-t border-slate-200 p-3 md:hidden flex justify-around items-center">
                        <button onClick={() => setView('dashboard')} className={`p-2 rounded-xl transition-all ${view === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-slate-400'}`}>
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                        </button>
                        <button onClick={() => setView('students')} className={`p-2 rounded-xl transition-all ${view === 'students' ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-slate-400'}`}>
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                        </button>
                        <button onClick={() => setView('inbox')} className={`p-2 rounded-xl transition-all ${view === 'inbox' ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-slate-400'}`}>
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
                        </button>
                    </div>

                    {/* Modals */}
                    <Modal 
                        isOpen={!!importPreview} 
                        title="مراجعة استيراد البيانات" 
                        onClose={() => setImportPreview(null)}
                        footer={(
                            <button className="bg-blue-600 text-white px-8 py-2 rounded-xl font-bold" onClick={() => {
                                setStudents(prev => [...prev, ...importPreview]);
                                setImportPreview(null);
                                notify(`تم استيراد ${importPreview.length} طالب`);
                            }}>تأكيد الحفظ</button>
                        )}
                    >
                        <div className="space-y-4">
                            <p className="text-sm text-slate-500 bg-blue-50 p-3 rounded-lg border border-blue-100 italic">يرجى التأكد من صحة البيانات أدناه قبل الاعتماد في قاعدة البيانات.</p>
                            <div className="divide-y divide-slate-100">
                                {importPreview?.map((p, i) => (
                                    <div key={i} className="py-3 flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-slate-800">{p.name}</div>
                                            <div className="text-xs text-slate-400">{p.phone}</div>
                                        </div>
                                        <div className="bg-slate-100 px-3 py-1 rounded text-xs font-bold text-slate-600">{p.group}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </Modal>

                    {toast && <Toast msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ItqanApp />);
    </script>
</body>
</html>
