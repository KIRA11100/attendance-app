    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        const STYLES = {
            header: { fill: { fgColor: { rgb: "064E3B" } }, font: { bold: true, color: { rgb: "FFFFFF" }, sz: 12 }, alignment: { horizontal: "center", vertical: "center" }, border: { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } } },

        const EXAM_TYPES = [
            { id: 'formative_1', title: 'الاختبار البنائي الأول' },
            { id: 'formative_2', title: 'الاختبار البنائي الثاني' },

            { id: 'final_exam', title: 'الاختبار النهائي' }
        ];

        const formatSaudiPhone = (n) => {
            if (!n) return '966500000000';
            let num = String(n).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g, '');
            if (num.startsWith('05')) num = '966' + num.substring(1);
            else if (num.startsWith('5') && num.length === 9) num = '966' + num;
            return num.length >= 12 ? num : '966500000000';
        };

        const getTodayDateStr = () => new Date().toLocaleDateString('en-CA');

        const getHomeworkAlert = (c) => {
            const count = Number(c) || 0;
            if (count >= 15) return { level: 'exceeded', text: 'تجاوز الحد (15+)', color: 'bg-rose-900 text-white' };
            if (count >= 14) return { level: 'final', text: 'إنذار نهائي (14)', color: 'bg-rose-600 text-white' };
            if (count >= 10) return { level: 'second', text: 'إنذار ثاني (10)', color: 'bg-amber-600 text-white' };
            if (count >= 5) return { level: 'first', text: 'إنذار أول (5)', color: 'bg-amber-100 text-amber-800' };
            return { level: 'none', text: 'منتظم', color: 'bg-emerald-50 text-emerald-800 border border-emerald-200' };
        };

        const getAbsenceCategory = (c) => {
            const abs = Number(c) || 0;
            if (abs >= 6) return 'danger';
            if (abs >= 3) return 'warning';
            return 'normal';
        };

        const App = () => {
            const [role, setRole] = useState(() => localStorage.getItem('itqan_role') || null);
            const [teacherData, setTeacherData] = useState(() => JSON.parse(localStorage.getItem('itqan_teacher') || 'null'));
            const [view, setView] = useState('students');
            const [inboxSub, setInboxSub] = useState('attendance');
            const [pin, setPin] = useState('');
            const [showPin, setShowPin] = useState(false);
            const [students, setStudents] = useState([]);
            const [teachers, setTeachers] = useState([]);
            const [logs, setLogs] = useState([]);
            const [homeworkLogs, setHomeworkLogs] = useState([]);
            const [pledgeLogs, setPledgeLogs] = useState([]);
            const [teacherLogs, setTeacherLogs] = useState([]);
            const [settings, setSettings] = useState({
                absence_template: "عزيزي ولي أمر الطالب {student_name}، نفيدكم بغيابه اليوم {date}. إجمالي غياباته: {absence_count}",
                excused_template: "عزيزي ولي أمر الطالب {student_name}، تم تسجيل استئذان الطالب اليوم {date} بعذر مقبول.",
                homework_template: "عزيزي ولي أمر الطالب {student_name}، لم يتم تسليم الواجب اليوم {date}. التكرار: {missed_count} ({alert_status}).",
                listener_template: "المكرم ولي أمر الطالب {student_name}، نظراً لتجاوز الغياب/التقصير في الحلقات، تقرر تحويل صفة قيده إلى (مستمع).",
                formative_exam_template: "نتيجة الطالب {student_name} في ({exam_name}): التقدير هو [{grade}]. {notes}",
                final_exam_template: "نتيجة الطالب {student_name} في (الاختبار النهائي): التقدير [{grade}]. {notes}"
            });
            const [toast, setToast] = useState(null);
            const [activeGrp, setActiveGrp] = useState(null);
            const [monitorMode, setMonitorMode] = useState('attendance');
            const [attBatch, setAttBatch] = useState({});
            const [hwBatch, setHwBatch] = useState({});
            const [isMonTeachers, setIsMonTeachers] = useState(false);
            const [showAddStd, setShowAddStd] = useState(false);
            const [editStd, setEditStd] = useState(null);
            const [newStd, setNewStd] = useState({ name: '', phone: '', group: '', active: true });
            
            const [fGrp, setFGrp] = useState('ALL');
            const [fStatus, setFStatus] = useState('ALL');
            const [fAbsCategory, setFAbsCategory] = useState('ALL');
            const [search, setSearch] = useState('');

            const [excelPreview, setExcelPreview] = useState(null);
            const fileInputRef = useRef(null);

            const [showPledge, setShowPledge] = useState(null);
            const [pReason, setPReason] = useState('');
            const [showAddTchr, setShowAddTchr] = useState(false);
            const [newTchr, setNewTchr] = useState({ name: '', phone: '', subject: '', pin: '' });
            const [tchrAttBatch, setTchrAttBatch] = useState({});
            const [selExType, setSelExType] = useState('formative_1');
            const [exFGrp, setExFGrp] = useState('ALL');

            const toastMsg = (m, t = 'success') => { setToast({ m, t }); setTimeout(() => setToast(null), 3000); };

            useEffect(() => {
                const unsubS = db.collection('students').onSnapshot(s => setStudents(s.docs.map(d => ({id:d.id, absences:0, missedHomework:0, pledges:0, exams:{}, examNotes:{}, ...d.data()}))));
                const unsubT = db.collection('teachers').onSnapshot(s => setTeachers(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubL = db.collection('attendance_logs').orderBy('date','desc').onSnapshot(s => setLogs(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubH = db.collection('homework_logs').orderBy('date','desc').onSnapshot(s => setHomeworkLogs(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubP = db.collection('pledges_logs').orderBy('timestamp','desc').onSnapshot(s => setPledgeLogs(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubTL = db.collection('teacher_attendance_logs').orderBy('date','desc').onSnapshot(s => setTeacherLogs(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubCfg = db.collection('settings').doc('app_config').onSnapshot(d => d.exists && setSettings(prev => ({...prev, ...d.data()})));
                return () => { unsubS(); unsubT(); unsubL(); unsubH(); unsubP(); unsubTL(); unsubCfg(); };
            }, []);

            useEffect(() => {
                if (role === 'teacher' && teacherData) {
                    const grp = String(teacherData.subject).trim();
                    const today = getTodayDateStr();
                    const al = logs.find(l => l.id === `${grp.replace(/\s+/g,'_')}_${today}`);
                    const hl = homeworkLogs.find(l => l.id === `hw_${grp.replace(/\s+/g,'_')}_${today}`);
                    const ab = {}; const hb = {};
                    students.filter(s => s.group === grp && s.active).forEach(s => {
                        ab[s.id] = al?.records?.find(r => r.studentId === s.id)?.status || 'present';
                        hb[s.id] = hl?.records?.find(r => r.studentId === s.id)?.status || 'submitted';
                    });
                    setAttBatch(ab); setHwBatch(hb);
                }
            }, [role, teacherData, students, logs, homeworkLogs]);

            const login = () => {
                const p = pin.trim();
                if (p === '1234') { setRole('supervisor'); localStorage.setItem('itqan_role', 'supervisor'); }
                else if (p === '0000') { setRole('monitor'); localStorage.setItem('itqan_role', 'monitor'); }
                else {
                    const t = teachers.find(x => x.pin === p);
                    if (t) { setRole('teacher'); setTeacherData(t); localStorage.setItem('itqan_role', 'teacher'); localStorage.setItem('itqan_teacher', JSON.stringify(t)); }
                    else toastMsg('الرمز غير صحيح، يرجى التحقق', 'error');
                }
                setPin('');
            };

            const logout = () => { localStorage.clear(); setRole(null); setTeacherData(null); };

            const grps = useMemo(() => [...new Set(students.map(s => String(s.group).trim()))].sort(), [students]);

            const filteredStudents = useMemo(() => {
                return students.filter(s => {
                    const matchGroup = fGrp === 'ALL' || s.group === fGrp;
                    const matchSearch = (s.name || '').includes(search) || (s.phone || '').includes(search);
                    const matchStatus = fStatus === 'ALL' || (fStatus === 'ACTIVE' ? s.active : !s.active);
                    const currentAbsCat = getAbsenceCategory(s.absences);
                    const matchAbsence = fAbsCategory === 'ALL' || fAbsCategory === currentAbsCat;
                    return matchGroup && matchSearch && matchStatus && matchAbsence;
                }).sort((a,b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            }, [students, fGrp, search, fStatus, fAbsCategory]);

            const submitAttendance = async (g) => {
                const group = g || activeGrp;
                const date = getTodayDateStr();
                const logId = `${group.replace(/\s+/g,'_')}_${date}`;
                const st = students.filter(s => s.group === group && s.active);
                const records = st.map(s => ({ studentId: s.id, name: s.name, phone: s.phone, group: s.group, status: attBatch[s.id] || 'present' }));
                const batch = db.batch();
                const existing = logs.find(l => l.id === logId);
                if (existing) {
                    existing.records.forEach(r => { if (r.status === 'absent') batch.update(db.collection('students').doc(r.studentId), { absences: firebase.firestore.FieldValue.increment(-1) }); });
                }
                records.forEach(r => { if (r.status === 'absent') batch.update(db.collection('students').doc(r.studentId), { absences: firebase.firestore.FieldValue.increment(1) }); });
                batch.set(db.collection('attendance_logs').doc(logId), { id: logId, group, date, records, submittedBy: role === 'teacher' ? teacherData.name : 'مسجل', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await batch.commit();
                toastMsg("تم اعتماد وحفظ كشف الحضور بنجاح");
                if (role === 'monitor') setActiveGrp(null);
            };

            const submitHomework = async (g) => {
                const group = g || activeGrp;
                const date = getTodayDateStr();
                const logId = `hw_${group.replace(/\s+/g,'_')}_${date}`;
                const st = students.filter(s => s.group === group && s.active);
                const records = st.map(s => ({ studentId: s.id, name: s.name, phone: s.phone, group: s.group, status: hwBatch[s.id] || 'submitted' }));
                const batch = db.batch();
                const existing = homeworkLogs.find(l => l.id === logId);
                if (existing) {
                    existing.records.forEach(r => { if (r.status === 'missed') batch.update(db.collection('students').doc(r.studentId), { missedHomework: firebase.firestore.FieldValue.increment(-1) }); });
                }
                records.forEach(r => { if (r.status === 'missed') batch.update(db.collection('students').doc(r.studentId), { missedHomework: firebase.firestore.FieldValue.increment(1) }); });
                batch.set(db.collection('homework_logs').doc(logId), { id: logId, group, date, records, submittedBy: role === 'teacher' ? teacherData.name : 'مسجل', timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await batch.commit();
                toastMsg("تم اعتماد كشف الواجبات بنجاح");
                if (role === 'monitor') setActiveGrp(null);
            };

            const handleExcelImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const data = evt.target.result;
                    const workbook = XLSX.read(data, { type: 'binary' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    const mapped = json.map(row => ({
                        name: row['الاسم'] || row['اسم الطالب'] || '',
                        phone: formatSaudiPhone(row['الجوال'] || row['رقم الجوال'] || row['الرقم']),
                        group: row['الحلقة'] || row['الفصل'] || 'عام',
                        active: row['الحالة'] ? (row['الحالة'] === 'مستمر' || row['الحالة'] === 'نشط') : true
                    })).filter(x => x.name);
                    setExcelPreview(mapped);
                };
                reader.readAsBinaryString(file);
                e.target.value = '';
            };

            const commitExcelImport = async () => {
                if (!excelPreview) return;
                const batch = db.batch();
                excelPreview.forEach(s => {
                    const ref = db.collection('students').doc();
                    batch.set(ref, { ...s, absences: 0, missedHomework: 0, pledges: 0, exams: {}, examNotes: {} });
                });
                await batch.commit();
                setExcelPreview(null);
                toastMsg(`تم استيراد ${excelPreview.length} طالب سحابياً بنجاح`);
            };

            const handleToggleGrade = async (sid, ex, g) => {
                const s = students.find(x => x.id === sid);
                const val = s.exams?.[ex] === g ? firebase.firestore.FieldValue.delete() : g;
                await db.collection('students').doc(sid).update({ [`exams.${ex}`]: val });
                toastMsg("تم رصد الدرجة");
            };

            const addPledge = async (e) => {
                e.preventDefault();
                const batch = db.batch();
                batch.update(db.collection('students').doc(showPledge.id), { pledges: firebase.firestore.FieldValue.increment(1) });
                batch.set(db.collection('pledges_logs').doc(), { studentId: showPledge.id, studentName: showPledge.name, group: showPledge.group, reason: pReason, date: getTodayDateStr(), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await batch.commit();
                setShowPledge(null); setPReason(''); toastMsg("تم رصد التعهد التأديبي");
            };

            const submitTeacherAttendance = async () => {
                const date = getTodayDateStr();
                const logId = `tchr_${date}`;
                const records = teachers.map(t => ({ teacherId: t.id, name: t.name, subject: t.subject, status: tchrAttBatch[t.id] || 'present' }));
                const batch = db.batch();
                const existing = teacherLogs.find(l => l.id === logId);
                if (existing) {
                    existing.records.forEach(r => {
                        const ref = db.collection('teachers').doc(r.teacherId);
                        if (r.status === 'present') batch.update(ref, { presentCount: firebase.firestore.FieldValue.increment(-1) });
                        else if (r.status === 'absent') batch.update(ref, { absentCount: firebase.firestore.FieldValue.increment(-1) });
                        else if (r.status === 'excused') batch.update(ref, { excusedCount: firebase.firestore.FieldValue.increment(-1) });
                    });
                }
                records.forEach(r => {
                    const ref = db.collection('teachers').doc(r.teacherId);
                    if (r.status === 'present') batch.update(ref, { presentCount: firebase.firestore.FieldValue.increment(1) });
                    else if (r.status === 'absent') batch.update(ref, { absentCount: firebase.firestore.FieldValue.increment(1) });
                    else if (r.status === 'excused') batch.update(ref, { excusedCount: firebase.firestore.FieldValue.increment(1) });
                });
                batch.set(db.collection('teacher_attendance_logs').doc(logId), { id: logId, date, records, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
                await batch.commit();
                toastMsg("تم اعتماد تحضير المعلمين بنجاح");
                setIsMonTeachers(false);
            };

                const data = [["اسم الطالب", "الحلقة", "الجوال", "الغيابات", "حالة الغياب", "عدم تسليم الواجبات", "التعهدات", "حالة القيد"]];
                filteredStudents.forEach(s => {
                    const absCat = getAbsenceCategory(s.absences);
                    data.push([s.name, s.group, s.phone, s.absences, absCat === 'danger' ? 'خطر' : absCat === 'warning' ? 'تحذير' : 'طبيعي', s.missedHomework, s.pledges, s.active ? "مستمر" : "منقطع"]);
                });
                const ws = XLSX.utils.aoa_to_sheet(data);
                data.forEach((row, r) => {
                    if (r === 0) row.forEach((_, c) => ws[XLSX.utils.encode_cell({r,c})].s = STYLES.header);
                    else {
                        const c4 = XLSX.utils.encode_cell({r, c:4});
                        if (data[r][4] === 'خطر') ws[c4].s = STYLES.redCell;
                        else if (data[r][4] === 'تحذير') ws[c4].s = STYLES.yellowCell;
                        else ws[c4].s = STYLES.greenCell;
                    }
                });
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "الطلاب");
                XLSX.writeFile(wb, `كشف_حلقات_إتقان_${getTodayDateStr()}.xlsx`);
            };

            const exportExamsExcel = () => {
                const filtered = students.filter(s => (exFGrp === 'ALL' || s.group === exFGrp) && s.active);

                filtered.forEach(s => {
                    data.push([
                        s.name, s.group,
                        s.exams?.formative_1 || '-', s.examNotes?.formative_1 || '-',
                        s.exams?.formative_2 || '-', s.examNotes?.formative_2 || '-',
                        s.exams?.formative_3 || '-', s.examNotes?.formative_3 || '-',
                        s.exams?.formative_4 || '-', s.examNotes?.formative_4 || '-',
                        s.exams?.final_exam || '-', s.examNotes?.final_exam || '-'
                    ]);
                });
                const ws = XLSX.utils.aoa_to_sheet(data);
                data.forEach((row, r) => {
                    if (r === 0) row.forEach((_, c) => ws[XLSX.utils.encode_cell({r,c})].s = STYLES.header);
                    else {
                        [2, 4, 6, 8, 10].forEach(cIdx => {
                            const cell = XLSX.utils.encode_cell({r, c: cIdx});
                            const val = data[r][cIdx];
                            if (val === 'متمكن' || val === 'مجتاز') ws[cell].s = STYLES.greenCell;
                            else if (val === 'ضعيف') ws[cell].s = STYLES.yellowCell;
                            else if (val === 'مخفق' || val === 'غير مجتاز') ws[cell].s = STYLES.redCell;
                        });
                    }
                });
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "نتائج الاختبارات");
                XLSX.writeFile(wb, `نتائج_اختبارات_إتقان_${getTodayDateStr()}.xlsx`);
            };

            // واجهة تسجيل الدخول
            if (!role) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-emerald-950 via-slate-900 to-[#042f2e]">
                        <div className="max-w-md w-full bg-white/95 rounded-[2.5rem] p-10 space-y-7 text-center shadow-2xl border border-amber-500/30 backdrop-blur-xl animate-in">
                            <div className="w-20 h-20 bg-gradient-to-tr from-emerald-800 to-emerald-600 border-2 border-amber-400 text-amber-200 text-3xl font-extrabold rounded-3xl flex items-center justify-center mx-auto shadow-xl shadow-emerald-950/40">
                                📖
                            </div>
                            <div className="space-y-1">
                                <h1 className="text-3xl font-extrabold text-emerald-950 font-quran tracking-wide">إِتْقَانَ القُرْآنِيّ</h1>
                                <p className="text-amber-800 text-xs font-bold">منصة إتقان للرصد فقط</p>
                            </div>
                            <div className="space-y-4">
                                <div className="relative">
                                    <input 
                                        type={showPin ? "text" : "password"} 
                                        placeholder="رمز الدخول (PIN)" 
                                        className="w-full p-4 border-2 border-slate-200 rounded-2xl text-center text-2xl tracking-widest outline-none focus:border-emerald-700 font-mono bg-slate-50 focus:bg-white transition-all shadow-inner" 
                                        value={pin} 
                                        onChange={e => setPin(e.target.value)} 
                                        onKeyDown={e => e.key === 'Enter' && login()} 
                                    />
                                    <button onClick={() => setShowPin(!showPin)} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-700">
                                        {showPin ? "👁️" : "🔒"}
                                    </button>
                                </div>
                                <button onClick={login} className="w-full bg-gradient-to-r from-emerald-800 to-teal-800 hover:from-emerald-900 hover:to-teal-900 text-amber-200 border border-amber-400/40 p-4 rounded-2xl font-bold text-base shadow-lg shadow-emerald-900/30 active:scale-95 transition-all">
                                    دخول للمنصة
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    {toast && <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-2xl shadow-2xl text-white font-bold text-sm ${toast.t === 'success' ? 'bg-emerald-700 border border-emerald-500' : 'bg-rose-700'}`}>{toast.m}</div>}
                    
                    {/* الترويسة العلوية الفاخرة */}
                    <header className="glass-header sticky top-0 z-50 px-6 py-3 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <span className="bg-gradient-to-r from-emerald-800 to-emerald-700 text-amber-300 border border-amber-400/50 px-3.5 py-1.5 rounded-xl font-black text-sm shadow-sm font-quran">
                                إتقان
                            </span>
                            <div className="hidden md:block">
                                <span className="font-extrabold text-emerald-950 text-sm block">منصة إتقان للرصد فقط</span>
                                <span className="text-[10px] text-amber-800 font-bold">
                                    {role === 'supervisor' ? 'لوحة تحكم المشرف العام' : role === 'monitor' ? 'بوابة المسجل العام' : `المعلم: ${teacherData?.name}`}
                                </span>
                            </div>
                        </div>
                        <button onClick={logout} className="text-xs font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-4 py-2 rounded-xl transition-all">
                            تسجيل الخروج ✕
                        </button>
                    </header>

                    <main className="p-4 md:p-8 max-w-6xl mx-auto space-y-6">
                        {/* واجهة المعلم والمسجل */}
                        {(role === 'monitor' || role === 'teacher') && !activeGrp && !isMonTeachers && (
                            <div className="space-y-6 animate-in">
                                {role === 'monitor' && (
                                    <div onClick={() => setIsMonTeachers(true)} className="bg-gradient-to-r from-emerald-900 to-teal-900 text-white p-6 rounded-3xl cursor-pointer shadow-lg hover:shadow-xl transition-all border border-amber-500/30">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <h2 className="text-xl font-bold text-amber-200">📋 تحضير المعلمين اليوم</h2>
                                                <p className="text-xs text-emerald-100 mt-1">رصد حضور وانصراف الكادر التعليمي لليوم</p>
                                            </div>
                                            <span className="text-3xl text-amber-300">←</span>
                                        </div>
                                    </div>
                                )}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {(role === 'teacher' ? [teacherData.subject] : grps).map(g => (
                                        <div key={g} onClick={() => setActiveGrp(g)} className="bg-white p-6 rounded-3xl card-gold-border hover:border-emerald-600 cursor-pointer shadow-sm transition-all group">
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <span className="text-[10px] bg-amber-50 text-amber-900 border border-amber-200 px-2.5 py-0.5 rounded-lg font-bold">حلقة قرآنية</span>
                                                    <h3 className="font-extrabold text-emerald-950 text-xl mt-2 group-hover:text-emerald-700 font-quran">{g}</h3>
                                                    <p className="text-xs text-slate-400 mt-1 font-bold">{students.filter(s => s.group === g && s.active).length} طالب مقيد</p>
                                                </div>
                                                <span className="text-2xl text-amber-600/50 group-hover:text-emerald-700 transition-all font-bold">←</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* تحضير المعلمين للمسجل */}
                        {isMonTeachers && (
                            <div className="max-w-2xl mx-auto space-y-4 animate-in">
                                <div className="flex justify-between items-center bg-white p-4 rounded-2xl card-gold-border">
                                    <button onClick={() => setIsMonTeachers(false)} className="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-xl">→ رجوع</button>
                                    <h2 className="font-extrabold text-emerald-950">تحضير المعلمين لليوم</h2>
                                    <span className="text-xs text-amber-900 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-xl font-bold">{getTodayDateStr()}</span>
                                </div>
                                <div className="bg-white rounded-3xl card-gold-border divide-y overflow-hidden">
                                    {teachers.sort((a,b) => (a.name || '').localeCompare(b.name || '', 'ar')).map(t => (
                                        <div key={t.id} className="p-4 flex justify-between items-center hover:bg-emerald-50/30">
                                            <div>
                                                <span className="font-bold text-slate-800 block text-sm">{t.name}</span>
                                                <span className="text-[10px] text-amber-800 font-bold">{t.subject}</span>
                                            </div>
                                            <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                {['present', 'excused', 'absent'].map(st => (
                                                    <button key={st} onClick={() => setTchrAttBatch(p => ({...p, [t.id]: st}))} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${tchrAttBatch[t.id] === st || (!tchrAttBatch[t.id] && st === 'present') ? (st === 'present' ? 'bg-emerald-700 text-white' : st === 'excused' ? 'bg-amber-600 text-white' : 'bg-rose-600 text-white') + ' shadow-sm' : 'text-slate-500'}`}>
                                                        {st === 'present' ? 'حاضر' : st === 'excused' ? 'بعذر' : 'غائب'}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={submitTeacherAttendance} className="w-full bg-emerald-800 hover:bg-emerald-900 text-amber-200 py-4 rounded-2xl font-bold shadow-lg border border-amber-400/30">اعتماد تحضير المعلمين ✓</button>
                            </div>
                        )}

                        {/* رصد الحلقة المحددة */}
                        {activeGrp && (
                            <div className="max-w-3xl mx-auto space-y-6 animate-in">
                                <div className="bg-white p-5 rounded-3xl card-gold-border flex flex-wrap justify-between items-center gap-4">
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => setActiveGrp(null)} className="text-xs font-bold bg-slate-100 px-3 py-2 rounded-xl">→ رجوع</button>
                                        <div>
                                            <span className="text-[10px] text-amber-800 font-bold block">تحضير حلقة</span>
                                            <h2 className="font-extrabold text-2xl text-emerald-950 font-quran">{activeGrp}</h2>
                                        </div>
                                    </div>
                                    <div className="flex gap-1 bg-slate-100 p-1.5 rounded-2xl">
                                        <button onClick={() => setMonitorMode('attendance')} className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${monitorMode === 'attendance' ? 'bg-emerald-800 text-amber-200 shadow-sm' : 'text-slate-600'}`}>الحضور</button>
                                        <button onClick={() => setMonitorMode('homework')} className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${monitorMode === 'homework' ? 'bg-purple-800 text-white shadow-sm' : 'text-slate-600'}`}>الواجبات</button>
                                        {role === 'teacher' && <button onClick={() => setMonitorMode('exams')} className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${monitorMode === 'exams' ? 'bg-indigo-800 text-white shadow-sm' : 'text-slate-600'}`}>الاختبارات</button>}
                                    </div>
                                </div>

                                {monitorMode === 'attendance' && (
                                    <div className="space-y-4">
                                        <div className="bg-white rounded-3xl card-gold-border divide-y overflow-hidden shadow-sm">
                                            {students.filter(s => s.group === activeGrp && s.active).sort((a,b) => (a.name || '').localeCompare(b.name || '', 'ar')).map(s => (
                                                <div key={s.id} className="p-4 flex justify-between items-center hover:bg-emerald-50/20">
                                                    <div>
                                                        <span className="font-bold text-slate-800 text-sm block">{s.name}</span>
                                                        <span className="text-[10px] text-slate-400 font-bold">غياب سابق: {s.absences}</span>
                                                    </div>
                                                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                        {['present', 'excused', 'absent'].map(st => (
                                                            <button key={st} onClick={() => setAttBatch(p => ({...p, [s.id]: st}))} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${attBatch[s.id] === st || (!attBatch[s.id] && st === 'present') ? (st === 'present' ? 'bg-emerald-700 text-white' : st === 'excused' ? 'bg-amber-600 text-white' : 'bg-rose-600 text-white') : 'text-slate-500'}`}>
                                                                {st === 'present' ? 'حاضر' : st === 'excused' ? 'بعذر' : 'غائب'}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => submitAttendance()} className="w-full bg-emerald-800 hover:bg-emerald-900 text-amber-200 py-4 rounded-2xl font-bold shadow-lg border border-amber-400/30">اعتماد كشف الحضور سحابياً ✓</button>
                                    </div>
                                )}

                                {monitorMode === 'homework' && (
                                    <div className="space-y-4">
                                        <div className="bg-white rounded-3xl card-gold-border divide-y overflow-hidden shadow-sm">
                                            {students.filter(s => s.group === activeGrp && s.active).sort((a,b) => (a.name || '').localeCompare(b.name || '', 'ar')).map(s => (
                                                <div key={s.id} className="p-4 flex justify-between items-center hover:bg-purple-50/20">
                                                    <div>
                                                        <span className="font-bold text-slate-800 text-sm block">{s.name}</span>
                                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md mt-0.5 inline-block ${getHomeworkAlert(s.missedHomework).color}`}>{getHomeworkAlert(s.missedHomework).text}</span>
                                                    </div>
                                                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                        {['submitted', 'missed'].map(st => (
                                                            <button key={st} onClick={() => setHwBatch(p => ({...p, [s.id]: st}))} className={`px-5 py-1.5 rounded-lg text-xs font-bold transition-all ${hwBatch[s.id] === st || (!hwBatch[s.id] && st === 'submitted') ? (st === 'submitted' ? 'bg-emerald-700' : 'bg-rose-600') + ' text-white' : 'text-slate-500'}`}>
                                                                {st === 'submitted' ? 'سلم الحفظ ✓' : 'لم يسلم ✕'}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => submitHomework()} className="w-full bg-purple-800 hover:bg-purple-900 text-white py-4 rounded-2xl font-bold shadow-lg">اعتماد كشف الواجبات سحابياً ✓</button>
                                    </div>
                                )}

                                {monitorMode === 'exams' && (
                                    <div className="space-y-4 bg-white p-6 rounded-3xl card-gold-border shadow-sm">
                                        <div className="flex justify-between items-center border-b pb-4">
                                            <select value={selExType} onChange={e => setSelExType(e.target.value)} className="bg-slate-50 border rounded-xl px-4 py-2 text-xs font-bold outline-none border-amber-300">
                                                {EXAM_TYPES.map(ex => <option key={ex.id} value={ex.id}>{ex.title}</option>)}
                                            </select>
                                            <span className="text-xs text-amber-900 font-bold">الحفظ سحابي فوري ومباشر</span>
                                        </div>
                                        {students.filter(s => s.group === activeGrp && s.active).map(s => (
                                            <div key={s.id} className="py-4 border-b last:border-0 space-y-2">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-bold text-slate-800 text-sm">{s.name}</span>
                                                    <div className="flex gap-1 bg-slate-100 p-1 rounded-xl">
                                                        {(selExType === 'final_exam' ? ['مجتاز', 'غير مجتاز'] : ['متمكن', 'ضعيف', 'مخفق']).map(g => (
                                                            <button key={g} onClick={() => handleToggleGrade(s.id, selExType, g)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${s.exams?.[selExType] === g ? 'bg-emerald-800 text-amber-200' : 'text-slate-500'}`}>{g}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <textarea 
                                                    key={`${s.id}_${selExType}`}
                                                    placeholder="ملاحظات المعلم وتوجيهاته حول التسميع..." 
                                                    className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs outline-none focus:bg-white focus:border-emerald-700" 
                                                    defaultValue={s.examNotes?.[selExType] || ''} 
                                                    onBlur={e => db.collection('students').doc(s.id).update({[`examNotes.${selExType}`]: e.target.value})} 
                                                />
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* لوحة تحكم المشرف العام الفاخرة */}
                        {role === 'supervisor' && (
                            <div className="space-y-6 animate-in">
                                <div className="flex bg-white p-1.5 rounded-2xl card-gold-border shadow-sm overflow-x-auto gap-1">
                                    {[
                                        {id:'inbox', l:'الوارد المعتمد'}, {id:'students', l:'الطلاب والحلقات'},
                                        {id:'exams', l:'الاختبارات والتقييم'}, {id:'pledges', l:'سجل التعهدات'}, 
                                        {id:'teachers', l:'إدارة المعلمين'}, {id:'settings', l:'قوالب الرسائل'}
                                    ].map(t => (
                                        <button key={t.id} onClick={() => setView(t.id)} className={`flex-1 min-w-[100px] py-3 rounded-xl text-xs font-bold transition-all ${view === t.id ? 'bg-emerald-800 text-amber-200 shadow-md' : 'text-slate-600 hover:bg-emerald-50/40'}`}>{t.l}</button>
                                    ))}
                                </div>

                                {view === 'inbox' && (
                                    <div className="space-y-4">
                                        <div className="flex gap-2 border-b border-amber-200/60 pb-2">
                                            <button onClick={() => setInboxSub('attendance')} className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${inboxSub==='attendance'?'bg-emerald-800 text-amber-200 shadow-sm':'bg-white border text-slate-600'}`}>كشوفات الحضور ({logs.length})</button>
                                            <button onClick={() => setInboxSub('homework')} className={`px-5 py-2 rounded-xl text-xs font-bold transition-all ${inboxSub==='homework'?'bg-purple-800 text-white shadow-sm':'bg-white border text-slate-600'}`}>كشوفات الواجبات ({homeworkLogs.length})</button>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {(inboxSub === 'attendance' ? logs : homeworkLogs).map(log => {
                                                const alerts = log.records?.filter(r => r.status === 'absent' || r.status === 'missed' || r.status === 'excused') || [];
                                                return (
                                                    <div key={log.id} className="bg-white rounded-3xl card-gold-border p-5 shadow-sm space-y-4">
                                                        <div className="flex justify-between items-center border-b pb-2">
                                                            <div>
                                                                <span className="font-extrabold text-sm text-emerald-950 font-quran">{log.group}</span>
                                                                <span className="text-[10px] text-amber-900 bg-amber-50 px-2 py-0.5 rounded-md mr-2 font-bold">{log.date}</span>
                                                            </div>
                                                            <button onClick={() => db.collection(inboxSub==='attendance'?'attendance_logs':'homework_logs').doc(log.id).delete()} className="text-rose-500 text-xs font-bold hover:underline">حذف الكشف 🗑️</button>
                                                        </div>
                                                        <div className="space-y-2 max-h-60 overflow-y-auto">
                                                            {alerts.map(r => {
                                                                const s = students.find(x => x.id === r.studentId);
                                                                const template = r.status === 'absent' ? settings.absence_template : r.status === 'excused' ? settings.excused_template : settings.homework_template;
                                                                const msg = template.replace(/{student_name}/g, r.name).replace(/{date}/g, log.date).replace(/{absence_count}/g, s?.absences || 0).replace(/{missed_count}/g, s?.missedHomework || 0).replace(/{alert_status}/g, getHomeworkAlert(s?.missedHomework).text);
                                                                return (
                                                                    <div key={r.studentId} className="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                                                        <div>
                                                                            <span className="text-xs font-bold text-slate-800">{r.name}</span>
                                                                            <span className={`text-[10px] mr-2 px-2 py-0.5 rounded-md font-bold ${r.status==='absent'?'bg-rose-100 text-rose-700':r.status==='excused'?'bg-amber-100 text-amber-700':'bg-purple-100 text-purple-700'}`}>{r.status === 'absent' ? 'غائب' : r.status === 'excused' ? 'بعذر' : 'لم يسلم'}</span>
                                                                        </div>
                                                                        <a href={`https://wa.me/${r.phone}?text=${encodeURIComponent(msg)}`} target="_blank" className="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1 rounded-xl text-xs font-bold shadow-sm">واتساب 💬</a>
                                                                    </div>
                                                                );
                                                            })}
                                                            {alerts.length === 0 && <p className="text-center text-xs text-emerald-800 font-bold py-4">✓ تم التسميع والحضور لجميع الطلاب بدون غياب</p>}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {view === 'students' && (
                                    <div className="space-y-4 animate-in">
                                        <div className="bg-white p-5 rounded-3xl card-gold-border shadow-sm space-y-4">
                                            <div className="flex flex-wrap gap-2 items-center justify-between">
                                                <div className="flex gap-2">
                                                    <button onClick={() => setShowAddStd(true)} className="bg-emerald-800 hover:bg-emerald-900 text-amber-200 border border-amber-400/40 px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm">+ طالب جديد</button>
                                                    <label className="bg-teal-800 hover:bg-teal-900 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm cursor-pointer transition-all">
                                                        استيراد Excel 📊
                                                        <input type="file" ref={fileInputRef} className="hidden" accept=".xlsx, .xls" onChange={handleExcelImport} />
                                                    </label>
                                                    <button onClick={exportStudentsExcel} className="bg-slate-700 hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm">تصدير الكشف 📑</button>
                                                </div>
                                                <input type="text" placeholder="بحث باسم الطالب أو رقم الجوال..." className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:border-emerald-700 w-full md:w-64" value={search} onChange={e => setSearch(e.target.value)} />
                                            </div>
                                            <div className="flex flex-wrap gap-3 pt-1 border-t border-slate-100">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[11px] font-bold text-amber-900">الحلقة:</span>
                                                    <select value={fGrp} onChange={e => setFGrp(e.target.value)} className="bg-slate-50 border rounded-xl px-2.5 py-1 text-xs outline-none">
                                                        <option value="ALL">جميع الحلقات</option>
                                                        {grps.map(g => <option key={g} value={g}>{g}</option>)}
                                                    </select>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[11px] font-bold text-amber-900">حالة القيد:</span>
                                                    <select value={fStatus} onChange={e => setFStatus(e.target.value)} className="bg-slate-50 border rounded-xl px-2.5 py-1 text-xs outline-none">
                                                        <option value="ALL">الكل</option>
                                                        <option value="ACTIVE">مستمر</option>
                                                        <option value="INACTIVE">منقطع</option>
                                                    </select>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[11px] font-bold text-amber-900">الغيابات:</span>
                                                    <select value={fAbsCategory} onChange={e => setFAbsCategory(e.target.value)} className="bg-slate-50 border rounded-xl px-2.5 py-1 text-xs outline-none">
                                                        <option value="ALL">الكل</option>
                                                        <option value="normal">طبيعي</option>
                                                        <option value="warning">تحذير</option>
                                                        <option value="danger">خطر</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl card-gold-border overflow-hidden shadow-sm overflow-x-auto">
                                            <table className="w-full text-right text-xs">
                                                <thead className="bg-[#f7f5ed] border-b border-amber-200/50">
                                                    <tr>
                                                        <th className="p-4 font-bold text-emerald-950">الطالب / الحلقة</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">الغياب</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">الواجبات</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">التعهدات</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">القيد</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">الإجراءات</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredStudents.map(s => {
                                                        const absCat = getAbsenceCategory(s.absences);
                                                        const lMsg = settings.listener_template.replace(/{student_name}/g, s.name).replace(/{reason}/g, `بلوغ الغياب ${s.absences} أيام`);
                                                        return (
                                                            <tr key={s.id} className="hover:bg-emerald-50/20">
                                                                <td className="p-4">
                                                                    <div className="font-bold text-slate-800 text-sm">{s.name}</div>
                                                                    <div className="text-[10px] text-slate-400 mt-0.5">{s.group} | {s.phone}</div>
                                                                </td>
                                                                <td className="p-4 text-center"><span className={`px-3 py-1 rounded-lg font-bold ${absCat==='danger'?'bg-rose-100 text-rose-700':absCat==='warning'?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700'}`}>{s.absences}</span></td>
                                                                <td className="p-4 text-center font-bold text-rose-600">{s.missedHomework}</td>
                                                                <td className="p-4 text-center"><button onClick={() => setShowPledge(s)} className="bg-purple-50 text-purple-700 px-3 py-1 rounded-lg font-bold border border-purple-200">+{s.pledges}</button></td>
                                                                <td className="p-4 text-center"><span className={`px-2 py-1 rounded-lg font-bold ${s.active?'bg-emerald-50 text-emerald-700 border border-emerald-200':'bg-rose-50 text-rose-700'}`}>{s.active?'مستمر':'منقطع'}</span></td>
                                                                <td className="p-4">
                                                                    <div className="flex justify-center gap-1.5">
                                                                        <a href={`https://wa.me/${s.phone}?text=${encodeURIComponent(lMsg)}`} target="_blank" className="bg-purple-700 hover:bg-purple-800 text-white px-2.5 py-1.5 rounded-xl font-bold text-[11px] shadow-sm whitespace-nowrap">صفة مستمع 📢</a>
                                                                        <button onClick={() => setEditStd(s)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-xl font-bold">✏️</button>
                                                                        <button onClick={async () => { if(confirm('حذف الطالب نهائياً؟')) await db.collection('students').doc(s.id).delete(); }} className="bg-rose-50 hover:bg-rose-100 text-rose-600 px-2.5 py-1.5 rounded-xl font-bold">🗑️</button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {view === 'exams' && (
                                    <div className="space-y-6 bg-white p-6 rounded-3xl card-gold-border shadow-sm animate-in">
                                        <div className="flex flex-wrap justify-between items-center gap-4 border-b pb-4">
                                            <div className="flex gap-3">
                                                <select value={selExType} onChange={e => setSelExType(e.target.value)} className="bg-slate-50 border border-amber-300 rounded-xl px-4 py-2 text-xs font-bold outline-none">
                                                    {EXAM_TYPES.map(ex => <option key={ex.id} value={ex.id}>{ex.title}</option>)}
                                                </select>
                                                <select value={exFGrp} onChange={e => setExFGrp(e.target.value)} className="bg-slate-50 border rounded-xl px-4 py-2 text-xs font-bold outline-none">
                                                    <option value="ALL">جميع الحلقات</option>
                                                    {grps.map(g => <option key={g} value={g}>{g}</option>)}
                                                </select>
                                            </div>
                                            <button onClick={exportExamsExcel} className="bg-emerald-800 hover:bg-emerald-900 text-amber-200 border border-amber-400/40 px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm">تصدير الدرجات Excel 📥</button>
                                        </div>
                                        <div className="overflow-x-auto border rounded-2xl">
                                            <table className="w-full text-right text-xs">
                                                <thead className="bg-[#f7f5ed] border-b">
                                                    <tr>
                                                        <th className="p-4 font-bold text-emerald-950">الاسم</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">التقدير</th>
                                                        <th className="p-4 font-bold text-emerald-950">الملاحظات</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">واتساب</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y">
                                                    {students.filter(s => (exFGrp === 'ALL' || s.group === exFGrp) && s.active).map(s => {
                                                        const g = s.exams?.[selExType] || '-';
                                                        const n = s.examNotes?.[selExType] || '';
                                                        const t = selExType === 'final_exam' ? settings.final_exam_template : settings.formative_exam_template;
                                                        const msg = t.replace(/{student_name}/g, s.name).replace(/{exam_name}/g, EXAM_TYPES.find(x=>x.id===selExType).title).replace(/{grade}/g, g).replace(/{notes}/g, n);
                                                        return (
                                                            <tr key={s.id} className="hover:bg-slate-50">
                                                                <td className="p-4 font-bold text-slate-800">{s.name}</td>
                                                                <td className="p-4 text-center font-bold">
                                                                    <span className={`px-3 py-1 rounded-lg ${g==='متمكن'||g==='مجتاز'?'bg-emerald-100 text-emerald-700':g==='ضعيف'?'bg-amber-100 text-amber-700':'bg-slate-100 text-slate-500'}`}>{g}</span>
                                                                </td>
                                                                <td className="p-4 max-w-xs truncate text-slate-500">{n}</td>
                                                                <td className="p-4 text-center"><a href={`https://wa.me/${s.phone}?text=${encodeURIComponent(msg)}`} target="_blank" className="text-emerald-700 font-bold hover:underline">إرسال 💬</a></td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {view === 'teachers' && (
                                    <div className="space-y-4 animate-in">
                                        <div className="bg-white p-5 rounded-3xl card-gold-border shadow-sm flex justify-between items-center">
                                            <h3 className="font-extrabold text-emerald-950 text-base">سجل المعلمين وتخصيص رموز الدخول</h3>
                                            <button onClick={() => setShowAddTchr(true)} className="bg-emerald-800 text-amber-200 border border-amber-400/40 px-5 py-2 rounded-xl text-xs font-bold">+ إضافة معلم</button>
                                        </div>
                                        <div className="bg-white rounded-3xl card-gold-border overflow-hidden shadow-sm overflow-x-auto">
                                            <table className="w-full text-right text-xs">
                                                <thead className="bg-[#f7f5ed] border-b">
                                                    <tr>
                                                        <th className="p-4 font-bold text-emerald-950">المعلم</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">الرمز (PIN)</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">الحضور</th>
                                                        <th className="p-4 text-center font-bold text-emerald-950">الخيارات</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y">
                                                    {teachers.map(t => (
                                                        <tr key={t.id} className="hover:bg-slate-50">
                                                            <td className="p-4">
                                                                <div className="font-bold text-slate-800 text-sm">{t.name}</div>
                                                                <div className="text-[10px] text-amber-800 font-bold">{t.subject}</div>
                                                            </td>
                                                            <td className="p-4 text-center font-mono font-bold text-emerald-800 text-sm">{t.pin}</td>
                                                            <td className="p-4 text-center font-bold text-emerald-700">{t.presentCount || 0} يوم</td>
                                                            <td className="p-4 text-center"><button onClick={async () => { if(confirm('حذف المعلم نهائياً؟')) await db.collection('teachers').doc(t.id).delete(); }} className="text-rose-600 font-bold hover:underline">حذف 🗑️</button></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {view === 'settings' && (
                                    <div className="bg-white p-8 rounded-3xl card-gold-border shadow-sm space-y-6 animate-in">
                                        <h3 className="font-extrabold border-b pb-4 text-xl text-emerald-950">قوالب وإعدادات الرسائل</h3>
                                        {Object.keys(settings).map(k => (
                                            <div key={k} className="space-y-1">
                                                <label className="text-xs font-bold text-amber-900">{k.replace(/_/g, ' ')}</label>
                                                <textarea className="w-full p-4 bg-slate-50 border rounded-2xl text-xs outline-none focus:bg-white focus:border-emerald-700 transition-all min-h-[90px]" value={settings[k]} onChange={e => setSettings(p => ({...p, [k]: e.target.value}))} />
                                            </div>
                                        ))}
                                        <button onClick={async () => { await db.collection('settings').doc('app_config').set(settings); toastMsg("تم حفظ القوالب سحابياً ✓"); }} className="w-full bg-emerald-800 hover:bg-emerald-900 text-amber-200 border border-amber-400/40 py-4 rounded-2xl font-bold shadow-lg">حفظ كافة الإعدادات سحابياً ✓</button>
                                    </div>
                                )}

                                {view === 'pledges' && (
                                    <div className="bg-white rounded-3xl card-gold-border shadow-sm overflow-hidden animate-in">
                                        <div className="p-6 border-b bg-[#f7f5ed] flex justify-between items-center">
                                            <h3 className="font-extrabold text-lg text-emerald-950 font-quran">سجل التعهدات التأديبية</h3>
                                            <span className="text-xs bg-purple-100 text-purple-700 font-bold px-3 py-1 rounded-xl">الإجمالي: {pledgeLogs.length}</span>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-right text-xs">
                                                <thead className="bg-slate-50">
                                                    <tr>
                                                        <th className="p-4">التاريخ</th>
                                                        <th className="p-4">الطالب</th>
                                                        <th className="p-4">السبب</th>
                                                        <th className="p-4 text-center">خيار</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y">
                                                    {pledgeLogs.map(p => (
                                                        <tr key={p.id} className="hover:bg-slate-50">
                                                            <td className="p-4 text-slate-400 font-mono">{p.date}</td>
                                                            <td className="p-4 font-bold text-slate-800">{p.studentName}</td>
                                                            <td className="p-4 text-rose-600 font-medium">{p.reason}</td>
                                                            <td className="p-4 text-center"><button onClick={async () => { if(confirm('حذف هذا التعهد؟')) await db.collection('pledges_logs').doc(p.id).delete(); }} className="text-slate-400 hover:text-rose-600 font-bold">×</button></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {excelPreview && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white w-full max-w-2xl rounded-3xl p-8 space-y-4 shadow-2xl animate-in max-h-[80vh] flex flex-col card-gold-border">
                                <h3 className="text-xl font-bold border-b pb-4 text-emerald-950">معاينة استيراد الطلاب ({excelPreview.length})</h3>
                                <div className="flex-1 overflow-y-auto space-y-2 text-xs">
                                    <table className="w-full text-right">
                                        <thead className="sticky top-0 bg-white border-b">
                                            <tr>
                                                <th className="p-2">الاسم</th>
                                                <th className="p-2 text-center">الجوال</th>
                                                <th className="p-2 text-center">الحلقة</th>
                                                <th className="p-2 text-center">الحالة</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {excelPreview.map((s, idx) => (
                                                <tr key={idx}>
                                                    <td className="p-2 font-bold">{s.name}</td>
                                                    <td className="p-2 text-center">{s.phone}</td>
                                                    <td className="p-2 text-center">{s.group}</td>
                                                    <td className="p-2 text-center">{s.active ? "مستمر" : "منقطع"}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="flex gap-2 pt-4 border-t">
                                    <button onClick={commitExcelImport} className="flex-1 bg-emerald-800 hover:bg-emerald-900 text-amber-200 py-3 rounded-2xl font-bold shadow-lg">تأكيد الاستيراد السحابي ✓</button>
                                    <button onClick={() => setExcelPreview(null)} className="px-8 bg-slate-100 rounded-2xl font-bold text-slate-600">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAddStd && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={async e => {
                                e.preventDefault();
                                await db.collection('students').add({...newStd, phone: formatSaudiPhone(newStd.phone), absences:0, missedHomework:0, pledges:0, exams:{}, examNotes:{}});
                                setShowAddStd(false); setNewStd({name:'', phone:'', group:'', active:true}); toastMsg("تمت إضافة الطالب بنجاح");
                            }} className="bg-white w-full max-w-md rounded-3xl p-8 space-y-4 shadow-2xl animate-in card-gold-border">
                                <h3 className="text-xl font-bold border-b pb-3 text-emerald-950 font-quran">إضافة طالب للحلقات</h3>
                                <input required placeholder="الاسم الكامل للطالب" className="w-full p-3.5 bg-slate-50 border rounded-2xl outline-none focus:border-emerald-700 text-sm" value={newStd.name} onChange={e => setNewStd({...newStd, name:e.target.value})} />
                                <input required placeholder="رقم الجوال (05xxxx)" className="w-full p-3.5 bg-slate-50 border rounded-2xl outline-none focus:border-emerald-700 text-sm" value={newStd.phone} onChange={e => setNewStd({...newStd, phone:e.target.value})} />
                                <input required placeholder="اسم الحلقة" className="w-full p-3.5 bg-slate-50 border rounded-2xl outline-none focus:border-emerald-700 text-sm" value={newStd.group} onChange={e => setNewStd({...newStd, group:e.target.value})} />
                                <div className="flex gap-2 pt-3">
                                    <button type="submit" className="flex-1 bg-emerald-800 text-amber-200 py-3.5 rounded-2xl font-bold shadow-lg">حفظ الطالب</button>
                                    <button type="button" onClick={() => setShowAddStd(false)} className="px-6 bg-slate-100 rounded-2xl font-bold text-slate-600">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {editStd && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={async e => {
                                e.preventDefault();
                                const {id, ...rest} = editStd;
                                await db.collection('students').doc(id).update({...rest, absences: Number(rest.absences), missedHomework: Number(rest.missedHomework), pledges: Number(rest.pledges)});
                                setEditStd(null); toastMsg("تم تحديث بيانات الطالب");
                            }} className="bg-white w-full max-w-md rounded-3xl p-8 space-y-4 shadow-2xl animate-in card-gold-border">
                                <h3 className="text-xl font-bold border-b pb-3 text-emerald-950">تعديل بيانات الطالب</h3>
                                <input required className="w-full p-3.5 bg-slate-50 border rounded-2xl outline-none text-sm" value={editStd.name} onChange={e => setEditStd({...editStd, name:e.target.value})} />
                                <input required className="w-full p-3.5 bg-slate-50 border rounded-2xl outline-none text-sm" value={editStd.phone} onChange={e => setEditStd({...editStd, phone:e.target.value})} />
                                <input required className="w-full p-3.5 bg-slate-50 border rounded-2xl outline-none text-sm" value={editStd.group} onChange={e => setEditStd({...editStd, group:e.target.value})} />
                                <div className="grid grid-cols-3 gap-2">
                                    <div><label className="text-[10px] font-bold block mb-1">الغياب</label><input type="number" className="w-full p-2 bg-slate-50 border rounded-xl text-center" value={editStd.absences} onChange={e => setEditStd({...editStd, absences:e.target.value})} /></div>
                                    <div><label className="text-[10px] font-bold block mb-1">الواجب</label><input type="number" className="w-full p-2 bg-slate-50 border rounded-xl text-center" value={editStd.missedHomework} onChange={e => setEditStd({...editStd, missedHomework:e.target.value})} /></div>
                                    <div><label className="text-[10px] font-bold block mb-1">التعهد</label><input type="number" className="w-full p-2 bg-slate-50 border rounded-xl text-center" value={editStd.pledges} onChange={e => setEditStd({...editStd, pledges:e.target.value})} /></div>
                                </div>
                                <select className="w-full p-3 bg-slate-50 border rounded-2xl outline-none text-xs font-bold" value={editStd.active ? "T" : "F"} onChange={e => setEditStd({...editStd, active: e.target.value === 'T'})}>
                                    <option value="T">مستمر</option>
                                    <option value="F">منقطع</option>
                                </select>
                                <div className="flex gap-2 pt-3">
                                    <button type="submit" className="flex-1 bg-emerald-800 text-amber-200 py-3.5 rounded-2xl font-bold shadow-lg">تحديث</button>
                                    <button type="button" onClick={() => setEditStd(null)} className="px-6 bg-slate-100 rounded-2xl font-bold text-slate-600">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showPledge && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={addPledge} className="bg-white w-full max-w-md rounded-3xl p-8 space-y-4 shadow-2xl animate-in card-gold-border">
                                <h3 className="text-xl font-bold border-b pb-2 text-purple-900">تسجيل تعهد تأديبي</h3>
                                <p className="text-sm font-bold text-slate-700">{showPledge.name} - {showPledge.group}</p>
                                <textarea required placeholder="اكتب سبب التعهد بالتفصيل..." className="w-full p-3.5 bg-slate-50 border rounded-2xl h-28 outline-none focus:border-purple-600 text-xs" value={pReason} onChange={e => setPReason(e.target.value)} />
                                <div className="flex
