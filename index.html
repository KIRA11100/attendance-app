<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الغياب والحلقات</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Data ---
        const initialStudents = [
            { id: 1, name: "أحمد محمد علي", phone: "966500000001", group: "حلقة أبو بكر الصديق", absences: 1 },
            { id: 2, name: "سارة عبد الرحمن", phone: "966500000002", group: "حلقة عثمان بن عفان", absences: 4 },
            { id: 3, name: "خالد وليد حسن", phone: "966500000003", group: "حلقة أبو بكر الصديق", absences: 7 },
            { id: 4, name: "ليلى محمود", phone: "966500000004", group: "حلقة علي بن أبي طالب", absences: 0 },
            { id: 5, name: "عمر يوسف", phone: "966500000005", group: "حلقة عثمان بن عفان", absences: 3 },
            { id: 6, name: "عبدالله فهد", phone: "966500000006", group: "حلقة عمر بن الخطاب", absences: 2 },
        ];

        const initialTemplate = "عزيزي ولي أمر الطالب/ة {student_name}، نفيدكم علماً بغياب الطالب اليوم {date}. نرجو التواصل معنا. علماً أن عدد غياباته الإجمالي: {absence_count}";

        // --- Components ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) {
                    lucide.createIcons(); 
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-lg text-white transition-all transform animate-bounce ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                    {message}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null); // { role: 'supervisor' | 'monitor' }
            const [view, setView] = useState('dashboard'); // supervisor views: dashboard, students, settings
            const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem('students')) || initialStudents);
            const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('logs')) || []);
            const [template, setTemplate] = useState(() => localStorage.getItem('sms_template') || initialTemplate);
            const [toast, setToast] = useState(null);
            
            // Login State
            const [pin, setPin] = useState("");
            const [selectedRole, setSelectedRole] = useState('monitor');

            // Monitor State (Active Group & Checked Absentees)
            const [activeGroup, setActiveGroup] = useState(null);
            const [attendanceBatch, setAttendanceBatch] = useState({}); // studentId: boolean

            // Persist Data
            useEffect(() => { localStorage.setItem('students', JSON.stringify(students)); }, [students]);
            useEffect(() => { localStorage.setItem('logs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('sms_template', template); }, [template]);

            const showToast = (msg, type = 'success') => setToast({ msg, type });

            // Extract Unique Groups (الحلقات)
            const groups = useMemo(() => {
                const set = new Set(students.map(s => s.group.trim()).filter(Boolean));
                return Array.from(set);
            }, [students]);

            const handleLogin = () => {
                if (selectedRole === 'supervisor' && pin === '1234') {
                    setUser({ role: 'supervisor' });
                } else if (selectedRole === 'monitor' && pin === '0000') {
                    setUser({ role: 'monitor' });
                } else {
                    alert("رمز التحقق غير صحيح");
                }
            };

            const logout = () => {
                setUser(null);
                setPin("");
                setActiveGroup(null);
                setAttendanceBatch({});
            };

            // Submit Attendance for the active group
            const submitAttendance = () => {
                const groupStudents = students.filter(s => s.group === activeGroup);
                const absentIds = groupStudents
                    .filter(s => attendanceBatch[s.id] === true)
                    .map(s => s.id);

                if (absentIds.length === 0) {
                    if(!confirm(`لم يتم تحديد أي طالب غائب في "${activeGroup}". هل تريد إرسال التقرير كـ 'الكل حاضر'؟`)) return;
                }

                const newLog = {
                    id: Date.now(),
                    date: new Date().toLocaleString('ar-SA'),
                    group: activeGroup,
                    absentees: absentIds,
                    processed: false
                };

                // Update total absence counts for absent students
                const updatedStudents = students.map(s => {
                    if (absentIds.includes(s.id)) {
                        return { ...s, absences: s.absences + 1 };
                    }
                    return s;
                });

                setStudents(updatedStudents);
                setLogs([newLog, ...logs]);
                setAttendanceBatch({});
                setActiveGroup(null); // Return back to groups list
                showToast(`تم إرسال تقرير غياب (${activeGroup}) بنجاح للمشرف`);
            };

            const deleteStudent = (id) => {
                if(confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
                    setStudents(students.filter(s => s.id !== id));
                    showToast("تم حذف الطالب");
                }
            };

            const addStudent = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newStudent = {
                    id: Date.now(),
                    name: formData.get('name').trim(),
                    phone: formData.get('phone').trim(),
                    group: formData.get('group').trim(),
                    absences: 0
                };
                setStudents([...students, newStudent]);
                e.target.reset();
                showToast("تم إضافة الطالب بنجاح");
            };

            const getStatusBadge = (count) => {
                if (count >= 6) return <span className="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">خطر (حمراء)</span>;
                if (count >= 3) return <span className="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs font-bold">تحذير (صفراء)</span>;
                return <span className="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">طبيعي</span>;
            };

            const formatMsg = (student) => {
                return template
                    .replace('{student_name}', student.name)
                    .replace('{date}', new Date().toLocaleDateString('ar-SA'))
                    .replace('{absence_count}', student.absences);
            };

            const markLogProcessed = (logId) => {
                setLogs(logs.map(l => l.id === logId ? {...l, processed: true} : l));
                showToast("تم تحديث الحالة");
            };

            // --- Views ---

            // Login Screen
            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <div className="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                    <Icon name="shield-check" size={32} className="text-white" />
                                </div>
                                <h1 className="text-2xl font-bold text-gray-800">نظام الحضور والغياب</h1>
                                <p className="text-gray-500 mt-2">يرجى تسجيل الدخول للمتابعة</p>
                            </div>

                            <div className="flex gap-4 mb-6">
                                <button 
                                    onClick={() => setSelectedRole('monitor')}
                                    className={`flex-1 py-3 rounded-xl border-2 transition-all ${selectedRole === 'monitor' ? 'border-blue-600 bg-blue-50 text-blue-600 font-bold' : 'border-gray-100 text-gray-400'}`}
                                >
                                    مسجل غياب
                                </button>
                                <button 
                                    onClick={() => setSelectedRole('supervisor')}
                                    className={`flex-1 py-3 rounded-xl border-2 transition-all ${selectedRole === 'supervisor' ? 'border-blue-600 bg-blue-50 text-blue-600 font-bold' : 'border-gray-100 text-gray-400'}`}
                                >
                                    المشرف
                                </button>
                            </div>

                            <div className="space-y-4">
                                <input 
                                    type="password" 
                                    placeholder="رمز الدخول (PIN)" 
                                    className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-center text-2xl tracking-widest outline-none focus:ring-2 focus:ring-blue-500"
                                    value={pin}
                                    onChange={(e) => setPin(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                />
                                <button 
                                    onClick={handleLogin}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold shadow-lg transition-transform active:scale-95"
                                >
                                    دخول
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24">
                    {/* Header */}
                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-2 rounded-lg">
                                    <Icon name="users" size={20} className="text-white" />
                                </div>
                                <span className="font-bold text-gray-700">
                                    {user.role === 'supervisor' ? 'لوحة تحكم المشرف' : 'بوابة تسجيل الغياب'}
                                </span>
                            </div>
                            <button onClick={logout} className="text-red-500 p-2 hover:bg-red-50 rounded-full transition-colors" title="تسجيل الخروج">
                                <Icon name="log-out" />
                            </button>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4">
                        {user.role === 'monitor' ? (
                            /* --- Monitor View --- */
                            <div>
                                {!activeGroup ? (
                                    /* List of Groups / Rings */
                                    <div className="space-y-4">
                                        <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 flex items-center justify-between">
                                            <div>
                                                <h2 className="font-bold text-blue-900 text-lg">قائمة الحلقات / الفصول</h2>
                                                <p className="text-sm text-blue-600 mt-1">اختر الحلقة لتسجيل غياب طلابها</p>
                                            </div>
                                            <div className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm">
                                                {groups.length} حلقات
                                            </div>
                                        </div>

                                        {groups.length === 0 ? (
                                            <div className="text-center py-16 bg-white rounded-3xl border border-dashed border-gray-200">
                                                <Icon name="folder-x" size={40} className="mx-auto text-gray-300 mb-2" />
                                                <p className="text-gray-500">لا توجد حلقات مسجلة حالياً. يرجى إضافتها من حساب المشرف.</p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {groups.map(groupName => {
                                                    const groupCount = students.filter(s => s.group === groupName).length;
                                                    return (
                                                        <div 
                                                            key={groupName}
                                                            onClick={() => {
                                                                setActiveGroup(groupName);
                                                                setAttendanceBatch({});
                                                            }}
                                                            className="bg-white p-5 rounded-2xl border border-gray-100 hover:border-blue-300 hover:shadow-md transition-all cursor-pointer flex items-center justify-between group"
                                                        >
                                                            <div className="flex items-center gap-4">
                                                                <div className="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                                                    <Icon name="book-open" size={22} />
                                                                </div>
                                                                <div>
                                                                    <h3 className="font-bold text-gray-800 text-lg">{groupName}</h3>
                                                                    <p className="text-sm text-gray-400 mt-0.5">{groupCount} طالب مسجل</p>
                                                                </div>
                                                            </div>
                                                            <div className="text-gray-400 group-hover:text-blue-600 transition-colors">
                                                                <Icon name="chevron-left" size={22} />
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    /* Single Group Attendance Taking Screen */
                                    <div className="space-y-4">
                                        {/* Back Button & Group Header */}
                                        <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                                            <button 
                                                onClick={() => {
                                                    if(Object.values(attendanceBatch).some(v => v)) {
                                                        if(!confirm("لم يتم إرسال التقرير بعد، هل تريد الرجوع للقائمة الرئيسية؟")) return;
                                                    }
                                                    setActiveGroup(null);
                                                }}
                                                className="flex items-center gap-2 text-sm font-bold text-gray-600 hover:text-blue-600 px-3 py-2 rounded-xl hover:bg-gray-50 transition-colors"
                                            >
                                                <Icon name="arrow-right" size={18} />
                                                رجوع للحلقات
                                            </button>
                                            <div className="text-left">
                                                <h2 className="font-bold text-gray-800">{activeGroup}</h2>
                                                <span className="text-xs text-red-500 font-bold">
                                                    {Object.values(attendanceBatch).filter(Boolean).length} غائب محدد
                                                </span>
                                            </div>
                                        </div>

                                        {/* List of Students in This Group */}
                                        <div className="space-y-2">
                                            {students.filter(s => s.group === activeGroup).map(student => (
                                                <div 
                                                    key={student.id} 
                                                    onClick={() => setAttendanceBatch(prev => ({...prev, [student.id]: !prev[student.id]}))}
                                                    className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${attendanceBatch[student.id] ? 'bg-red-50 border-red-200 shadow-sm' : 'bg-white border-gray-100 hover:border-gray-200'}`}
                                                >
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg ${attendanceBatch[student.id] ? 'bg-red-200 text-red-700' : 'bg-gray-100 text-gray-600'}`}>
                                                            {student.name.charAt(0)}
                                                        </div>
                                                        <div>
                                                            <h3 className="font-bold text-gray-800">{student.name}</h3>
                                                            <p className="text-xs text-gray-400 mt-0.5">الغيابات السابقة: {student.absences}</p>
                                                        </div>
                                                    </div>
                                                    <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors ${attendanceBatch[student.id] ? 'bg-red-500 border-red-500' : 'border-gray-200'}`}>
                                                        {attendanceBatch[student.id] && <Icon name="x" size={16} className="text-white" />}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Floating Submit Button */}
                                        <button 
                                            onClick={submitAttendance}
                                            className="fixed bottom-6 right-4 left-4 max-w-4xl mx-auto bg-green-600 hover:bg-green-700 text-white p-4 rounded-2xl font-bold shadow-2xl flex items-center justify-center gap-2 transition-transform active:scale-95"
                                        >
                                            <Icon name="check-circle" />
                                            إرسال تقرير غياب ({activeGroup})
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            /* --- Supervisor Admin View --- */
                            <div className="space-y-6">
                                {/* Navigation Tabs */}
                                <div className="flex bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                                    <button 
                                        onClick={() => setView('dashboard')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 transition-colors ${view === 'dashboard' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
                                        <Icon name="inbox" /> الوارد
                                    </button>
                                    <button 
                                        onClick={() => setView('students')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 transition-colors ${view === 'students' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
                                        <Icon name="users" /> الطلاب والحلقات
                                    </button>
                                    <button 
                                        onClick={() => setView('settings')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 transition-colors ${view === 'settings' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
                                        <Icon name="settings" /> الإعدادات
                                    </button>
                                </div>

                                {view === 'dashboard' && (
                                    <div className="space-y-4">
                                        <h2 className="text-xl font-bold text-gray-800">تنبيهات الغياب الواردة</h2>
                                        {logs.length === 0 && (
                                            <div className="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200">
                                                <Icon name="coffee" size={48} className="mx-auto text-gray-300 mb-4" />
                                                <p className="text-gray-400">لا توجد تقارير غياب واردة حتى الآن</p>
                                            </div>
                                        )}
                                        {logs.map(log => (
                                            <div key={log.id} className={`bg-white rounded-2xl shadow-sm border transition-all ${log.processed ? 'opacity-60 bg-gray-50 border-gray-200' : 'border-blue-100'}`}>
                                                <div className="p-4 border-b border-gray-50 flex justify-between items-center">
                                                    <div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xs font-bold bg-blue-100 text-blue-700 px-2 py-0.5 rounded-md">
                                                                {log.group || 'جلسة عامة'}
                                                            </span>
                                                            <span className="text-xs text-gray-400">{log.date}</span>
                                                        </div>
                                                    </div>
                                                    {!log.processed ? (
                                                        <button onClick={() => markLogProcessed(log.id)} className="text-xs bg-gray-100 text-gray-600 px-3 py-1.5 rounded-full hover:bg-green-100 hover:text-green-700 transition-colors font-medium">
                                                            تحديد كـ تمت المعالجة
                                                        </button>
                                                    ) : (
                                                        <span className="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold">مكتمل</span>
                                                    )}
                                                </div>
                                                <div className="p-4 space-y-3">
                                                    {log.absentees.length === 0 ? (
                                                        <p className="text-sm text-green-600 font-medium">✓ ممتاز، جميع طلاب هذه الحلقة حاضرون</p>
                                                    ) : (
                                                        log.absentees.map(absentId => {
                                                            const s = students.find(st => st.id === absentId);
                                                            if (!s) return null;
                                                            return (
                                                                <div key={absentId} className="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100">
                                                                    <div>
                                                                        <div className="font-bold text-gray-800">{s.name}</div>
                                                                        <div className="text-xs text-gray-500">{s.phone} | غياباته: {s.absences}</div>
                                                                    </div>
                                                                    <div className="flex gap-2">
                                                                        <button 
                                                                            onClick={() => {
                                                                                navigator.clipboard.writeText(formatMsg(s));
                                                                                showToast("تم نسخ نص الرسالة");
                                                                            }}
                                                                            className="p-2 bg-white text-gray-600 rounded-lg border border-gray-200 hover:text-blue-600 transition-colors"
                                                                            title="نسخ الرسالة"
                                                                        >
                                                                            <Icon name="copy" size={18} />
                                                                        </button>
                                                                        <a 
                                                                            href={`https://wa.me/${s.phone}?text=${encodeURIComponent(formatMsg(s))}`}
                                                                            target="_blank"
                                                                            className="p-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors flex items-center justify-center"
                                                                            title="محادثة واتساب"
                                                                        >
                                                                            <Icon name="send" size={18} />
                                                                        </a>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {view === 'students' && (
                                    <div className="space-y-6">
                                        <form onSubmit={addStudent} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                                            <h3 className="font-bold text-gray-800">إضافة طالب جديد</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <input name="name" required placeholder="اسم الطالب الكامل" className="p-3 bg-gray-50 rounded-xl border border-gray-100 outline-none focus:ring-2 focus:ring-blue-500" />
                                                <input name="phone" required placeholder="رقم ولي الأمر (9665xxxxxxxx)" className="p-3 bg-gray-50 rounded-xl border border-gray-100 outline-none focus:ring-2 focus:ring-blue-500" />
                                                <input name="group" required placeholder="اسم الحلقة أو الفصل" className="p-3 bg-gray-50 rounded-xl border border-gray-100 outline-none focus:ring-2 focus:ring-blue-500" />
                                            </div>
                                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition-all shadow-md">
                                                إضافة الطالب
                                            </button>
                                        </form>

                                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                            <table className="w-full text-right">
                                                <thead className="bg-gray-50 text-gray-500 text-sm">
                                                    <tr>
                                                        <th className="p-4">الطالب</th>
                                                        <th className="p-4">الحلقة</th>
                                                        <th className="p-4">حالة الغياب</th>
                                                        <th className="p-4 text-left">الإجراء</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-50">
                                                    {students.map(s => (
                                                        <tr key={s.id} className="hover:bg-gray-50 transition-colors">
                                                            <td className="p-4">
                                                                <div className="font-bold text-gray-800">{s.name}</div>
                                                                <div className="text-xs text-gray-400">{s.phone}</div>
                                                            </td>
                                                            <td className="p-4 text-gray-600 text-sm font-medium">{s.group}</td>
                                                            <td className="p-4">
                                                                <div className="flex flex-col gap-1 items-start">
                                                                    <span className="text-sm font-bold">{s.absences} غيابات</span>
                                                                    {getStatusBadge(s.absences)}
                                                                </div>
                                                            </td>
                                                            <td className="p-4 text-left">
                                                                <button onClick={() => deleteStudent(s.id)} className="text-red-400 hover:text-red-600 p-2 transition-colors">
                                                                    <Icon name="trash-2" size={18} />
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {view === 'settings' && (
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                                        <h3 className="font-bold text-gray-800">نموذج رسالة الواتساب</h3>
                                        <p className="text-sm text-gray-500">الكلمات التلقائية المتاحة: {'{student_name}'} ، {'{date}'} ، {'{absence_count}'}</p>
                                        <textarea 
                                            className="w-full p-4 h-40 bg-gray-50 border border-gray-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 leading-relaxed"
                                            value={template}
                                            onChange={(e) => setTemplate(e.target.value)}
                                        ></textarea>
                                        <button 
                                            onClick={() => showToast("تم حفظ النموذج بنجاح")}
                                            className="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all"
                                        >
                                            حفظ الإعدادات
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {toast && (
                        <Toast 
                            message={toast.msg} 
                            type={toast.type} 
                            onClose={() => setToast(null)} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
