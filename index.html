<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الغياب والحلقات</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const initialStudents = [
            { id: 1, name: "أحمد محمد علي", phone: "966500000001", group: "حلقة أبو بكر الصديق", absences: 1, active: true },
            { id: 2, name: "سارة عبد الرحمن", phone: "966500000002", group: "حلقة عثمان بن عفان", absences: 4, active: true },
            { id: 3, name: "خالد وليد حسن", phone: "966500000003", group: "حلقة أبو بكر الصديق", absences: 7, active: true },
            { id: 4, name: "ليلى محمود", phone: "966500000004", group: "حلقة علي بن أبي طالب", absences: 0, active: false },
            { id: 5, name: "عمر يوسف", phone: "966500000005", group: "حلقة عثمان بن عفان", absences: 3, active: true },
            { id: 6, name: "عبدالله فهد", phone: "966500000006", group: "حلقة عمر بن الخطاب", absences: 2, active: true },
        ];

        const initialTemplate = "عزيزي ولي أمر الطالب/ة {student_name}، نفيدكم علماً بغياب الطالب اليوم {date}. نرجو التواصل معنا. علماً أن عدد غياباته الإجمالي: {absence_count}";

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    try {
                        if (window.lucide && typeof window.lucide.createIcons === 'function') {
                            lucide.createIcons();
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }, 10);
                return () => clearTimeout(timer);
            }, [name]);

            return <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-lg text-white transition-all transform animate-bounce ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                    {message}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('dashboard');
            const [students, setStudents] = useState(() => {
                try {
                    const saved = localStorage.getItem('students');
                    return saved ? JSON.parse(saved) : initialStudents;
                } catch (e) {
                    return initialStudents;
                }
            });
            const [logs, setLogs] = useState(() => {
                try {
                    const saved = localStorage.getItem('logs');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            });
            const [template, setTemplate] = useState(() => localStorage.getItem('sms_template') || initialTemplate);
            const [toast, setToast] = useState(null);
            
            const [pin, setPin] = useState("");
            const [selectedRole, setSelectedRole] = useState('monitor');

            const [activeGroup, setActiveGroup] = useState(null);
            const [attendanceBatch, setAttendanceBatch] = useState({});
            const fileInputRef = useRef(null);

            // حالة تعديل الطالب
            const [editingStudent, setEditingStudent] = useState(null);
            
            // حالة تحديد الطلاب للحذف
            const [selectedStudents, setSelectedStudents] = useState([]);
            const [filterGroup, setFilterGroup] = useState('ALL');

            useEffect(() => { localStorage.setItem('students', JSON.stringify(students)); }, [students]);
            useEffect(() => { localStorage.setItem('logs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('sms_template', template); }, [template]);

            const showToast = (msg, type = 'success') => setToast({ msg, type });

            const groups = useMemo(() => {
                const set = new Set(students.map(s => s.group ? String(s.group).trim() : '').filter(Boolean));
                return Array.from(set);
            }, [students]);

            const handleLogin = () => {
                if (selectedRole === 'supervisor' && pin === '1234') {
                    setUser({ role: 'supervisor' });
                } else if (selectedRole === 'monitor' && pin === '0000') {
                    setUser({ role: 'monitor' });
                } else {
                    alert("رمز التحقق غير صحيح");
                }
            };

            const logout = () => {
                setUser(null);
                setPin("");
                setActiveGroup(null);
                setAttendanceBatch({});
                setEditingStudent(null);
                setSelectedStudents([]);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        if (data.length === 0) {
                            showToast("الملف فارغ أو التنسيق غير سليم", "error");
                            return;
                        }

                        const newStudentsList = data.map((row, idx) => {
                            const name = row['الاسم'] || row['اسم الطالب'] || row['name'] || row['Name'] || `طالب ${idx + 1}`;
                            let phone = String(row['الرقم'] || row['رقم الجوال'] || row['phone'] || row['Phone'] || '').replace(/[^0-9]/g, '');
                            if (phone.startsWith('05')) {
                                phone = '966' + phone.substring(1);
                            }
                            const group = row['الحلقة'] || row['الفصل'] || row['المجموعة'] || row['group'] || row['Group'] || 'عام';
                            
                            const rawStatus = String(row['الحالة'] || row['status'] || 'مستمر').trim();
                            const isActive = !(rawStatus.includes('منقطع') || rawStatus.includes('غير') || rawStatus.includes('inactive') || rawStatus.includes('false'));

                            return {
                                id: Date.now() + idx,
                                name: String(name).trim(),
                                phone: phone || '966500000000',
                                group: String(group).trim(),
                                absences: Number(row['غيابات'] || row['absences'] || 0),
                                active: isActive
                            };
                        });

                        setStudents(prev => [...prev, ...newStudentsList]);
                        showToast(`تم استيراد ${newStudentsList.length} طالب بنجاح!`);
                        if (fileInputRef.current) fileInputRef.current.value = "";
                    } catch (err) {
                        console.error(err);
                        showToast("حدث خطأ أثناء قراءة الملف، تأكد من صيغة Excel", "error");
                    }
                };
                reader.readAsBinaryString(file);
            };

            const downloadTemplate = () => {
                const templateData = [
                    { "الاسم": "محمد عبدالله", "الرقم": "966501234567", "الحلقة": "حلقة الفجر", "الحالة": "مستمر" },
                    { "الاسم": "سعود خالد", "الرقم": "966551234567", "الحلقة": "حلقة العصر", "الحالة": "مستمر" }
                ];
                const ws = XLSX.utils.json_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "الطلاب");
                XLSX.writeFile(wb, "نموذج_استيراد_الطلاب.xlsx");
            };

            const submitAttendance = () => {
                const currentGroupName = activeGroup;
                const groupStudents = students.filter(s => String(s.group).trim() === String(currentGroupName).trim() && s.active !== false);
                
                const absentIds = groupStudents
                    .filter(s => attendanceBatch[s.id] === true)
                    .map(s => s.id);

                if (absentIds.length === 0) {
                    if(!confirm(`لم يتم تحديد أي طالب غائب في "${currentGroupName}". هل تريد إرسال التقرير كـ 'الكل حاضر'؟`)) return;
                }

                const newLog = {
                    id: Date.now(),
                    date: new Date().toLocaleString('ar-SA'),
                    group: currentGroupName,
                    absentees: absentIds,
                    processed: false
                };

                const updatedStudents = students.map(s => {
                    if (absentIds.includes(s.id)) {
                        return { ...s, absences: (Number(s.absences) || 0) + 1 };
                    }
                    return s;
                });

                setStudents(updatedStudents);
                setLogs(prevLogs => [newLog, ...prevLogs]);
                setAttendanceBatch({});
                setActiveGroup(null);
                showToast(`تم إرسال تقرير غياب (${currentGroupName}) بنجاح للمشرف`);
            };

            const deleteStudent = (id) => {
                if(confirm("هل أنت متأكد من حذف هذا الطالب نهائياً؟")) {
                    setStudents(students.filter(s => s.id !== id));
                    setSelectedStudents(selectedStudents.filter(sid => sid !== id));
                    showToast("تم حذف الطالب");
                }
            };

            const deleteSelectedStudents = () => {
                if (selectedStudents.length === 0) return;
                if (confirm(`هل أنت متأكد من حذف ${selectedStudents.length} طالب محددين نهائياً؟`)) {
                    setStudents(students.filter(s => !selectedStudents.includes(s.id)));
                    setSelectedStudents([]);
                    showToast("تم حذف الطلاب المحددين بنجاح");
                }
            };

            const deleteEntireGroup = (groupName) => {
                if (confirm(`تحذير: هل أنت متأكد من حذف جميع طلاب "${groupName}"؟`)) {
                    setStudents(students.filter(s => String(s.group).trim() !== String(groupName).trim()));
                    showToast(`تم حذف جميع طلاب ${groupName}`);
                }
            };

            const toggleSelectAll = () => {
                const currentList = filteredStudents.map(s => s.id);
                if (selectedStudents.length === currentList.length) {
                    setSelectedStudents([]);
                } else {
                    setSelectedStudents(currentList);
                }
            };

            const toggleStudentSelection = (id) => {
                if (selectedStudents.includes(id)) {
                    setSelectedStudents(selectedStudents.filter(sid => sid !== id));
                } else {
                    setSelectedStudents([...selectedStudents, id]);
                }
            };

            // حفظ بيانات الطالب المعدلة
            const handleUpdateStudent = (e) => {
                e.preventDefault();
                let cleanPhone = String(editingStudent.phone || '').replace(/[^0-9]/g, '');
                if (cleanPhone.startsWith('05')) {
                    cleanPhone = '966' + cleanPhone.substring(1);
                }

                const updatedList = students.map(s => {
                    if (s.id === editingStudent.id) {
                        return {
                            ...editingStudent,
                            name: editingStudent.name.trim(),
                            phone: cleanPhone,
                            group: editingStudent.group.trim(),
                            absences: Number(editingStudent.absences) || 0,
                            active: editingStudent.active === true || editingStudent.active === 'true'
                        };
                    }
                    return s;
                });

                setStudents(updatedList);
                setEditingStudent(null);
                showToast("تم تحديث بيانات الطالب بنجاح");
            };

            const clearAllStudents = () => {
                if(confirm("تحذير أخير: هل أنت متأكد من مسح جميع بيانات الطلاب الحالية في النظام بالكامل؟")) {
                    setStudents([]);
                    setSelectedStudents([]);
                    showToast("تم مسح جميع الطلاب");
                }
            };

            const getStatusBadge = (count) => {
                const c = Number(count) || 0;
                if (c >= 6) return <span className="bg-red-100 text-red-700 px-2 py-0.5 rounded text-xs font-bold">خطر (حمراء)</span>;
                if (c >= 3) return <span className="bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded text-xs font-bold">تحذير (صفراء)</span>;
                return <span className="bg-green-100 text-green-700 px-2 py-0.5 rounded text-xs font-bold">طبيعي</span>;
            };

            const formatMsg = (student) => {
                return template
                    .replace('{student_name}', student.name || '')
                    .replace('{date}', new Date().toLocaleDateString('ar-SA'))
                    .replace('{absence_count}', student.absences || 0);
            };

            const markLogProcessed = (logId) => {
                setLogs(logs.map(l => l.id === logId ? {...l, processed: true} : l));
                showToast("تم تحديث الحالة");
            };

            const filteredStudents = useMemo(() => {
                if (filterGroup === 'ALL') return students;
                return students.filter(s => String(s.group).trim() === filterGroup);
            }, [students, filterGroup]);

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 to-indigo-100">
                        <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
                            <div className="text-center mb-8">
                                <div className="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                    <Icon name="shield-check" size={32} className="text-white" />
                                </div>
                                <h1 className="text-2xl font-bold text-gray-800">نظام الحضور والغياب</h1>
                                <p className="text-gray-500 mt-2">يرجى تسجيل الدخول للمتابعة</p>
                            </div>

                            <div className="flex gap-4 mb-6">
                                <button 
                                    onClick={() => setSelectedRole('monitor')}
                                    className={`flex-1 py-3 rounded-xl border-2 transition-all ${selectedRole === 'monitor' ? 'border-blue-600 bg-blue-50 text-blue-600 font-bold' : 'border-gray-100 text-gray-400'}`}
                                >
                                    مسجل غياب
                                </button>
                                <button 
                                    onClick={() => setSelectedRole('supervisor')}
                                    className={`flex-1 py-3 rounded-xl border-2 transition-all ${selectedRole === 'supervisor' ? 'border-blue-600 bg-blue-50 text-blue-600 font-bold' : 'border-gray-100 text-gray-400'}`}
                                >
                                    المشرف
                                </button>
                            </div>

                            <div className="space-y-4">
                                <input 
                                    type="password" 
                                    placeholder="رمز الدخول (PIN)" 
                                    className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-center text-2xl tracking-widest outline-none focus:ring-2 focus:ring-blue-500"
                                    value={pin}
                                    onChange={(e) => setPin(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                />
                                <button 
                                    onClick={handleLogin}
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold shadow-lg transition-transform active:scale-95"
                                >
                                    دخول
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-24">
                    <header className="bg-white shadow-sm sticky top-0 z-40">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="bg-blue-600 p-2 rounded-lg">
                                    <Icon name="users" size={20} className="text-white" />
                                </div>
                                <span className="font-bold text-gray-700">
                                    {user.role === 'supervisor' ? 'لوحة تحكم المشرف' : 'بوابة تسجيل الغياب'}
                                </span>
                            </div>
                            <button onClick={logout} className="text-red-500 p-2 hover:bg-red-50 rounded-full transition-colors" title="تسجيل الخروج">
                                <Icon name="log-out" />
                            </button>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto p-4">
                        {user.role === 'monitor' ? (
                            <div>
                                {!activeGroup ? (
                                    <div className="space-y-4">
                                        <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 flex items-center justify-between">
                                            <div>
                                                <h2 className="font-bold text-blue-900 text-lg">قائمة الحلقات / الفصول</h2>
                                                <p className="text-sm text-blue-600 mt-1">اختر الحلقة لتسجيل غياب طلابها</p>
                                            </div>
                                            <div className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm">
                                                {groups.length} حلقات
                                            </div>
                                        </div>

                                        {groups.length === 0 ? (
                                            <div className="text-center py-16 bg-white rounded-3xl border border-dashed border-gray-200">
                                                <Icon name="folder-x" size={40} className="mx-auto text-gray-300 mb-2" />
                                                <p className="text-gray-500">لا توجد حلقات مسجلة حالياً. يرجى إضافتها من حساب المشرف.</p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {groups.map(groupName => {
                                                    const activeGroupCount = students.filter(s => String(s.group).trim() === String(groupName).trim() && s.active !== false).length;
                                                    return (
                                                        <div 
                                                            key={groupName}
                                                            onClick={() => {
                                                                setActiveGroup(groupName);
                                                                setAttendanceBatch({});
                                                            }}
                                                            className="bg-white p-5 rounded-2xl border border-gray-100 hover:border-blue-300 hover:shadow-md transition-all cursor-pointer flex items-center justify-between group"
                                                        >
                                                            <div className="flex items-center gap-4">
                                                                <div className="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                                                    <Icon name="book-open" size={22} />
                                                                </div>
                                                                <div>
                                                                    <h3 className="font-bold text-gray-800 text-lg">{groupName}</h3>
                                                                    <p className="text-sm text-gray-400 mt-0.5">{activeGroupCount} طالب نشط</p>
                                                                </div>
                                                            </div>
                                                            <div className="text-gray-400 group-hover:text-blue-600 transition-colors">
                                                                <Icon name="chevron-left" size={22} />
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                                            <button 
                                                onClick={() => {
                                                    if(Object.values(attendanceBatch).some(Boolean)) {
                                                        if(!confirm("لم يتم إرسال التقرير بعد، هل تريد الرجوع للقائمة الرئيسية؟")) return;
                                                    }
                                                    setActiveGroup(null);
                                                }}
                                                className="flex items-center gap-2 text-sm font-bold text-gray-600 hover:text-blue-600 px-3 py-2 rounded-xl hover:bg-gray-50 transition-colors"
                                            >
                                                <Icon name="arrow-right" size={18} />
                                                رجوع للحلقات
                                            </button>
                                            <div className="text-left">
                                                <h2 className="font-bold text-gray-800">{activeGroup}</h2>
                                                <span className="text-xs text-red-500 font-bold">
                                                    {Object.values(attendanceBatch).filter(Boolean).length} غائب محدد
                                                </span>
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            {students.filter(s => String(s.group).trim() === String(activeGroup).trim() && s.active !== false).map(student => (
                                                <div 
                                                    key={student.id} 
                                                    onClick={() => setAttendanceBatch(prev => ({...prev, [student.id]: !prev[student.id]}))}
                                                    className={`p-4 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${attendanceBatch[student.id] ? 'bg-red-50 border-red-200 shadow-sm' : 'bg-white border-gray-100 hover:border-gray-200'}`}
                                                >
                                                    <div className="flex items-center gap-4">
                                                        <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg ${attendanceBatch[student.id] ? 'bg-red-200 text-red-700' : 'bg-gray-100 text-gray-600'}`}>
                                                            {student.name ? student.name.charAt(0) : 'ط'}
                                                        </div>
                                                        <div>
                                                            <h3 className="font-bold text-gray-800">{student.name}</h3>
                                                            <p className="text-xs text-gray-400 mt-0.5">الغيابات السابقة: {student.absences || 0}</p>
                                                        </div>
                                                    </div>
                                                    <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors ${attendanceBatch[student.id] ? 'bg-red-500 border-red-500' : 'border-gray-200'}`}>
                                                        {attendanceBatch[student.id] && <Icon name="x" size={16} className="text-white" />}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <button 
                                            onClick={submitAttendance}
                                            className="fixed bottom-6 right-4 left-4 max-w-4xl mx-auto bg-green-600 hover:bg-green-700 text-white p-4 rounded-2xl font-bold shadow-2xl flex items-center justify-center gap-2 transition-transform active:scale-95"
                                        >
                                            <Icon name="check-circle" />
                                            إرسال تقرير غياب ({activeGroup})
                                        </button>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="flex bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                                    <button 
                                        onClick={() => setView('dashboard')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 transition-colors ${view === 'dashboard' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
                                        <Icon name="inbox" /> الوارد
                                    </button>
                                    <button 
                                        onClick={() => setView('students')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 transition-colors ${view === 'students' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
                                        <Icon name="users" /> الطلاب والحلقات
                                    </button>
                                    <button 
                                        onClick={() => setView('settings')}
                                        className={`flex-1 py-4 text-sm font-bold flex flex-col items-center gap-1 transition-colors ${view === 'settings' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}
                                    >
