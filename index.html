                                                <div className="text-3xl font-extrabold text-rose-600 mt-2">
                                                    {students.filter(s => (Number(s.pledges) || 0) >= 3).length}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-5 space-y-4">
                                            <h3 className="font-bold text-slate-800 text-lg">سجل تفاصيل التعهدات التأديبية الأخيرة</h3>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-right text-sm">
                                                    <thead className="bg-slate-50 text-slate-500 text-xs">
                                                        <tr>
                                                            <th className="p-3 font-bold">التاريخ</th>
                                                            <th className="p-3 font-bold">اسم الطالب</th>
                                                            <th className="p-3 font-bold">الحلقة</th>
                                                            <th className="p-3 font-bold">سبب التعهد</th>
                                                            <th className="p-3 font-bold">إجمالي تعهدات الطالب</th>
                                                            <th className="p-3 font-bold text-center">إجراءات</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {pledgeLogs.map(log => {
                                                            const currentStudent = students.find(s => String(s.id) === String(log.studentId));
                                                            return (
                                                                <tr key={log.id} className="hover:bg-slate-50/80 transition-colors">
                                                                    <td className="p-3 text-xs text-slate-500">{log.date}</td>
                                                                    <td className="p-3 font-bold text-slate-800">{log.studentName}</td>
                                                                    <td className="p-3 text-slate-600">{log.group}</td>
                                                                    <td className="p-3 text-rose-600 font-medium">{log.reason}</td>
                                                                    <td className="p-3 font-bold">{currentStudent?.pledges || 0}</td>
                                                                    <td className="p-3 text-center">
                                                                        <button onClick={() => handleResetPledges(log.studentId, log.studentName)} className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-xl font-bold">
                                                                            تصفير التعهدات
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {view === 'teachers' && (
                                    <div className="space-y-6">
                                        <div className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-sm flex flex-wrap justify-between items-center gap-4">
                                            <div>
                                                <h3 className="font-bold text-slate-800 text-lg">سجل المعلمين وتخصيص رموز الدخول (PIN)</h3>
                                                <p className="text-xs text-slate-400 mt-1">عيّن رمز دخول لكل معلم ليتمكن من الدخول لحلقته ورصد درجاتها فقط</p>
                                            </div>
                                            <button onClick={() => setShowAddTeacherModal(true)} className="bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm">+ إضافة معلم جديد</button>
                                        </div>

                                        <div className="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-right text-sm">
                                                    <thead className="bg-slate-50 text-slate-500 text-xs">
                                                        <tr>
                                                            <th className="p-4 font-bold">اسم المعلم</th>
                                                            <th className="p-4 font-bold">اسم الحلقة المسؤول عنها</th>
                                                            <th className="p-4 font-bold text-emerald-800">رمز الدخول (PIN)</th>
                                                            <th className="p-4 font-bold text-emerald-600">أيام الحضور</th>
                                                            <th className="p-4 font-bold text-rose-600">أيام الغياب</th>
                                                            <th className="p-4 font-bold text-amber-600">أيام الاستئذان</th>
                                                            <th className="p-4 font-bold text-center">إجراءات</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100">
                                                        {sortedTeachers.map(t => (
                                                            <tr key={t.id} className="hover:bg-slate-50/80 transition-colors">
                                                                <td className="p-4 font-bold text-slate-800">{t.name}</td>
                                                                <td className="p-4 text-slate-600 font-bold bg-slate-50/50">{t.subject}</td>
                                                                <td className="p-4">
                                                                    <div className="flex items-center gap-1">
                                                                        <input 
                                                                            type="text" 
                                                                            defaultValue={t.pin || ''} 
                                                                            placeholder="PIN" 
                                                                            className="w-20 p-1.5 border rounded-lg text-center font-mono font-bold text-xs bg-white focus:border-emerald-600 outline-none"
                                                                            onBlur={(e) => handleUpdateTeacherPin(t.id, e.target.value)}
                                                                        />
                                                                        <span className="text-[10px] text-slate-400">حفظ تلقائي</span>
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 font-extrabold text-emerald-600">{t.presentCount || 0} يوم</td>
                                                                <td className="p-4 font-extrabold text-rose-600">{t.absentCount || 0} يوم</td>
                                                                <td className="p-4 font-extrabold text-amber-600">{t.excusedCount || 0} يوم</td>
                                                                <td className="p-4 text-center">
                                                                    <button onClick={() => handleDeleteTeacher(t.id, t.name)} className="text-rose-500 hover:text-rose-700 font-bold text-xs">
                                                                        حذف 🗑️
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {view === 'settings' && (
                                    <div className="bg-white p-6 rounded-3xl border border-slate-200/80 space-y-6 shadow-sm">
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة الغياب للطلاب (بدون عذر)</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-24 text-sm outline-none focus:border-emerald-600 focus:bg-white" value={settings.absence_template} onChange={e => setSettings({...settings, absence_template: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة الاستئذان للطلاب (بعذر)</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-24 text-sm outline-none focus:border-emerald-600 focus:bg-white" value={settings.excused_template} onChange={e => setSettings({...settings, excused_template: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة عدم تسليم الواجب (تنبيهات الواجبات)</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-28 text-sm outline-none focus:border-emerald-600 focus:bg-white" value={settings.homework_template} onChange={e => setSettings({...settings, homework_template: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة تحويل الطالب إلى صفة (مستمع)</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-28 text-sm outline-none focus:border-emerald-600 focus:bg-white" value={settings.listener_template} onChange={e => setSettings({...settings, listener_template: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة نتيجة الاختبار البنائي</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-24 text-sm outline-none focus:border-emerald-600 focus:bg-white" value={settings.formative_exam_template} onChange={e => setSettings({...settings, formative_exam_template: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2">قالب رسالة نتيجة الاختبار النهائي</label>
                                            <textarea className="w-full p-4 bg-slate-50 border rounded-2xl h-24 text-sm outline-none focus:border-emerald-600 focus:bg-white" value={settings.final_exam_template} onChange={e => setSettings({...settings, final_exam_template: e.target.value})} />
                                        </div>
                                        <button onClick={() => { db.collection('settings').doc('app_config').set(settings); showToast("تم حفظ الإعدادات سحابياً"); }} className="bg-emerald-700 hover:bg-emerald-800 text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-md transition-all">
                                            حفظ الإعدادات سحابياً ✓
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {showPledgeModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddPledge} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4 shadow-2xl">
                                <h3 className="text-lg font-bold border-b pb-2 text-slate-800">تسجيل تعهد تأديبي</h3>
                                <div>
                                    <p className="text-sm text-slate-600 font-bold">الطالب: <span className="text-purple-700">{showPledgeModal.name}</span></p>
                                    <p className="text-xs text-slate-400">الحلقة: {showPledgeModal.group} | التعهدات السابقة: {showPledgeModal.pledges || 0}</p>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1">سبب التعهد:</label>
                                    <textarea 
                                        required 
                                        placeholder="مثال: التأخر المتكرر، إثارة الفوضى، إحضار الهاتف..." 
                                        className="w-full p-3 bg-slate-50 border rounded-xl text-sm h-24 outline-none focus:border-purple-600"
                                        value={pledgeReason}
                                        onChange={e => setPledgeReason(e.target.value)}
                                    />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-xl transition-all">تأكيد التعهد سحابياً</button>
                                    <button type="button" onClick={() => setShowPledgeModal(null)} className="px-5 bg-slate-100 text-slate-700 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showAddTeacherModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddTeacher} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4 shadow-2xl">
                                <h3 className="text-lg font-bold border-b pb-2">إضافة معلم وتعيين حسابه</h3>
                                <input required placeholder="اسم المعلم الكامل" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-600" value={newTeacher.name} onChange={e => setNewTeacher({...newTeacher, name: e.target.value})} />
                                <input placeholder="رقم الجوال (اختياري)" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-600" dir="ltr" value={newTeacher.phone} onChange={e => setNewTeacher({...newTeacher, phone: e.target.value})} />
                                <input required placeholder="اسم الحلقة المسؤول عنها بدقة (نفس اسم حلقة الطلاب)" className="w-full p-3 bg-slate-50 border rounded-xl font-bold outline-none focus:border-emerald-600" value={newTeacher.subject} onChange={e => setNewTeacher({...newTeacher, subject: e.target.value})} />
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 mb-1">رمز الدخول الخاص بالمعلم (PIN):</label>
                                    <input required placeholder="مثال: 5566" className="w-full p-3 bg-slate-50 border rounded-xl font-mono text-center tracking-widest outline-none focus:border-emerald-600" value={newTeacher.pin} onChange={e => setNewTeacher({...newTeacher, pin: e.target.value})} />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition-all">حفظ المعلم</button>
                                    <button type="button" onClick={() => setShowAddTeacherModal(false)} className="px-5 bg-slate-100 text-slate-700 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleAddManualStudent} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4 shadow-2xl">
                                <h3 className="text-lg font-bold border-b pb-2">إضافة طالب سحابياً</h3>
                                <input required placeholder="اسم الطالب الكامل" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-600" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                <input required placeholder="رقم الجوال (05xxxx)" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-600" dir="ltr" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} />
                                <input required placeholder="اسم الحلقة أو الفصل" className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-600" value={newStudent.group} onChange={e => setNewStudent({...newStudent, group: e.target.value})} />
                                <select className="w-full p-3 bg-slate-50 border rounded-xl font-bold outline-none focus:border-emerald-600" value={newStudent.active ? "true" : "false"} onChange={e => setNewStudent({...newStudent, active: e.target.value === 'true'})}>
                                    <option value="true">مستمر (نشط)</option>
                                    <option value="false">منقطع</option>
                                </select>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition-all">حفظ في السحابة</button>
                                    <button type="button" onClick={() => setShowAddModal(false)} className="px-5 bg-slate-100 text-slate-700 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {editingStudent && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <form onSubmit={handleSaveEdit} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4 shadow-2xl">
                                <h3 className="text-lg font-bold border-b pb-2">تعديل بيانات الطالب الشاملة</h3>
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-600" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} />
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-600" dir="ltr" value={editingStudent.phone} onChange={e => setEditingStudent({...editingStudent, phone: e.target.value})} />
                                <input required className="w-full p-3 bg-slate-50 border rounded-xl outline-none focus:border-emerald-600" value={editingStudent.group} onChange={e => setEditingStudent({...editingStudent, group: e.target.value})} />
                                <div className="grid grid-cols-4 gap-2">
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold block mb-1">الغيابات</label>
                                        <input type="number" min="0" className="w-full p-2 bg-slate-50 border rounded-xl text-center outline-none focus:border-emerald-600" value={editingStudent.absences} onChange={e => setEditingStudent({...editingStudent, absences: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold block mb-1">الواجبات</label>
                                        <input type="number" min="0" max="15" className="w-full p-2 bg-slate-50 border rounded-xl text-center outline-none focus:border-emerald-600" value={editingStudent.missedHomework || 0} onChange={e => setEditingStudent({...editingStudent, missedHomework: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold block mb-1">التعهدات</label>
                                        <input type="number" min="0" className="w-full p-2 bg-slate-50 border rounded-xl text-center outline-none focus:border-emerald-600" value={editingStudent.pledges || 0} onChange={e => setEditingStudent({...editingStudent, pledges: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold block mb-1">الحالة</label>
                                        <select className="w-full p-2 bg-slate-50 border rounded-xl font-bold text-xs outline-none focus:border-emerald-600" value={editingStudent.active ? "true" : "false"} onChange={e => setEditingStudent({...editingStudent, active: e.target.value === 'true'})}>
                                            <option value="true">مستمر</option>
                                            <option value="false">منقطع</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="submit" className="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition-all">تحديث السحابة</button>
                                    <button type="button" onClick={() => setEditingStudent(null)} className="px-5 bg-slate-100 text-slate-700 rounded-xl">إلغاء</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {importPreview && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                            <div className="bg-white w-full max-w-lg rounded-3xl p-6 space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
                                <h3 className="text-lg font-bold border-b pb-2">معاينة استيراد الطلاب ({importPreview.length})</h3>
                                <div className="overflow-y-auto flex-1 divide-y divide-slate-100">
                                    {importPreview.map((p, i) => (
                                        <div key={i} className="py-2.5 flex justify-between items-center text-xs">
                                            <div>
                                                <div className="font-bold text-slate-800">{p.name}</div>
                                                <div className="text-slate-400" dir="ltr">{p.phone}</div>
                                            </div>
                                            <span className="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-bold">{p.group}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2 pt-2 border-t">
                                    <button onClick={commitExcelImport} className="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition-all">تأكيد الاستيراد السحابي</button>
                                    <button onClick={() => setImportPreview(null)} className="px-5 bg-slate-100 text-slate-700 rounded-xl">إلغاء</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
